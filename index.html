<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI Markdown Chat Interface</title>
  <!-- 引入 highlight.js 样式 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
  <!-- 配置 MathJax（自动渲染数学公式） -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <!-- 引入 highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <!-- 引入 marked.js 用于 Markdown 渲染 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <!-- 引入 MathJax -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js" async></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f7f7f7;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    textarea, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      margin-right: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
    .log {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 20px;
    }
    .message {
      margin-bottom: 20px;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      background: #fefefe;
    }
    .message h3 {
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    pre code {
      background-color: #eee;
      padding: 10px;
      border-radius: 5px;
      display: block;
    }
    /* 按钮样式 */
    .copy-btn, .toggle-btn {
      margin-left: 10px;
      font-size: 12px;
      cursor: pointer;
      padding: 3px 6px;
    }
    .copy-code-btn {
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>AI Markdown Chat Interface</h1>
  <div class="form-group">
    <label for="taskInput">任务描述或问题：</label>
    <textarea id="taskInput" rows="4" placeholder="请输入任务描述或问题"></textarea>
  </div>
  <div class="form-group">
    <label for="apiUrl">API URL:</label>
    <input type="text" id="apiUrl" value="https://api.zetatechs.com/v1/chat/completions">
  </div>
  <div class="form-group">
    <label for="apiKey">API Key:</label>
    <input type="text" id="apiKey" value="sk-7c56ZaiPVJOLPzmAPr07e9DaVsHtyS769tg5yjOGE1aiNtSt">
  </div>
  <div class="form-group">
    <label for="model">模型:</label>
    <input type="text" id="model" value="gemini-2.0-flash-thinking-exp-01-21-free">
  </div>
  <div class="form-group">
    <label for="temperature">Temperature:</label>
    <input type="number" id="temperature" step="0.1" value="0.4">
  </div>
  <div class="form-group">
    <label for="maxTokens">Max Tokens:</label>
    <input type="number" id="maxTokens" value="60000">
  </div>
  <button id="sendRequestBtn">发送请求</button>
  <button id="clearSessionBtn">清除会话</button>
  <button id="downloadLogBtn">下载日志</button>
  
  <div class="log" id="logContainer">
    <h2>会话日志</h2>
    <!-- 在此处追加 Markdown 渲染后的消息 -->
  </div>
</div>

<script>
  // 配置 marked.js 使用 highlight.js 进行代码高亮
  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    }
  });

  // 全局变量，存储整个会话记录
  let conversationLog = {
    user_task: "",
    candidate_responses: [],
    final_best_answer: "",
    details: {}
  };

  // 辅助函数：为代码块添加复制按钮
  function addCopyButtonsToCodeBlocks(container) {
    container.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code');
      if (code) {
        const copyBtn = document.createElement('button');
        copyBtn.innerText = '复制代码';
        copyBtn.className = 'copy-code-btn';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(code.innerText).then(() => {
            copyBtn.innerText = '复制成功';
            setTimeout(() => { copyBtn.innerText = '复制代码'; }, 2000);
          }).catch(() => {
            copyBtn.innerText = '复制失败';
          });
        });
        // 设置 copyBtn 的定位
        pre.style.position = 'relative';
        copyBtn.style.position = 'absolute';
        copyBtn.style.top = '5px';
        copyBtn.style.right = '5px';
        pre.appendChild(copyBtn);
      }
    });
  }

  // 辅助函数：将 Markdown 内容追加到会话日志区域，并增加复制和折叠功能
  function appendLog(title, markdownContent) {
    const logContainer = document.getElementById('logContainer');
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message');

    // 创建标题，并在标题后添加复制整条消息的按钮
    const header = document.createElement('h3');
    header.textContent = title;
    
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '复制';
    copyBtn.classList.add('copy-btn');
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(markdownContent)
        .then(() => alert('文本已复制'))
        .catch(err => alert('复制失败: ' + err));
    });
    header.appendChild(copyBtn);
    messageDiv.appendChild(header);

    // 创建内容区域，并将 Markdown 渲染后的内容插入
    const contentDiv = document.createElement('div');
    contentDiv.innerHTML = marked.parse(markdownContent);
    addCopyButtonsToCodeBlocks(contentDiv);

    // 对候选回答（标题为“请求 1 成功”到“请求 5 ...”）默认折叠，并添加“展开/折叠”按钮；其他保持展开
    if (/^请求 [1-5]( 成功| 失败)?$/.test(title)) {
      contentDiv.style.display = 'none';
      const toggleButton = document.createElement('button');
      toggleButton.textContent = '展开';
      toggleButton.classList.add('toggle-btn');
      toggleButton.addEventListener('click', () => {
        if (contentDiv.style.display === 'none') {
          contentDiv.style.display = 'block';
          toggleButton.textContent = '折叠';
        } else {
          contentDiv.style.display = 'none';
          toggleButton.textContent = '展开';
        }
      });
      messageDiv.appendChild(toggleButton);
    }
    
    messageDiv.appendChild(contentDiv);
    logContainer.appendChild(messageDiv);
    updateMathJax();
  }
  
  // 调用 MathJax 重新渲染以支持数学公式
  function updateMathJax() {
    if (window.MathJax) {
      MathJax.typesetPromise();
    }
  }
  
  // 调用 API 的函数，包含重试机制
  async function callApi(messages, settings) {
    const { apiUrl, apiKey, model, temperature, maxTokens } = settings;
    const headers = {
      "Authorization": "Bearer " + apiKey,
      "Content-Type": "application/json"
    };
    const payload = {
      model: model,
      messages: messages,
      temperature: parseFloat(temperature),
      max_tokens: parseInt(maxTokens)
    };
    const maxRetries = 3;
    const timeout = 30000; // 超时时间：30秒
    for (let attempt = 1; attempt <= maxRetries; attempt++) {
      try {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(id);
        if (response.status === 200) {
          const resJson = await response.json();
          return resJson;
        } else {
          console.log(`尝试 ${attempt}: API 返回错误状态 ${response.status}`);
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
      } catch (error) {
        console.log(`尝试 ${attempt}: 请求异常: ${error}`);
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
    return null;
  }
  
  // 从 API 返回值中提取回答内容（假设结构与 OpenAI 类似）
  function extractContent(apiResponse) {
    try {
      return apiResponse.choices[0].message.content;
    } catch (error) {
      console.log("提取返回内容时出错:", error);
      return "";
    }
  }
  
  // 发送一次请求
  async function sendRequest(index, systemPrompt, userMessage, settings) {
    appendLog(`发送请求 ${index + 1}`, "正在发送请求...");
    const messages = [systemPrompt, userMessage];
    const responseJson = await callApi(messages, settings);
    if (responseJson === null) {
      const msg = `[第${index+1}次请求失败，未获得有效回复]`;
      appendLog(`请求 ${index + 1} 失败`, msg);
      return msg;
    } else {
      const content = extractContent(responseJson);
      appendLog(`请求 ${index + 1} 成功`, content);
      return content;
    }
  }
  
  // “发送请求”按钮点击事件处理
  document.getElementById('sendRequestBtn').addEventListener('click', async () => {
    // 获取用户输入和配置的参数
    const userTask = document.getElementById('taskInput').value;
    const apiUrl = document.getElementById('apiUrl').value;
    const apiKey = document.getElementById('apiKey').value;
    const model = document.getElementById('model').value;
    const temperature = document.getElementById('temperature').value;
    const maxTokens = document.getElementById('maxTokens').value;
    
    // 记录用户任务
    conversationLog.user_task = userTask;
    appendLog("用户任务", userTask);
    
    // 构造系统提示和用户消息
    const systemPrompt = {
      role: "system",
      content: `请仔细理解并严格按照以下任务描述进行回答：\n${userTask}`
    };
    const userMessage = {
      role: "user",
      content: "请基于以上任务描述直接给出你的回答。"
    };
    
    const settings = { apiUrl, apiKey, model, temperature, maxTokens };
    
    appendLog("系统提示", systemPrompt.content);
    appendLog("用户消息", userMessage.content);
    
    // 并发发送 5 次请求
    appendLog("并发请求", "正在并发发送请求，5 次请求将同时发出...");
    const candidateResponses = [];
    const promises = [];
    for (let i = 0; i < 5; i++) {
      promises.push(sendRequest(i, systemPrompt, userMessage, settings));
    }
    const results = await Promise.all(promises);
    
    results.forEach(response => {
      candidateResponses.push(response);
    });
    conversationLog.candidate_responses = candidateResponses;
    
    // 构造检验提示，整合 5 个候选回答
    let validationPrompt = `任务描述：\n${userTask}\n\n` +
      "下面列出了基于任务描述产生的5个回答。请你仔细分析后，判断是否有最准确，最好的回答" +
      "如果你觉得回答的都不够好或者不正确，那你就再思考一次，得出正确答案或者最好的回答，并仅返回该最佳回答的完整内容，不需要其他解释或建议。\n";
    candidateResponses.forEach((candidate, idx) => {
      validationPrompt += `\n【回答 ${idx + 1}】:\n${candidate}\n`;
    });
    
    const validatorMessages = [
      {
        role: "system",
        content: `你现在是一位检验专家，须根据以下任务描述和候选回答判断是否有最准确，最好的回答。如果你觉得回答的都不够好或者不正确，那你就再思考一次，得出正确答案或者最好的回答。任务描述如下：\n${userTask}`
      },
      {
        role: "user",
        content: validationPrompt
      }
    ];
    
    appendLog("检验请求", validationPrompt);
    appendLog("发送检验请求", "正在发送检验请求，请求 AI 根据 5 个回答选出最佳答案...");
    const validatorResponseJson = await callApi(validatorMessages, settings);
    let finalAnswer = "";
    if (validatorResponseJson === null) {
      finalAnswer = "校验请求失败，未获得有效回复。";
    } else {
      finalAnswer = extractContent(validatorResponseJson);
    }
    
    conversationLog.final_best_answer = finalAnswer;
    appendLog("最终最佳答案", finalAnswer);
  });
  
  // “清除会话”按钮事件处理，将所有日志和会话记录清空
  document.getElementById('clearSessionBtn').addEventListener('click', () => {
    conversationLog = {
      user_task: "",
      candidate_responses: [],
      final_best_answer: "",
      details: {}
    };
    document.getElementById('logContainer').innerHTML = "<h2>会话日志</h2>";
  });
  
  // “下载日志”按钮事件处理，将整个会话记录下载为 JSON 文件，文件名包含时间戳
  document.getElementById('downloadLogBtn').addEventListener('click', () => {
    const timestamp = new Date().toISOString().replace(/[^\d]/g, "");
    const filename = `ai_result_${timestamp}.json`;
    const blob = new Blob([JSON.stringify(conversationLog, null, 4)], { type: "application/json;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  });
</script>
</body>
</html>
