<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI模型讨论研究平台</title>
    
    <!-- 外部依赖 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --font-size: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: var(--font-size);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: 100vh;
        }

        .sidebar {
            background: var(--bg-primary);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            overflow-y: auto;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .mode-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 90%;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .message-content {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .message.user .message-content {
            background: var(--primary-color);
            color: white;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            font-size: 12px;
            color: inherit;
        }

        .copy-btn:hover {
            opacity: 1;
        }

        .discussion-container {
            display: none;
            /* MODIFIED: Added properties for scrolling and layout */
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .discussion-container.active {
            display: block;
        }

        .discussion-round {
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .round-header {
            background: var(--bg-tertiary);
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .round-content {
            display: none;
            padding: 15px;
        }

        .round-content.expanded {
            display: block;
        }

        .ai-response {
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .ai-response-header {
            background: var(--bg-tertiary);
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .ai-response-content {
            display: none;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            position: relative; /* MODIFIED: Added for copy button positioning */
        }

        .ai-response-content.expanded {
            display: block;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--secondary-color);
        }

        .status-indicator.loading {
            background: var(--warning-color);
            animation: pulse 1.5s infinite;
        }

        .status-indicator.completed {
            background: var(--success-color);
        }

        .status-indicator.error {
            background: var(--error-color);
        }

        .input-area {
            border-top: 1px solid var(--border-color);
            padding: 20px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-box {
            flex: 1;
            min-height: 50px;
            max-height: 150px;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            resize: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: var(--primary-color);
        }

        .send-btn, .stop-btn {
            padding: 12px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }

        .send-btn:hover, .stop-btn:hover {
            background: var(--primary-dark);
        }

        .stop-btn {
            background: var(--error-color);
            display: none;
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .model-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .model-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .model-item:hover {
            background: var(--bg-secondary);
        }

        .model-checkbox {
            margin: 0;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s;
            font-weight: 500;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn.secondary {
            background: var(--secondary-color);
        }

        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .settings-modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            max-height: 80vh;
            width: 90%;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .setting-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .api-config {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .api-config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .delete-api-btn {
            background: var(--error-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .logs-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .log-entry {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
        }

        .log-entry.collapsed .log-content {
            display: none;
        }

        .log-entry.request {
            background: #eff6ff;
        }

        .log-entry.response {
            background: #f0fdf4;
        }

        .log-entry.error {
            background: #fef2f2;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                height: 100vh;
                padding: 10px;
                gap: 10px;
            }

            .sidebar {
                order: 2;
                max-height: 200px;
            }

            .main-content {
                order: 1;
            }

            .input-container {
                flex-direction: column;
                gap: 10px;
            }

            .send-btn, .stop-btn {
                width: 100%;
            }
        }

        /* Markdown 样式 */
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            margin: 20px 0 10px 0;
            color: var(--text-primary);
        }

        .markdown-content p {
            margin: 10px 0;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 10px 0;
            padding-left: 20px;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 15px;
            margin: 15px 0;
            color: var(--text-secondary);
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-content th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }

        .markdown-content code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .markdown-content pre {
            background: var(--bg-tertiary) !important;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
            position: relative;
        }

        .markdown-content pre code {
            background: none;
            padding: 0;
        }

        /* 防止HTML代码被解析 */
        .raw-html {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            background: var(--bg-tertiary);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">对话模式</div>
                <button class="btn" id="normalModeBtn">普通AI对话</button>
                <button class="btn secondary" id="researchModeBtn">AI讨论研究</button>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">可用模型</div>
                <div class="model-list" id="modelList">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <div class="sidebar-section">
                <button class="btn" id="settingsBtn">⚙️ 设置</button>
                <button class="btn secondary" id="clearChatBtn">🗑️ 清空对话</button>
                <button class="btn secondary" id="clearLogsBtn">📝 清空日志</button>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">对话日志</div>
                <div class="logs-container" id="logsContainer">
                    <!-- 日志条目 -->
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="header">
                <h1>AI模型讨论研究平台</h1>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="chatModeBtn">💬 对话</button>
                    <button class="mode-btn" id="discussModeBtn">🧠 研究</button>
                </div>
            </div>
            
            <div class="chat-area" id="chatArea">
                <div class="message ai">
                    <div class="message-header">
                        <span>🤖 系统</span>
                        <span>刚刚</span>
                    </div>
                    <div class="message-content">
                        <button class="copy-btn" onclick="copyMessage(this)">📋</button>
                        <div class="markdown-content">
                            <p>欢迎使用AI模型讨论研究平台！</p>
                            <p><strong>普通对话模式</strong>：与单个AI模型进行对话</p>
                            <p><strong>讨论研究模式</strong>：多个AI模型协同讨论，通过5轮智能流程确保答案准确性：</p>
                            <ol>
                                <li><strong>初始回答</strong>：所有模型并行回答问题</li>
                                <li><strong>交叉检验</strong>：模型互相检查和评估</li>
                                <li><strong>优化改进</strong>：基于反馈修正答案</li>
                                <li><strong>综合整理</strong>：生成最终综合答案</li>
                                <li><strong>最终验证</strong>：深度研究模型验证结果</li>
                            </ol>
                            <p>请先在设置中配置您的API信息，然后开始使用！</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="discussion-container" id="discussionContainer">
                <!-- 讨论轮次将在这里动态生成 -->
            </div>
            
            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        class="input-box" 
                        id="messageInput" 
                        placeholder="输入您的消息..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn">发送</button>
                    <button class="stop-btn" id="stopBtn">停止</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 设置模态框 -->
    <div class="settings-modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="close-btn" id="closeSettingsBtn">✕</button>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">字体大小 (px)</label>
                <input type="number" class="setting-input" id="fontSizeInput" value="14" min="10" max="24">
            </div>
            
            <div class="setting-group">
                <label class="setting-label">
                    <input type="checkbox" id="enableMaxTokens"> 启用最大Token限制
                </label>
                <input type="number" class="setting-input" id="maxTokensInput" value="2000" min="100" max="32000" disabled>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">
                    <input type="checkbox" id="enableContextLimit"> 启用上下文记忆限制
                </label>
                <input type="number" class="setting-input" id="contextLimitInput" value="10" min="1" max="50" disabled>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">
                    <input type="checkbox" id="enableStream" checked> 启用流式回复
                </label>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">
                    <input type="checkbox" id="enableVision"> 启用图像理解功能
                </label>
            </div>
            
            <div class="setting-group">
                <h3>API配置</h3>
                <div id="apiConfigs">
                    <!-- API配置将在这里动态生成 -->
                </div>
                <button class="btn" id="addApiBtn">➕ 添加API</button>
            </div>
            
            <div class="setting-group">
                <button class="btn" id="saveSettingsBtn">保存设置</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentMode = 'chat'; // 'chat' 或 'discussion'
        let isGenerating = false;
        let abortController = null;
        let settings = {
            fontSize: 14,
            enableMaxTokens: false,
            maxTokens: 2000,
            enableContextLimit: false,
            contextLimit: 10,
            enableStream: true,
            enableVision: false,
            apis: []
        };
        
        // 讨论状态
        let discussionState = {
            currentRound: 0,
            rounds: [],
            isRunning: false,
            models: []
        };

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            loadSettings();
            updateFontSize();
            initializeEventListeners();
            updateModelList();
            
            // 设置 marked 选项
            marked.setOptions({
                highlight: function(code, lang) {
                    if (Prism.languages[lang]) {
                        return Prism.highlight(code, Prism.languages[lang], lang);
                    } else {
                        return code;
                    }
                },
                breaks: true,
                gfm: true
            });
        }

        function initializeEventListeners() {
            // 模式切换
            document.getElementById('chatModeBtn').addEventListener('click', () => switchMode('chat'));
            document.getElementById('discussModeBtn').addEventListener('click', () => switchMode('discussion'));
            document.getElementById('normalModeBtn').addEventListener('click', () => switchMode('chat'));
            document.getElementById('researchModeBtn').addEventListener('click', () => switchMode('discussion'));
            
            // 发送消息
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('stopBtn').addEventListener('click', stopGeneration);
            document.getElementById('messageInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // 自动调整输入框高度
            document.getElementById('messageInput').addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            });
            
            // 设置相关
            document.getElementById('settingsBtn').addEventListener('click', () => {
                document.getElementById('settingsModal').classList.add('active');
            });
            document.getElementById('closeSettingsBtn').addEventListener('click', () => {
                document.getElementById('settingsModal').classList.remove('active');
            });
            document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
            document.getElementById('addApiBtn').addEventListener('click', addApiConfig);
            
            // 清空功能
            document.getElementById('clearChatBtn').addEventListener('click', clearChat);
            document.getElementById('clearLogsBtn').addEventListener('click', clearLogs);
            
            // 设置项目变化监听
            document.getElementById('enableMaxTokens').addEventListener('change', function() {
                document.getElementById('maxTokensInput').disabled = !this.checked;
            });
            document.getElementById('enableContextLimit').addEventListener('change', function() {
                document.getElementById('contextLimitInput').disabled = !this.checked;
            });
            document.getElementById('fontSizeInput').addEventListener('input', function() {
                updateFontSize(this.value);
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            
            // 更新按钮状态
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('secondary'));
            
            if (mode === 'chat') {
                document.getElementById('chatModeBtn').classList.add('active');
                document.getElementById('normalModeBtn').classList.remove('secondary');
                document.getElementById('researchModeBtn').classList.add('secondary');
                document.getElementById('chatArea').style.display = 'flex';
                document.getElementById('discussionContainer').classList.remove('active');
                document.getElementById('messageInput').placeholder = '输入您的消息...';
            } else {
                document.getElementById('discussModeBtn').classList.add('active');
                document.getElementById('researchModeBtn').classList.remove('secondary');
                document.getElementById('normalModeBtn').classList.add('secondary');
                document.getElementById('chatArea').style.display = 'none';
                document.getElementById('discussionContainer').classList.add('active');
                document.getElementById('messageInput').placeholder = '输入要研究讨论的问题...';
            }
        }

        async function sendMessage() {
            if (isGenerating) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            
            input.value = '';
            input.style.height = 'auto';
            
            if (currentMode === 'chat') {
                await handleNormalChat(message);
            } else {
                await handleDiscussionResearch(message);
            }
        }

        async function handleNormalChat(message) {
            // 显示用户消息
            appendMessage('user', '您', message);

        async function handleDiscussionResearch(question) {

                appendMessage('ai', '系统', '讨论研究模式需要至少选择2个模型');

        async function executeDiscussionFlow() {
            const { question, models } = discussionState;
            
            // 第一轮：初始回答阶段
            await executeRound1_InitialAnswers(question, models);
            if (!discussionState.isRunning) return;
            
            // 第二轮：交叉检验阶段
            await executeRound2_CrossValidation(models);
            if (!discussionState.isRunning) return;
            
            // 第三轮：优化改进阶段
            await executeRound3_Improvement(models);
            if (!discussionState.isRunning) return;
            
            // 第四轮：综合整理阶段
            await executeRound4_Synthesis(models);
            if (!discussionState.isRunning) return;
            
            // 第五轮：最终验证阶段（如果有深度研究模型）
            const researchModels = models.filter(m => m.type === 'research');
            if (researchModels.length > 0) {
                await executeRound5_FinalVerification(researchModels);
            }
        }

        function stopGeneration() {
            if (abortController) {
                abortController.abort();
            }
            discussionState.isRunning = false;
            isGenerating = false;
            document.getElementById('sendBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            
            logEntry('info', '用户停止生成', '用户手动停止了生成过程');
        }

        async function callAI(model, messages) {
            const api = settings.apis.find(a => a.id === model.apiId);
            if (!api) {
                throw new Error('未找到对应的API配置');
            }
            
            abortController = new AbortController();
            
            const requestBody = {
                model: model.modelId,
                messages: messages,
                stream: settings.enableStream
            };
            
            if (settings.enableMaxTokens) {
                requestBody.max_tokens = settings.maxTokens;
            }
            
            logEntry('request', `请求 ${model.name}`, JSON.stringify(requestBody, null, 2));
            
            const response = await fetch(api.url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${api.key}`
                },
                body: JSON.stringify(requestBody),
                signal: abortController.signal
            });
            
            if (!response.ok) {
                const errorText = await response.text();
                logEntry('error', `API错误 ${response.status}`, errorText);
                throw new Error(`API错误 ${response.status}: ${errorText}`);
            }
            
            if (settings.enableStream) {
                return await handleStreamResponse(response, model);
            } else {
                const data = await response.json();
                const content = data.choices[0].message.content;
                logEntry('response', `${model.name} 响应`, content);
                return content;
            }
        }

        async function handleStreamResponse(response, model) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let content = '';
            
            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                const delta = parsed.choices[0].delta.content;
                                if (delta) {
                                    content += delta;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }
            } finally {
                reader.releaseLock();
            }
            
            logEntry('response', `${model.name} 响应`, content);
            return content;
        }

        function appendMessage(type, sender, content) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString();
            const icon = type === 'user' ? '👤' : '🤖';
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span>${icon} ${sender}</span>
                    <span>${time}</span>
                </div>
                <div class="message-content">
                    <button class="copy-btn" onclick="copyMessage(this)">📋</button>
                    <div class="markdown-content">${renderMarkdown(content)}</div>
                </div>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function renderMarkdown(content) {
            // 转义HTML标签以防止执行
            const htmlEscaped = content.replace(/```html\n([\s\S]*?)\n```/g, (match, code) => {
                return '```html\n' + escapeHtml(code) + '\n```';
            });
            
            try {
                return marked.parse(htmlEscaped);
            } catch (error) {
                // 如果markdown解析失败，返回原始文本
                return escapeHtml(content);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyMessage(button) {
            const messageContent = button.nextElementSibling;
            const text = messageContent.innerText || messageContent.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = '✅';
                setTimeout(() => {
                    button.innerHTML = originalText;
                }, 1000);
            }).catch(() => {
                button.innerHTML = '❌';
                setTimeout(() => {
                    button.innerHTML = '📋';
                }, 1000);
            });
        }

                const api = settings.apis.find(a => a.id === apiId);
                return {
                    id: `${apiId}-${modelId}`,
                    apiId: apiId,

                    name: cb.nextElementSibling.textContent,
                    type: api?.type || 'normal'

                    <label class="setting-label">名称</label>
                    <input type="text" class="setting-input api-name" placeholder="例如：OpenAI">
                </div>
                <div class="setting-group">
                    <label class="setting-label">API地址</label>
                    <input type="text" class="setting-input api-url" placeholder="https://api.openai.com/v1/chat/completions">
                </div>
                <div class="setting-group">
                    <label class="setting-label">API密钥</label>
                    <input type="password" class="setting-input api-key" placeholder="sk-...">
                </div>
                <div class="setting-group">
                    <label class="setting-label">类型</label>
                    <select class="setting-input api-type">
                        <option value="normal">普通模型</option>
                        <option value="research">深度研究模型</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="setting-label">模型ID（用逗号分隔）</label>
                    <input type="text" class="setting-input api-models" placeholder="gpt-4,gpt-3.5-turbo">
                </div>
            `;
            
            container.appendChild(configDiv);
        }

        function deleteApiConfig(id) {
            const config = document.querySelector(`[data-api-id="${id}"]`);
            if (config) {
                config.remove();
            }
        }

        function updateApiConfigs() {
            const container = document.getElementById('apiConfigs');
            container.innerHTML = '';
            
            settings.apis.forEach(api => {
                const configDiv = document.createElement('div');
                configDiv.className = 'api-config';
                configDiv.dataset.apiId = api.id;
                
                configDiv.innerHTML = `
                    <div class="api-config-header">
                        <h4>API配置 - ${api.name}</h4>
                        <button class="delete-api-btn" onclick="deleteApiConfig('${api.id}')">删除</button>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">名称</label>
                        <input type="text" class="setting-input api-name" value="${api.name}">
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">API地址</label>
                        <input type="text" class="setting-input api-url" value="${api.url}">
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">API密钥</label>
                        <input type="password" class="setting-input api-key" value="${api.key}">
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">类型</label>
                        <select class="setting-input api-type">
                            <option value="normal" ${api.type === 'normal' ? 'selected' : ''}>普通模型</option>
                            <option value="research" ${api.type === 'research' ? 'selected' : ''}>深度研究模型</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">模型ID（用逗号分隔）</label>
                        <input type="text" class="setting-input api-models" value="${api.models.join(', ')}">
                    </div>
                `;
                
                container.appendChild(configDiv);
            });
        }

        function clearChat() {
            if (confirm('确定要清空对话记录吗？')) {
                document.getElementById('chatArea').innerHTML = '';
                document.getElementById('discussionContainer').innerHTML = '';
            }
        }

        function clearLogs() {
            if (confirm('确定要清空日志吗？')) {
                document.getElementById('logsContainer').innerHTML = '';
            }
        }

        function logEntry(type, title, content) {
            const container = document.getElementById('logsContainer');
            const time = new Date().toLocaleTimeString();
            
            const logDiv = document.createElement('div');
            logDiv.className = `log-entry ${type} collapsed`;
            logDiv.innerHTML = `
                <div class="log-header" onclick="toggleLog(this)">
                    [${time}] ${title}
                </div>
                <div class="log-content">${escapeHtml(content)}</div>
            `;
            
            container.insertBefore(logDiv, container.firstChild);
            
            // 限制日志数量
            const logs = container.querySelectorAll('.log-entry');
            if (logs.length > 100) {
                logs[logs.length - 1].remove();
            }
        }

        function toggleLog(header) {
            const logEntry = header.parentElement;
            logEntry.classList.toggle('collapsed');
        }

        // 页面关闭前保存设置
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('aiDiscussionSettings', JSON.stringify(settings));
        });
    </script>
</body>
</html>
