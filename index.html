<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowChat Mobile · Poe API 轮询流式对话站</title>

<!-- 第三方：高亮/Markdown/XSS/MathJax -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script>
  window.MathJax = { tex:{inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']]}, svg:{fontCache:'global'} };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
:root{
  --bg:#0a0f1e; --panel:#0e152b; --card:#111a34;
  --ink:#eef3ff; --muted:#9db0d7; --bd:rgba(255,255,255,.10); --bd2:rgba(255,255,255,.18);
  --brand:#6aa0ff; --brand2:#9b7bff; --ok:#59d99b; --warn:#ffd166; --err:#ff6b6b;
  --radius:16px; --fs:16px; --space:12px; --shadow:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink);
  background: radial-gradient(1400px 700px at 10% -10%, rgba(120,160,255,.18), transparent 55%),
              radial-gradient(1100px 800px at 120% 0%, rgba(155,123,255,.18), transparent 60%),
              var(--bg);
  font: var(--fs)/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
}
a{color:var(--brand);text-decoration:none}
.container{display:flex;flex-direction:column;min-height:100dvh}

/* 顶部栏 */
.header{position:sticky;top:0;z-index:50;backdrop-filter:blur(8px) saturate(140%);
  background:linear-gradient(180deg, rgba(14,21,43,.9), rgba(14,21,43,.62));
  border-bottom:1px solid var(--bd);}
.wrap{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;font-weight:700}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 7px rgba(106,160,255,.25)}
.live{font-size:12px;color:var(--muted)}
.header .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--bd); background:linear-gradient(180deg,#17224a,#0f172e);
  color:var(--ink); padding:9px 12px; border-radius:12px; cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:.15s; white-space:nowrap
}
.btn:hover{border-color:var(--bd2); transform:translateY(-1px)}
.btn.brand{border-color:transparent;background:linear-gradient(180deg,#76a6ff,#6b9dff); color:#0a0f1e; font-weight:600}
.btn.red{border-color:transparent;background:linear-gradient(180deg,#ff8a8a,#ff6b6b); color:#111}
.btn.ghost{background:transparent}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;color:var(--muted)}
.seg button.active{background:linear-gradient(180deg,#1a254f,#141c3c);color:var(--ink)}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);
  padding:6px 10px;border-radius:999px;background:linear-gradient(180deg,#18224a,#121a37);color:var(--muted);font-size:13px}
.switch{position:relative;width:44px;height:24px;border-radius:999px;background:#253157;border:1px solid var(--bd);cursor:pointer}
.switch input{display:none}
.knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#a6b9ff;transition:.18s}
.switch input:checked + .knob{left:22px;background:#cebaff}
.range{display:flex;align-items:center;gap:8px}
.range input{width:120px}

/* 主区域：桌面并排，移动端切 Tab */
.main{max-width:1200px;margin:10px auto;display:grid;gap:12px;padding:0 12px;
  grid-template-columns: 1.5fr .9fr;}
@media (max-width:1100px){ .main{grid-template-columns: 1fr;} }
.panel{background:linear-gradient(180deg,#111939,#0f172e);border:1px solid var(--bd);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;min-height:0}

/* 标签式显示（移动端） */
@media (max-width:1100px){
  body.tab-chat #logsPanel{display:none}
  body.tab-logs #chatPanel{display:none}
}

/* 聊天区 */
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.input{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:linear-gradient(180deg,#111939,#0f172e);color:var(--ink)}
.chat{
  height:calc(100dvh - 220px); /* mobile 视口高度 - 头部+工具栏+composer估算 */
  min-height:46vh; overflow:auto; padding:6px; scroll-behavior:smooth;
}
@media (min-width:1101px){ .chat{height:68vh} }
.msg{display:flex;gap:10px;margin:10px 6px}
.avatar{flex:0 0 34px;height:34px;border-radius:12px;background:linear-gradient(180deg,#6aa0ff,#4b7ad6)}
.msg.user .avatar{background:linear-gradient(180deg,#9b7bff,#6a51ea)}
.bubble{flex:1;background:linear-gradient(180deg,#0e1430,#0b1228);border:1px solid var(--bd);border-radius:14px;padding:12px;position:relative}
.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.tdot{display:inline-flex;gap:3px;margin-left:6px}
.tdot span{width:6px;height:6px;border-radius:50%;background:#87a5ff;opacity:.35;animation:blink 1.2s infinite}
.tdot span:nth-child(2){animation-delay:.15s} .tdot span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.2;transform:translateY(0)} 50%{opacity:.95;transform:translateY(-3px)}}
.content pre{background:#0b1328 !important;border:1px solid var(--bd);border-radius:10px;padding:10px;overflow:auto;position:relative}
.content code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.copy-msg{position:absolute;top:8px;right:8px;font-size:12px;border:1px solid var(--bd);
  padding:3px 8px;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.copy-msg:hover{color:var(--ink);border-color:var(--bd2)}
.copy-code{position:absolute;top:6px;right:6px;font-size:12px;border:1px solid var(--bd);
  padding:2px 6px;border-radius:7px;background:rgba(0,0,0,.2);color:#c9d4ff;cursor:pointer}

/* 选图条 */
.imgbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.imgbar img{height:44px;border-radius:10px;border:1px solid var(--bd)}

/* composer：底部粘性 + 安全区 */
.composer{position:sticky;bottom:0;left:0;right:0;border-top:1px solid var(--bd);
  background:linear-gradient(180deg,#101838,#0e162f); border-radius:12px; padding:8px; margin-top:8px}
.composer .row{display:flex;gap:8px;align-items:flex-end}
textarea{width:100%;min-height:52px;max-height:180px;resize:vertical;border-radius:12px;border:1px solid var(--bd);
  background:linear-gradient(180deg,#111939,#0f172e);color:var(--ink);padding:10px 12px;outline:none}
.safe-bottom{height:calc(env(safe-area-inset-bottom,0px));}

/* 控制台 / 日志 */
h3{margin:6px 0 10px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logs{height:44vh;min-height:260px;overflow:auto}
.log{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;background:linear-gradient(180deg,#0d142c,#0b1126)}
.log .head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);background:#0e214f}
.badge.ok{color:#86efac;border-color:rgba(134,239,172,.45)} .badge.err{color:#ff9e9e;border-color:rgba(255,158,158,.5)}
details{border:1px solid var(--bd);border-radius:10px;margin-top:8px;overflow:hidden}
details>summary{cursor:pointer;padding:8px 10px;background:#0b1228}
details pre{margin:0;padding:10px;background:#081022;overflow:auto}

/* 抽屉（手机端全屏） */
.drawer{position:fixed;inset:auto 0 0 0; top:64px; margin:auto; max-width:520px; width:92vw;
  background:linear-gradient(180deg,#111939,#0f172e); border:1px solid var(--bd); border-radius:16px; box-shadow:var(--shadow);
  padding:14px; display:none; z-index:60}
.drawer.show{display:block;animation:pop .16s ease-out}
@media (max-width:700px){ .drawer{top:0; width:100vw; max-width:100vw; border-radius:0; } }
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* 浮动滚动按钮（移动端） */
.float{position:fixed;right:10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:40}
.floating{border-radius:999px;border:1px solid var(--bd);background:#111939;color:var(--ink);padding:10px 12px;cursor:pointer;opacity:.85}
.floating:hover{opacity:1;border-color:var(--bd2)}
</style>
</head>
<body class="tab-chat">
<div class="container">

  <!-- 顶部 -->
  <div class="header">
    <div class="wrap">
      <div class="brand">
        <div class="dot" id="liveDot"></div>
        <div>FlowChat Mobile</div>
        <span class="live" id="liveText">空闲</span>
      </div>

      <!-- 功能键：移动端紧凑 -->
      <div class="pill">Reasoning
        <label class="switch" title="推理模型：自动附加 --reasoning_effort high">
          <input id="isReasoning" type="checkbox"><span class="knob"></span>
        </label>
      </div>
      <div class="pill">Vision
        <label class="switch" title="多图 image_url">
          <input id="isVision" type="checkbox"><span class="knob"></span>
        </label>
      </div>
      <div class="pill">Streaming
        <label class="switch" title="默认流式">
          <input id="isStream" type="checkbox" checked><span class="knob"></span>
        </label>
      </div>

      <!-- 字体大小 -->
      <div class="pill range" title="字体大小">
        <span style="opacity:.8">A</span>
        <input id="fsRange" type="range" min="14" max="20" value="16">
        <span style="font-weight:700">A</span>
      </div>

      <!-- 视图 & 操作 -->
      <div class="right">
        <div class="seg" role="group" aria-label="视图">
          <button id="tabChat" class="active">聊天</button>
          <button id="tabLogs">日志</button>
        </div>
        <button id="openDrawer" class="btn">⚙️ 设置/密钥</button>
        <button id="newChat" class="btn ghost">🧹 新对话</button>
      </div>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <!-- 聊天 -->
    <section id="chatPanel" class="panel">
      <div class="section-head">
        <div class="kv">
          <input id="modelId" class="input" style="min-width:240px" placeholder="模型ID：如 Claude-Sonnet-4 / Gemini-2.5-Pro / llama-3.1-405b">
          <button id="regenerate" class="btn ghost" title="对上一条AI回复重生">↻ 重生</button>
          <button id="clearBtn" class="btn ghost">清屏</button>
        </div>
      </div>

      <div id="chat" class="chat"></div>

      <div class="composer">
        <div class="row">
          <div style="flex:1">
            <textarea id="userInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            <div class="row" style="margin-top:6px">
              <label class="btn ghost" style="padding:6px 10px">
                选择图片<input id="imagePicker" type="file" accept="image/*" multiple hidden>
              </label>
              <span class="live">多图将以 image_url 段发送（需开启 Vision）。</span>
            </div>
            <div id="imgPreview" class="imgbar"></div>
          </div>
          <div class="row">
            <button id="sendBtn" class="btn brand">发送</button>
            <button id="stopBtn" class="btn red" disabled>中止</button>
          </div>
        </div>
        <div class="safe-bottom"></div>
      </div>
    </section>

    <!-- 日志 -->
    <section id="logsPanel" class="panel">
      <h3>请求 & 日志</h3>
      <div class="row" style="margin-bottom:6px">
        <input id="systemPrompt" class="input" style="flex:1" placeholder="系统提示（可选）：你是专业助理，回答要简洁可靠。">
        <input id="temp" class="input" style="width:110px" value="1" placeholder="温度 0–2">
        <button id="exportChat" class="btn ghost">导出对话(JSON)</button>
        <button id="exportMD" class="btn ghost">导出为 Markdown</button>
        <button id="exportLogs" class="btn ghost">导出日志</button>
      </div>
      <div class="logs" id="logs"></div>
      <div class="live" id="usageHint"></div>
    </section>
  </div>
</div>

<!-- 抽屉：密钥/端点 -->
<div class="drawer" id="drawer">
  <h3 style="margin:4px 0 10px">连接设置</h3>
  <div class="row">
    <textarea id="apiKeys" style="flex:1;min-height:160px;border:1px solid var(--bd);border-radius:10px;
      background:linear-gradient(180deg,#111939,#0f172e);color:var(--ink);padding:10px"
      placeholder="API Keys（每行一个；自动轮转）"></textarea>
  </div>
  <div class="row" style="margin-top:8px">
    <input id="baseUrl" class="input" style="flex:1" placeholder="基地址（默认 https://api.poe.com/v1；如遇 CORS 可填你的代理）">
  </div>
  <div class="row" style="margin-top:10px">
    <button id="saveBtn" class="btn">保存</button>
    <button id="closeDrawer" class="btn ghost">关闭</button>
  </div>
  <div class="live" style="margin-top:6px">密钥仅存本机 localStorage；不要写进源码。</div>
</div>

<!-- 浮动滚动按钮 -->
<div class="float">
  <button id="toBottom" class="floating" title="滚动到底">⤓</button>
  <button id="toTop" class="floating" title="回到顶部">⤒</button>
</div>

<script>
/* ==== 渲染：Markdown 禁 HTML / 高亮 / 数学 ==== */
const md = window.markdownit({
  html:false, linkify:true, breaks:true,
  highlight:(str,lang)=>{ try{
    if(lang && hljs.getLanguage(lang)) return hljs.highlight(str,{language:lang}).value;
    return hljs.highlightAuto(str).value;
  }catch(e){ return hljs.escapeHTML(str); } }
});
function renderMarkdownSafe(s){ return DOMPurify.sanitize(md.render(String(s??""))); }
function typesetMath(el){ if(window.MathJax?.typesetPromise){ MathJax.typesetPromise([el]).catch(()=>{}); } }

/* ==== DOM / 状态 ==== */
const $ = s=>document.querySelector(s);
const chatEl=$("#chat"), logsEl=$("#logs"), liveDot=$("#liveDot"), liveText=$("#liveText");
const isReasoningEl=$("#isReasoning"), isVisionEl=$("#isVision"), isStreamEl=$("#isStream");
let messages=[]; let logs=[]; let controller=null; let rotatingIndex=0; let badKeySet=new Set();
let lastAssistantIndex=-1; let streamRaf=false;

/* ==== 恢复设置（移动端优先） ==== */
(function restore(){
  $("#modelId").value = localStorage.getItem("poe:modelId") || "Claude-Sonnet-4";
  isReasoningEl.checked = localStorage.getItem("poe:isReasoning")==="1";
  isVisionEl.checked    = localStorage.getItem("poe:isVision")==="1";
  $("#systemPrompt").value = localStorage.getItem("poe:sys") || "";
  $("#baseUrl").value = localStorage.getItem("poe:baseUrl") || "";
  $("#temp").value = localStorage.getItem("poe:temp") || "1";
  $("#apiKeys").value = localStorage.getItem("poe:keys") || "";
  const fs = localStorage.getItem("poe:fs") || "16"; $("#fsRange").value = fs; document.documentElement.style.setProperty("--fs", fs+"px");
  isStreamEl.checked = (localStorage.getItem("poe:stream")!=="0");
})();

/* ==== 交互：标签页 / 抽屉 / 字号 / 滚动 ==== */
$("#tabChat").addEventListener("click",()=>{ document.body.className="tab-chat"; $("#tabChat").classList.add("active"); $("#tabLogs").classList.remove("active"); });
$("#tabLogs").addEventListener("click",()=>{ document.body.className="tab-logs"; $("#tabLogs").classList.add("active"); $("#tabChat").classList.remove("active"); });
$("#openDrawer").addEventListener("click",()=> $("#drawer").classList.add("show"));
$("#closeDrawer").addEventListener("click",()=> $("#drawer").classList.remove("show"));
$("#saveBtn").addEventListener("click",()=>{
  localStorage.setItem("poe:modelId", $("#modelId").value.trim());
  localStorage.setItem("poe:isReasoning", isReasoningEl.checked?"1":"0");
  localStorage.setItem("poe:isVision", isVisioning= isVisionEl.checked?"1":"0"); // typo guard
  localStorage.setItem("poe:isVision", isVisionEl.checked?"1":"0");
  localStorage.setItem("poe:sys", $("#systemPrompt").value);
  localStorage.setItem("poe:baseUrl", $("#baseUrl").value.trim());
  localStorage.setItem("poe:temp", $("#temp").value.trim());
  localStorage.setItem("poe:keys", $("#apiKeys").value.trim());
  localStorage.setItem("poe:stream", isStreamEl.checked?"1":"0");
  toast("已保存");
});
$("#fsRange").addEventListener("input",(e)=>{ const v=e.target.value; localStorage.setItem("poe:fs",v); document.documentElement.style.setProperty("--fs", v+"px"); });
$("#toBottom").addEventListener("click",()=> chatEl.scrollTop = chatEl.scrollHeight);
$("#toTop").addEventListener("click",()=> chatEl.scrollTop = 0);

/* 键盘弹起时收缩 chat 高度（移动端） */
if(window.visualViewport){
  const adjust=()=>{ const vb=window.visualViewport; chatEl.style.height = `calc(100dvh - ${Math.min(260, 260 + ( (window.innerHeight - vb.height) || 0))}px)`; };
  window.visualViewport.addEventListener("resize", adjust); window.visualViewport.addEventListener("scroll", adjust);
}

/* ==== 消息组件：气泡 + 复制 ==== */
function addMessageBubble(role, rawContent, meta={}){
  const wrap = document.createElement("div"); wrap.className = "msg " + (role==="user"?"user":"assistant");
  const avatar = document.createElement("div"); avatar.className="avatar"; wrap.appendChild(avatar);

  const bubble = document.createElement("div"); bubble.className="bubble";
  const metaEl = document.createElement("div"); metaEl.className="meta";
  metaEl.innerHTML = `<span>${meta.label || (role==="user"?"你":"AI")}</span>` + (meta.sub?` · <span class="live">${meta.sub}</span>`:"") +
                     (meta.thinking?` <span class="tdot"><span></span><span></span><span></span></span>`:"") +
                     ` · <span class="live">${new Date().toLocaleTimeString()}</span>`;
  bubble.appendChild(metaEl);

  const content = document.createElement("div"); content.className="content";
  const mdText = typeof rawContent==="string" ? rawContent :
    rawContent.map(p=> p.type==="text"?p.text : (p.type==="image_url"?`![image](${p.image_url?.url||""})`:"")).join("\n\n");
  content.dataset.raw = mdText; // 用于复制原始 Markdown
  content.innerHTML = renderMarkdownSafe(mdText);
  bubble.appendChild(content);

  const copyBtn = document.createElement("button"); copyBtn.className="copy-msg"; copyBtn.textContent="复制";
  copyBtn.addEventListener("click",()=> navigator.clipboard.writeText(content.dataset.raw || content.innerText).then(()=>toast("已复制")));
  bubble.appendChild(copyBtn);

  wrap.appendChild(bubble); chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  enhanceCodeBlocks(content);
  typesetMath(content);
  return {wrap, content, metaEl};
}

/* 为代码块添加独立复制按钮（含流式增量时重复调用也安全） */
function enhanceCodeBlocks(scope){
  const blocks = scope.querySelectorAll("pre");
  blocks.forEach(pre=>{
    if(pre.querySelector(".copy-code")) return;
    const btn = document.createElement("button");
    btn.className="copy-code"; btn.textContent="复制代码";
    btn.addEventListener("click",()=>{
      const code = pre.innerText || "";
      navigator.clipboard.writeText(code).then(()=>toast("代码已复制"));
    });
    pre.appendChild(btn);
  });
  scope.querySelectorAll("pre code").forEach(el=>hljs.highlightElement(el));
}

/* ==== 选择图片 ==== */
const pickedImages=[];
$("#imagePicker").addEventListener("change", async (e)=>{
  pickedImages.length=0; $("#imgPreview").innerHTML="";
  const files = Array.from(e.target.files||[]);
  for(const f of files){ const url = await fileToDataURL(f); pickedImages.push(url);
    const img = document.createElement("img"); img.src=url; $("#imgPreview").appendChild(img); }
});
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

/* ==== 发送 / 流式 / 无感轮转 ==== */
$("#sendBtn").addEventListener("click", send);
$("#userInput").addEventListener("keydown",(e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
$("#clearBtn").addEventListener("click",()=>{ messages=[]; chatEl.innerHTML=""; toast("已清屏"); });
$("#newChat").addEventListener("click",()=>{ messages=[]; chatEl.innerHTML=""; logs=[]; logsEl.innerHTML=""; toast("新会话已开始"); });
$("#exportChat").addEventListener("click",()=> downloadFile("chat.json", JSON.stringify(messages,null,2)));
$("#exportMD").addEventListener("click",()=> downloadFile("chat.md", exportAsMarkdown()));
$("#exportLogs").addEventListener("click",()=> downloadFile("logs.json", JSON.stringify(logs,null,2)));
$("#stopBtn").addEventListener("click",()=> controller?.abort());
$("#regenerate").addEventListener("click", regenerateLast);

async function send(){
  const keys = parseKeys($("#apiKeys").value); if(!keys.length){ alert("请先在⚙️抽屉粘贴至少一个 API Key（每行一个）"); return; }
  const model = $("#modelId").value.trim(); if(!model){ alert("请填写模型ID"); return; }
  const isReasoning = isReasoningEl.checked, isVision = isVisionEl.checked, isStream = isStreamEl.checked;

  let text = $("#userInput").value.trim();
  if(!text && (!isVision || pickedImages.length===0)) return;

  const parts=[];
  if(text){
    if(isReasoning && !text.endsWith("--reasoning_effort high")){
      text += (/\s$/.test(text)?"":" ") + "--reasoning_effort high";
    }
    parts.push({type:"text", text});
  }
  if(isVision && pickedImages.length) pickedImages.forEach(u=>parts.push({type:"image_url", image_url:{url:u}}));

  const userMsg = {role:"user", content: parts.length?parts:text};
  messages.push(userMsg); addMessageBubble("user", userMsg.content, {label:"你"});

  $("#userInput").value=""; $("#imgPreview").innerHTML=""; pickedImages.length=0;

  const ai = addMessageBubble("assistant", " ", {label:"AI", sub:model, thinking:true});
  lastAssistantIndex = messages.length; messages.push({role:"assistant", content:""});
  controller = new AbortController(); setLive(true,"AI 正在思考…"); $("#sendBtn").disabled=true; $("#stopBtn").disabled=false;

  const payload = buildPayload(model);
  const baseUrl = ($("#baseUrl").value.trim() || "https://api.poe.com/v1");
  const url = baseUrl + "/chat/completions";
  const startedAt = Date.now(); let usedKeyIndex=-1; let usage=null;

  try{
    if(isStream){
      const {text:finalText, usage:u} = await streamWithRotation(url, payload, keys, ai.content, (idx)=> usedKeyIndex=idx);
      usage = u; finalizeAssistant(ai, finalText, usedKeyIndex, model);
    }else{
      const {data, idx} = await nonStreamWithRotation(url, payload, keys);
      usedKeyIndex = idx; const out = data?.choices?.[0]?.message?.content ?? "";
      usage = data?.usage || null; finalizeAssistant(ai, out, usedKeyIndex, model);
    }
    pushLog({when:new Date(),status:200,ok:true,keyIndex:usedKeyIndex,url,request:payload,response:{note:"OK（可能为流式）"},ms:Date.now()-startedAt});
  }catch(err){
    ai.metaEl.innerHTML = `<span>AI</span> · <span class="live">${model}</span>`;
    updateAssistant(ai.content, `**请求失败**：${escapeHtml(err?.message||"未知错误")}（点“↻ 重生”可重试）`);
    pushLog({when:new Date(),status:0,ok:false,keyIndex:usedKeyIndex,url,request:payload,error:String(err)});
    liveDot.style.boxShadow="0 0 0 7px rgba(255,107,107,.25)"; liveText.textContent="请求失败";
  }finally{
    controller=null; setLive(false); $("#sendBtn").disabled=false; $("#stopBtn").disabled=true;
    if(usage){ $("#usageHint").textContent = `tokens · prompt=${usage.prompt_tokens ?? "-"}, completion=${usage.completion_tokens ?? "-"}, total=${usage.total_tokens ?? "-"}`; }
  }
}

async function regenerateLast(){
  const lastUserIdx = [...messages].map((m,i)=>m.role==="user"?i:-1).filter(i=>i>=0).pop();
  if(lastUserIdx==null) return;
  messages = messages.slice(0, lastUserIdx+1);
  const nodes = chatEl.querySelectorAll(".msg.assistant"); if(nodes.length){ nodes[nodes.length-1].remove(); }
  send();
}

function buildPayload(model){
  const sys = $("#systemPrompt").value.trim();
  const msgs = sys ? [{role:"system", content:sys}, ...messages] : messages.slice();
  return { model, temperature: clamp(parseFloat($("#temp").value),0,2,1), messages: msgs, stream: isStreamEl.checked };
}

/* ==== 流式 & 非流式：后台无感轮转 ==== */
async function streamWithRotation(url, payload, keys, contentNode, setIdx){
  let attempt=0; let idx=nextGoodKeyIndex(keys.length); let acc=""; let usage=null;
  while(attempt < keys.length){
    setIdx(idx);
    try{
      const {reader,res} = await openStream(url, payload, keys[idx]);
      if(!res.ok) throw await httpErr(res);
      acc=""; contentNode.innerHTML="";
      await readSSE(reader, (delta)=>{
        acc += delta; updateAssistant(contentNode, acc);
      }, (meta)=>{ if(meta?.usage) usage = meta.usage; });
      return {text:acc, usage};
    }catch(e){
      markKeyBadIfNeed(e, idx);
      pushLog({when:new Date(),status:e.status||0,ok:false,keyIndex:idx,url,request:payload,error:(e?.message||"stream error")+" → 切换Key"});
      attempt++; idx = nextGoodKeyIndex(keys.length);
      if(attempt>=keys.length) throw e;
    }
  }
  throw new Error("所有 Key 均不可用或失败");
}
async function nonStreamWithRotation(url, payload, keys){
  for(let i=0;i<keys.length;i++){
    const idx = nextGoodKeyIndex(keys.length);
    try{
      const res = await fetchMaybeProxy(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+keys[idx]},
        body:JSON.stringify({...payload, stream:false}), signal:controller?.signal});
      const raw = await res.text(); let data; try{ data=JSON.parse(raw); }catch{ data={raw}; }
      if(!res.ok) throw await httpErr(res, data);
      return {data, idx};
    }catch(e){
      markKeyBadIfNeed(e, idx);
      pushLog({when:new Date(),status:e.status||0,ok:false,keyIndex:idx,url,request:payload,error:(e?.message||"error")+" → 轮转下一把"});
      continue;
    }
  }
  throw new Error("所有 Key 均不可用或失败");
}
function nextGoodKeyIndex(n){
  for(let i=0;i<n;i++){ const idx=(rotatingIndex+i)%n; if(!badKeySet.has(idx)){ rotatingIndex=(idx+1)%n; return idx; } }
  const idx=rotatingIndex; rotatingIndex=(rotatingIndex+1)%n; return idx;
}
function markKeyBadIfNeed(e, idx){ if([401,402,403].includes(e?.status)) badKeySet.add(idx); }
async function openStream(url, payload, key){
  const res = await fetchMaybeProxy(url,{
    method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({...payload, stream:true}), signal:controller?.signal
  });
  const reader = res.body?.getReader(); return {reader,res};
}
async function readSSE(reader, onDelta, onMeta){
  const dec=new TextDecoder(); let buf="";
  while(true){
    const {done, value} = await reader.read(); if(done) break;
    buf += dec.decode(value,{stream:true});
    let p; while((p=buf.indexOf("\n\n"))>=0){
      const pkt = buf.slice(0,p).trim(); buf = buf.slice(p+2);
      pkt.split("\n").forEach(line=>{
        const m=line.match(/^data:\s*(.*)$/); if(!m) return;
        const d=m[1]; if(d==="[DONE]") return;
        try{ const obj=JSON.parse(d);
          const delta = obj?.choices?.[0]?.delta?.content ?? "";
          if(delta) onDelta(delta);
          if(obj?.usage) onMeta?.(obj);
        }catch{}
      });
    }
  }
}

/* ==== 渲染写入 ==== */
function updateAssistant(node, text){
  node.dataset.raw = text;
  node.innerHTML = renderMarkdownSafe(text);
  if(!streamRaf){ streamRaf=true; requestAnimationFrame(()=>{ enhanceCodeBlocks(node); typesetMath(node); streamRaf=false; }); }
}
function finalizeAssistant(ai, text, usedKeyIndex, model){
  ai.metaEl.innerHTML = `<span>AI</span> · <span class="live">${model}</span> · <span class="live">Key#${usedKeyIndex+1}</span>`;
  updateAssistant(ai.content, text || "_（空响应）_");
  messages[messages.length-1] = {role:"assistant", content:text};
}

/* ==== 工具 ==== */
function parseKeys(t){ return (t||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean); }
function clamp(v,min,max,def){ return Number.isFinite(v)?Math.max(min,Math.min(max,v)):def; }
function escapeHtml(s){ return (s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function downloadFile(name,content){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type:"text/plain"})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportAsMarkdown(){
  const out=[]; for(const m of messages){ out.push(m.role==="user"?"**你：**":"**AI：**");
    const t = typeof m.content==="string" ? m.content : m.content.map(p=> p.type==="text"?p.text : (p.type==="image_url"?`![image](${p.image_url.url})`:"")).join("\n\n");
    out.push(t,""); } return out.join("\n");
}
function pushLog(entry){
  logs.push(entry);
  const box=document.createElement("div"); box.className="log";
  const head=document.createElement("div"); head.className="head";
  head.innerHTML = `<span class="badge ${entry.ok?'ok':'err'}">${entry.ok?'OK':'ERR'}</span> <span style="margin-left:6px">Key#${(entry.keyIndex??0)+1}</span>
                    ${typeof entry.ms==='number'?`<span style="margin-left:8px">${entry.ms}ms</span>`:""}`;
  const tm=document.createElement("div"); tm.textContent=`${new Date(entry.when||Date.now()).toLocaleString()} · HTTP ${entry.status||"-"}`;
  head.appendChild(tm); box.appendChild(head);
  const dj=document.createElement("details"); dj.innerHTML=`<summary>请求 payload</summary><pre>${escapeHtml(JSON.stringify(entry.request,null,2))}</pre>`;
  logsEl.prepend(dj);
  if(entry.response){ const dr=document.createElement("details"); dr.innerHTML=`<summary>响应 body</summary><pre>${escapeHtml(JSON.stringify(entry.response,null,2))}</pre>`; logsEl.prepend(dr); }
  if(entry.error){ const de=document.createElement("details"); de.open=true; de.innerHTML=`<summary style="color:var(--err)">错误</summary><pre>${escapeHtml(String(entry.error))}</pre>`; logsEl.prepend(de); }
  logsEl.prepend(box);
}
async function fetchMaybeProxy(url, options){
  const proxy = $("#baseUrl").value.trim();
  if(proxy && proxy !== "https://api.poe.com/v1"){
    const body = JSON.parse(options.body||"{}");
    return fetch(proxy,{method:"POST",headers:options.headers,body:JSON.stringify({target:url, original:body}),signal:options.signal});
  }
  return fetch(url, options);
}
async function httpErr(res, data){
  const txt = data ? (data.error?.message || JSON.stringify(data).slice(0,400)) : await res.text();
  const err=new Error(txt || `HTTP ${res.status}`); err.status=res.status; return err;
}
function setLive(on, text){
  if(on){ liveDot.style.boxShadow="0 0 0 7px rgba(106,160,255,.25)"; liveText.textContent=text||"AI 正在思考…"; }
  else { liveDot.style.boxShadow="0 0 0 7px rgba(106,160,255,.25)"; liveText.textContent="空闲"; }
}
function toast(t){ liveText.textContent=t; setTimeout(()=> liveText.textContent="空闲", 1300); }

/* ==== 小修复：移动端软键盘回到底部 ==== */
$("#userInput").addEventListener("focus",()=> setTimeout(()=> chatEl.scrollTop = chatEl.scrollHeight, 100));
