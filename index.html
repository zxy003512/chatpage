<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话平台</title>
    <!-- 引入 marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 highlight.js 及样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/common.min.js"></script>
    <style>
        /* 整体背景使用灰白渐变 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to bottom, #e0e0e0, #ffffff);
            font-size: 10px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 主容器，居中且宽度适中 */
        .container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        /* 聊天内容区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            background-color: transparent;
        }
        /* 消息框样式 */
        .message {
            max-width: 80%;
            margin: 5px;
            padding: 8px 12px;
            border-radius: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.4;
            position: relative;
        }
        .message.user {
            background-color: #DCF8C6;
            align-self: flex-end;
        }
        .message.ai {
            background-color: #fff;
            align-self: flex-start;
            border: 1px solid #e0e0e0;
        }
        .message.log {
            background-color: #f0f0f0;
            border: 1px dashed #aaa;
            color: #555;
            font-size: 8px;
        }
        /* 代码区块样式 */
        pre {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 8px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 5px 0;
            font-family: monospace;
        }
        /* 代码块头部样式 */
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #444;
            color: #fff;
            padding: 2px 6px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            font-size: 8px;
        }
        /* 复制按钮样式 */
        .copy-btn, .message-copy-btn {
            background: #007AFF;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 8px;
            cursor: pointer;
            opacity: 0.8;
        }
        .copy-btn:hover, .message-copy-btn:hover {
            opacity: 1;
        }
        /* 下方输入区域 */
        .input-container {
            display: flex;
            align-items: center;
            padding: 5px;
            border-top: 1px solid #ccc;
            background: #fff;
        }
        #user-input {
            flex: 1;
            resize: none;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px;
            margin-right: 5px;
            font-size: inherit;
        }
        #send-button, #settings-button {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            background-color: #007AFF;
            color: #fff;
            cursor: pointer;
            font-size: inherit;
            margin-right: 5px;
        }
        #settings-button {
            background-color: #555;
        }
        /* 设置面板样式 */
        .settings-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            display: none;
            z-index: 10;
            font-size: inherit;
        }
        .settings-panel label {
            display: block;
            margin: 5px 0;
        }
        .settings-panel input, .settings-panel select {
            width: 100%;
            padding: 3px;
            margin-top: 2px;
            box-sizing: border-box;
            font-size: inherit;
        }
        .settings-panel button {
            margin: 5px 2px 0 0;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            background-color: #007AFF;
            color: #fff;
            cursor: pointer;
            font-size: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 聊天消息展示区域 -->
        <div class="chat-container" id="chat-container">
            <!-- 消息会动态添加在这里 -->
        </div>
        <!-- 下方输入发送区域 -->
        <div class="input-container">
            <textarea id="user-input" placeholder="请输入您的消息..."></textarea>
            <button id="send-button">发送</button>
            <button id="settings-button">设置</button>
        </div>
        <!-- 设置面板 -->
        <div class="settings-panel" id="settings-panel">
            <h3 style="font-size:inherit;">设置</h3>
            <label>API地址: <input type="text" id="api-endpoint" value="https://api.zetatechs.com/v1/chat/completions"></label>
            <label>API-Key: <input type="text" id="api-key" value="sk-FTtQGU2Fow30VrxWMtqMoIa9l3Q8KKaAolEvgOWQQaiaRzsD"></label>
            <label>模型: <input type="text" id="model" value="o3-mini-high"></label>
            <label>温度: <input type="number" id="temperature" value="0" step="0.1"></label>
            <label>最大token: <input type="number" id="max-tokens" value="100000"></label>
            <label>上下文记忆条数: <input type="number" id="context-count" value="20"></label>
            <label>字体大小(px): <input type="number" id="font-size" value="10"></label>
            <label>流式回复: 
                <select id="streaming">
                    <option value="false">关闭</option>
                    <option value="true">开启</option>
                </select>
            </label>
            <!-- 后处理设置 -->
            <h4 style="font-size:inherit; margin-top:10px;">后处理设置</h4>
            <label>后处理 API地址: <input type="text" id="post-api-endpoint" value="https://yunwu.ai/v1/chat/completions"></label>
            <label>后处理 API-Key: <input type="text" id="post-api-key" value="sk-8ZzXcWLVopEzfVj5gK90sbO3z2gZJl185VVFcSMSYmsZr8pS"></label>
            <label>后处理模型: <input type="text" id="post-model" value="gpt-4o-mini-2024-07-18"></label>
            <label>后处理温度: <input type="number" id="post-temperature" value="0.4" step="0.1"></label>
            <label>后处理最大token: <input type="number" id="post-max-tokens" value="15000"></label>
            <label>后处理上下文记忆条数: <input type="number" id="post-context-count" value="20"></label>
            <button id="save-settings">保存设置</button>
            <button id="clear-chat">清空对话</button>
            <button id="close-settings">关闭设置</button>
        </div>
        <!-- 日志折叠区域（默认折叠） -->
        <details id="log-details" style="position: absolute; bottom: 60px; left: 10px; right: 10px; background-color: #f9f9f9; border: 1px solid #ccc; border-radius: 5px; max-height: 150px; overflow-y: auto;">
            <summary style="font-size:inherit; cursor: pointer;">日志 (点击展开/折叠)</summary>
            <div id="log-container"></div>
        </details>
    </div>
    <script>
        // 初始化主 AI 设置
        let settings = {
            apiEndpoint: document.getElementById('api-endpoint').value,
            apiKey: document.getElementById('api-key').value,
            model: document.getElementById('model').value,
            temperature: parseFloat(document.getElementById('temperature').value),
            maxTokens: parseInt(document.getElementById('max-tokens').value),
            contextCount: parseInt(document.getElementById('context-count').value),
            fontSize: parseInt(document.getElementById('font-size').value),
            streaming: document.getElementById('streaming').value === 'true'
        };

        // 初始化后处理 AI 设置
        let postSettings = {
            apiEndpoint: document.getElementById('post-api-endpoint').value,
            apiKey: document.getElementById('post-api-key').value,
            model: document.getElementById('post-model').value,
            temperature: parseFloat(document.getElementById('post-temperature').value),
            maxTokens: parseInt(document.getElementById('post-max-tokens').value),
            contextCount: parseInt(document.getElementById('post-context-count').value)
        };

        // 应用字体大小
        document.body.style.fontSize = settings.fontSize + 'px';

        // 聊天记录存储（数组中每条消息保存发送者和内容）
        let messages = [];
        const chatContainer = document.getElementById('chat-container');
        const logContainer = document.getElementById('log-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const settingsButton = document.getElementById('settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        const saveSettingsButton = document.getElementById('save-settings');
        const clearChatButton = document.getElementById('clear-chat');
        const closeSettingsButton = document.getElementById('close-settings');

        // 显示/隐藏设置面板
        settingsButton.addEventListener('click', () => {
            settingsPanel.style.display = 'block';
        });
        closeSettingsButton.addEventListener('click', () => {
            settingsPanel.style.display = 'none';
        });
        saveSettingsButton.addEventListener('click', () => {
            // 主 AI 设置
            settings.apiEndpoint = document.getElementById('api-endpoint').value;
            settings.apiKey = document.getElementById('api-key').value;
            settings.model = document.getElementById('model').value;
            settings.temperature = parseFloat(document.getElementById('temperature').value);
            settings.maxTokens = parseInt(document.getElementById('max-tokens').value);
            settings.contextCount = parseInt(document.getElementById('context-count').value);
            settings.fontSize = parseInt(document.getElementById('font-size').value);
            settings.streaming = document.getElementById('streaming').value === 'true';
            // 后处理 AI 设置
            postSettings.apiEndpoint = document.getElementById('post-api-endpoint').value;
            postSettings.apiKey = document.getElementById('post-api-key').value;
            postSettings.model = document.getElementById('post-model').value;
            postSettings.temperature = parseFloat(document.getElementById('post-temperature').value);
            postSettings.maxTokens = parseInt(document.getElementById('post-max-tokens').value);
            postSettings.contextCount = parseInt(document.getElementById('post-context-count').value);
            document.body.style.fontSize = settings.fontSize + 'px';
            alert('设置已保存');
            settingsPanel.style.display = 'none';
            appendLog("设置已保存：" + JSON.stringify({ main: settings, post: postSettings }));
        });
        clearChatButton.addEventListener('click', () => {
            messages = [];
            chatContainer.innerHTML = '';
            appendLog("聊天记录已清空");
        });

        // 日志输出方法（添加到日志折叠区域）
        function appendLog(logText) {
            const logDiv = document.createElement('div');
            logDiv.classList.add('message', 'log');
            logDiv.innerText = logText;
            if(logContainer) {
                logContainer.appendChild(logDiv);
            }
            console.log("日志：", logText);
        }

        // 新的 parseMarkdown 方法，使用 marked 和 highlight.js 对代码块进行渲染
        function parseMarkdown(text) {
            return marked.parse(text, {
                highlight: function(code, language) {
                    const codeIndex = Date.now() + Math.floor(Math.random() * 10000000);
                    // 代码块头部：显示语言和复制按钮
                    const headerHtml = `<div class="code-block-header">
                                            <span>${language || '代码'}</span>
                                            <span class="copy-btn" onclick="copyCodeById('copy${codeIndex}')">复制代码</span>
                                        </div>`;
                    let highlighted;
                    try {
                        highlighted = language ? hljs.highlight(code, { language: language }).value
                                                 : hljs.highlightAuto(code).value;
                    } catch (e) {
                        console.error(e);
                        highlighted = code;
                    }
                    return headerHtml +
                           `<pre class="hljs-custom hljs"><code>${highlighted}</code></pre>` +
                           `<textarea id="copy${codeIndex}" style="position:absolute; top:-9999px; left:-9999px;">${code.replace(/<\/textarea>/g, "&lt;/textarea>")}</textarea>`;
                }
            });
        }

        // 用于复制代码块内内容，通过 textarea 元素的 id 获取复制文本
        function copyCodeById(id) {
            const elem = document.getElementById(id);
            if (elem) {
                navigator.clipboard.writeText(elem.value).then(() => {
                    alert("复制成功");
                }).catch(err => {
                    console.error("复制代码失败：", err);
                    alert("复制失败");
                });
            }
        }

        // 渲染消息内容
        function renderMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            const contentSpan = document.createElement('span');
            contentSpan.className = "message-content";
            contentSpan.innerHTML = parseMarkdown(message);
            messageDiv.appendChild(contentSpan);
            // 为普通文本消息添加复制按钮（右上角）
            const copyBtn = document.createElement('button');
            copyBtn.classList.add('message-copy-btn');
            copyBtn.innerText = "复制";
            copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(contentSpan.innerText).then(() => {
                    const original = copyBtn.innerText;
                    copyBtn.innerText = "复制成功";
                    setTimeout(() => { copyBtn.innerText = original; }, 2000);
                }).catch(err => {
                    console.error("复制失败：", err);
                });
            });
            messageDiv.appendChild(copyBtn);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 后处理 AI 调用函数，处理主 AI 的回复
        async function processPostResponse(mainAnswer, aiContentSpan) {
            // 构建对话历史，加入系统提示说明后处理要求
            let postMessages = [
                { role: 'system', content: "你是一个后处理助手。当主AI回复中包含代码时，请在回复末尾将原始回答用中括号包裹，并将其中的代码部分用<pre>标签包裹后返回最终结果；如果是HTML代码，还要防止被浏览器直接解析运行，需要你添加防护对 HTML 中的特殊字符（例如 < 和 >）进行转义。如果没有代码，请直接返回原始回答。" },
                { role: 'user', content: mainAnswer }
            ];
            const requestBody = {
                model: postSettings.model,
                messages: postMessages,
                temperature: postSettings.temperature,
                max_tokens: postSettings.maxTokens,
                stream: false
            };
            appendLog("正在发送后处理请求，Request Body：" + JSON.stringify(requestBody));
            try {
                const response = await fetch(postSettings.apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + postSettings.apiKey
                    },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) {
                    const errorMsg = '后处理请求失败，HTTP状态：' + response.status + ' - ' + response.statusText;
                    appendLog(errorMsg);
                    aiContentSpan.innerHTML += '<br>' + errorMsg;
                    return;
                }
                const data = await response.json();
                let processedText = '后处理无回复';
                if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                    processedText = data.choices[0].message.content;
                }
                aiContentSpan.innerHTML = parseMarkdown(processedText);
                appendLog("后处理请求成功，HTTP状态：" + response.status);
            } catch (error) {
                const errMsg = '后处理请求异常：' + error.message;
                appendLog(errMsg);
                aiContentSpan.innerHTML += '<br>' + errMsg;
            }
        }

        // 发送消息处理
        async function sendMessage() {
            const userText = userInput.value.trim();
            if (!userText) return;
            // 添加用户消息
            renderMessage(userText, 'user');
            messages.push({ role: 'user', content: userText });
            // 控制上下文消息条数
            if (messages.length > settings.contextCount) {
                messages = messages.slice(messages.length - settings.contextCount);
            }
            userInput.value = '';
            // 显示 AI 回复的占位符
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.classList.add('message', 'ai');
            const aiContentSpan = document.createElement('span');
            aiContentSpan.className = "message-content";
            aiContentSpan.innerHTML = '...';
            aiMessageDiv.appendChild(aiContentSpan);
            // 添加复制按钮
            const copyBtn = document.createElement('button');
            copyBtn.classList.add('message-copy-btn');
            copyBtn.innerText = "复制";
            copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(aiContentSpan.innerText).then(() => {
                    const original = copyBtn.innerText;
                    copyBtn.innerText = "复制成功";
                    setTimeout(() => { copyBtn.innerText = original; }, 2000);
                }).catch(err => {
                    console.error("复制失败：", err);
                });
            });
            aiMessageDiv.appendChild(copyBtn);
            chatContainer.appendChild(aiMessageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            try {
                const requestBody = {
                    model: settings.model,
                    messages: messages,
                    temperature: settings.temperature,
                    max_tokens: settings.maxTokens,
                    stream: settings.streaming
                };
                appendLog("正在发送请求，Request Body：" + JSON.stringify(requestBody));
                const response = await fetch(settings.apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + settings.apiKey
                    },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) {
                    const errorMsg = '请求失败，HTTP状态：' + response.status + ' - ' + response.statusText;
                    aiContentSpan.innerHTML = errorMsg;
                    appendLog(errorMsg);
                    return;
                }
                let mainAIResponse = '';
                if (settings.streaming) {
                    // 流式回复：逐步读取数据
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let done = false;
                    aiContentSpan.innerHTML = '';
                    while (!done) {
                        const { value, done: doneReading } = await reader.read();
                        done = doneReading;
                        const chunkValue = decoder.decode(value);
                        mainAIResponse += chunkValue;
                        // 每次覆盖为最新累计结果
                        aiContentSpan.innerHTML = parseMarkdown(mainAIResponse);
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                    messages.push({ role: 'assistant', content: mainAIResponse });
                    appendLog("流式请求成功，全部数据接收完毕。");
                    // 调用后处理 AI
                    await processPostResponse(mainAIResponse, aiContentSpan);
                } else {
                    // 非流式回复：解析完整结果
                    const data = await response.json();
                    let aiText = '无回复';
                    if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                        aiText = data.choices[0].message.content;
                    }
                    aiContentSpan.innerHTML = parseMarkdown(aiText);
                    messages.push({ role: 'assistant', content: aiText });
                    appendLog("请求成功，HTTP状态：" + response.status);
                    // 调用后处理 AI
                    await processPostResponse(aiText, aiContentSpan);
                }
            } catch (error) {
                const errMsg = '请求异常：' + error.message;
                aiContentSpan.innerHTML = errMsg;
                appendLog(errMsg);
            }
        }

        // 绑定按钮和输入框事件
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
