        // Handle image upload
        function handleImageUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) {
                // Clear pending attachments if user cancels file selection
                state.imageAttachments = [];
                updateUploadNotice(); // Update or clear the upload notice
                updateSendButtonState(); // Update send button state
                e.target.value = ''; // Reset input even on cancel
                return;
            }

            state.imageAttachments = []; // Clear previous attachments
            let processedCount = 0; // Track processed files

            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) {
                    processedCount++; // Count non-image files as processed (but ignored)
                    if (processedCount === files.length) {
                         updateUploadNotice(); // Update notice after all files processed
                         updateSendButtonState();
                    }
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(evt) {
                    const dataUrl = evt.target.result; // Original data URL (PNG, JPEG, WebP, etc.)
                    const img = new Image();

                    img.onload = function() {
                        // Create a canvas and draw the image onto it
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);

                        // Export as WebP data URL (quality 0-1)
                        const webpDataUrl = canvas.toDataURL('image/webp', 0.8); // You can adjust the quality (e.g., 0.7, 0.9)

                        // Push the WebP data URL to attachments state
                        state.imageAttachments.push({
                            data: webpDataUrl,
                            filename: file.name.replace(/\.\w+$/, '.webp') // Optional: change filename suffix for clarity
                        });

                        processedCount++; // Increment processed count

                        // Update the upload notice only after processing this file
                        updateUploadNotice();

                        // Check if all files are processed
                        if (processedCount === files.length) {
                            elements.visionToggle.checked = true; // Automatically enable vision if images are attached
                            saveSettings();
                            updateSendButtonState(); // Update send button state after processing all images
                        }
                    };

                    img.onerror = function() {
                        console.error(`Failed to load image: ${file.name}`);
                        processedCount++; // Count failed image as processed
                         if (processedCount === files.length) {
                            updateUploadNotice();
                            updateSendButtonState();
                        }
                    };

                    img.src = dataUrl; // Set the image source to the data URL
                };
                reader.readAsDataURL(file);
            });

            // The file input value is reset at the end of the function, AFTER the loop
            // This ensures that if the user selects the same files again, the 'change' event still fires.
            e.target.value = '';
        }

        // Function to update the image upload system notice
        function updateUploadNotice() {
            // Clear any existing image upload system messages first
            elements.chatMessages.querySelectorAll('.message.system-message').forEach(msgElement => {
                if (msgElement.messageObj && msgElement.messageObj.type === 'system' && msgElement.messageObj.text.includes('已上传') && msgElement.messageObj.text.includes('图片')) {
                    msgElement.remove();
                }
            });

            const uploadCount = state.imageAttachments.length;

            if (uploadCount > 0) {
                const messageText = `已上传 ${uploadCount} 张图片，将随下一条消息一起发送。`;
                 addSystemMessage(messageText); // This will create and add the new message element
            }
             // If uploadCount is 0, no notice is added (or existing ones were removed)
        }


        // Send message
        async function sendMessage() {
            // If the button is currently in "Stop" state, execute stop logic
            const sendButtonSpan = elements.sendButton.querySelector('span');
            if (sendButtonSpan && sendButtonSpan.textContent === '停止') {
                stopStreamingRequest();
                return;
            }

            const message = elements.chatInput.value.trim();
            const hasImages = state.imageAttachments.length > 0 && elements.visionToggle.checked;

            if (message === '' && !hasImages) {
                 // If no message and no images (or vision disabled), just update the button state
                 updateSendButtonState();
                 return;
            }

            // Check settings
            if (!elements.apiEndpoint.value || !elements.apiKey.value) {
                addSystemMessage('请先在设置中配置 API 地址和 API Key');
                togglePanel(elements.settingsPanel);
                return;
            }

            // Get selected model
            const selectedModelId = elements.modelSelect.value;
            if (!selectedModelId) {
                addSystemMessage('请至少添加一个模型配置并选择模型');
                togglePanel(elements.settingsPanel);
                return;
            }

            // Add user message to chat
            // We clone state.imageAttachments here because handleImageUpload clears it *after* enqueueing processing.
            // But sendMessage needs the list of images *at the time of sending*.
            // A better approach would be to manage the list of pending images separately from state.imageAttachments.
            // For now, let's clone the current imageAttachments right before clearing.
             const currentImageAttachments = [...state.imageAttachments]; // Clone the array
            await addUserMessage(message, currentImageAttachments); // Ensure user message is rendered (including formulas) before proceeding

            // Clear the image attachments state AFTER adding to user message
            state.imageAttachments = [];
            updateUploadNotice(); // Clear the upload notice as images are now sent

            elements.chatInput.value = ''; // Clear input box

            state.pendingMessages++;
            updateSendButtonState();

            // Build request data
            let content = [];

            // Add text content
            if (message) {
                content.push({
                    type: "text",
                    text: message
                });
            }

            // Add image content (if vision enabled and images were attached)
            if (hasImages && currentImageAttachments.length > 0) {
                 currentImageAttachments.forEach(image => {
                    content.push({
                        type: "image_url",
                        image_url: {
                            url: image.data // Base64 URL (should now be WebP)
                        }
                    });
                 });
            }


            // Build message history
            const messageHistory = getMessageHistory();

            // Build request body
            let requestBody = {
                model: selectedModelId,
                messages: messageHistory.concat([
                    {
                        role: "user",
                        content: content
                    }
                ]),
                temperature: parseFloat(elements.temperature.value),
                max_tokens: parseInt(elements.maxTokens.value),
                stream: elements.streamToggle.checked
            };

            // Add custom parameters
            const customParams = document.querySelectorAll('.param-item');
            if (customParams.length > 0) {
                Array.from(customParams).forEach(param => {
                    const keyInput = param.querySelector('[data-type="param-key"]');
                    const valueInput = param.querySelector('[data-type="param-value"]');
                    const key = keyInput ? keyInput.value.trim() : '';
                    const valueString = valueInput ? valueInput.value.trim() : '';

                    if (key) {
                         let value;
                         try {
                             // Try to parse the value as JSON (e.g., boolean, number, object, array)
                             value = JSON.parse(valueString);
                         } catch (e) {
                             // If parsing fails, treat it as a raw string value
                             value = valueString;
                         }
                        requestBody[key] = value;
                    }
                });
            }

            // Log the request
            const logId = addLog('Sending Request', requestBody);

            // Add AI message placeholder
            const aiMessageParts = addAIMessage('');

            try {
                if (elements.streamToggle.checked) {
                    await streamResponse(requestBody, aiMessageParts, logId); // Add await
                } else {
                    const response = await sendRequest(requestBody);
                    updateLogResponse(logId, response);

                    if (response.error) {
                        throw new Error(response.error.message || 'Request failed');
                    }

                    const aiResponseText = response.choices[0]?.message?.content || ''; // Safely access content
                    await updateAIMessage(aiMessageParts, aiResponseText, true); // Add await, set renderMathNow to true

                    // Note: addThinkingProcess also needs aiMessageParts.element or its child elements
                    if (elements.thinkingToggle.checked && response.choices[0]?.thinking) {
                        addThinkingProcess(aiMessageParts, response.choices[0].thinking); // Adjust addThinkingProcess
                    }
                }
            } catch (error) {
                console.error('API Request failed:', error);
                 const errorMessage = error.message || 'API Request failed';
                addSystemMessage(`API Request failed: ${errorMessage}`);
                updateLogError(logId, errorMessage);

                 // If streaming request failed, remove loading animation and display error (non-streaming errors will also come here)
                 // aiMessageParts object contains all necessary element references
                 if (aiMessageParts && aiMessageParts.contentContainer) {
                     aiMessageParts.contentContainer.classList.remove('loading');
                     const textContainer = aiMessageParts.textContainer;
                     if (textContainer) {
                         // If there's already partial reply, append error message
                         if (aiMessageParts.object.text && aiMessageParts.object.text.trim() !== '') {
                            // Use updateAIMessage to handle Markdown and potential formula rendering
                            await updateAIMessage(aiMessageParts, aiMessageParts.object.text + `\n\n*Error: ${errorMessage}*`, true); // Add await
                         } else {
                            // If no reply received, display error directly
                            textContainer.innerHTML = `<span style="color: red;">Error: ${errorMessage}</span>`;
                         }
                     }
                     scrollToBottom();
                 }

            } finally {
                // Clear image attachments (already cleared at the top)
                state.pendingMessages--;
                // state.streamController = null; // This cleanup is moved to streamResponse's finally
                updateSendButtonState();
            }
        }

        // Stream response handling
        async function streamResponse(requestBody, aiMessageParts, logId) { // Receive aiMessageParts
            let responseText = '';
            let allChunks = '';
            let thinkingProcess = '';
            let errorOccurred = false; // Flag for non-abort errors
            let wasAborted = false;    // Flag for user abort


            try {
                // Create controller
                if (state.streamController) {
                    state.streamController.abort(); // Abort previous unfinished stream
                    // Note: This abort might trigger the catch block of a *previous* call to streamResponse
                    // We need to handle the state correctly across multiple calls/aborts
                }
                state.streamController = new AbortController();
                const signal = state.streamController.signal;

                // Create request
                const response = await fetch(elements.apiEndpoint.value, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${elements.apiKey.value}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: signal
                });

                if (!response.ok) {
                    errorOccurred = true;
                     const errorData = await response.json().catch(() => ({})); // Attempt to parse JSON, okay if it fails
                    throw new Error(errorData.error?.message || `Request failed: ${response.status} ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // Check if the stream was aborted externally during the read operation
                    if (signal.aborted) {
                         wasAborted = true;
                         console.log('Stream aborted during read operation.');
                         reader.cancel('Stream aborted by user/system'); // Attempt to close the reader
                         break; // Exit the loop
                    }


                    const chunk = decoder.decode(value, { stream: true });
                    allChunks += chunk; // Collect all raw chunks for logging

                    // Process SSE format
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.substring(6);

                            // Check for end signal
                            if (data === '[DONE]') continue;

                            try {
                                const json = JSON.parse(data);

                                // Extract thinking process (if available)
                                if (elements.thinkingToggle.checked &&
                                    json.choices &&
                                    json.choices[0] &&
                                    json.choices[0].thinking) {
                                    thinkingProcess = json.choices[0].thinking;
                                     // Update thinking process in real-time (if needed)
                                     addThinkingProcess(aiMessageParts, thinkingProcess);
                                }

                                // Extract content
                                if (json.choices &&
                                    json.choices[0] &&
                                    json.choices[0].delta &&
                                    json.choices[0].delta.content) {
                                    const content = json.choices[0].delta.content;
                                    responseText += content;
                                    // Update message in real-time, but DO NOT render MathJax formulas yet
                                    await updateAIMessage(aiMessageParts, responseText, false); // Add await, set renderMathNow to false
                                }
                            } catch (e) {
                                console.error('Failed to parse stream data:', e, 'Raw data:', data);
                                // Can add a simple error message to the message here, without interrupting the stream
                                // updateAIMessage(aiMessageParts, responseText + `\n[Failed to parse data: ${e.message}]`);
                            }
                        } else if (line.trim() !== '') {
                             // Handle non-SSE format error messages (some APIs might return non-200 status JSON errors)
                             console.error('Received non-SSE line:', line);
                             if (line.includes('"error"')) { // Try to parse potential error JSON
                                 try {
                                      const errorJson = JSON.parse(line);
                                      if(errorJson.error?.message) {
                                          errorOccurred = true;
                                          // Store the error message, don't throw here to allow remaining stream data to be processed (if any)
                                          state.logs.find(log => log.id === logId).error = errorJson.error.message;
                                          console.error("Received error from API during stream:", errorJson.error.message);
                                          // Optionally update the message with error state indicator
                                          // updateAIMessage(aiMessageParts, responseText + `\n\n*API Error: ${errorJson.error.message}*`);
                                      }
                                 } catch (e) {
                                     // ignore parse error, treat as plain text line or continue
                                 }
                             }
                             // If not an error and not SSE, could be empty lines or other info, can ignore or log
                        }
                    }
                }

                // After stream is complete, if successful and there was content, do final Markdown parsing, copy button handling, and MathJax rendering
                if (!errorOccurred && !wasAborted && responseText) {
                    // Call updateAIMessage, and tell it to render MathJax this time
                    await updateAIMessage(aiMessageParts, responseText, true); // Add await, set renderMathNow to true
                }

                // Ensure the last thinking process is displayed (might be redundant if updated real-time, but safer)
                if (elements.thinkingToggle.checked && thinkingProcess) {
                     addThinkingProcess(aiMessageParts, thinkingProcess);
                }

                // If completed normally and no error occurred, update the log response
                 if (!errorOccurred && !wasAborted) {
                    updateLogStreamEnd(logId, allChunks);
                 }


            } catch (error) {
                if (error.name === 'AbortError') {
                    wasAborted = true; // Mark as aborted
                    console.log('Streaming request aborted');
                    const abortMessage = "AI 回复已由用户停止。";
                    // Update AI message content
                    if (responseText && responseText.trim() !== '') { // If some content was already output
                        await updateAIMessage(aiMessageParts, responseText + `\n\n*${abortMessage}*`, true); // Add await
                    } else { // If no content was output yet, or content is empty
                        if (aiMessageParts && aiMessageParts.contentContainer) {
                            aiMessageParts.contentContainer.classList.remove('loading'); // Remove loading animation
                            if (aiMessageParts.textContainer) {
                                aiMessageParts.textContainer.innerHTML = `<span style="color: var(--text-secondary); font-style: italic;">${abortMessage}</span>`;
                            }
                        }
                    }
                    updateLogError(logId, '用户手动停止');
                } else {
                    errorOccurred = true; // Mark as other error
                    console.error('Streaming API request failed:', error);
                    const errorMessage = error.message || 'Streaming API request failed';
                    if (responseText) {
                        await updateAIMessage(aiMessageParts, responseText + `\n\n*Error: ${errorMessage}*`, true); // Add await
                    } else {
                         // If no reply received, display error directly
                         if (aiMessageParts && aiMessageParts.contentContainer) {
                             aiMessageParts.contentContainer.classList.remove('loading');
                             if (aiMessageParts.textContainer) {
                                 aiMessageParts.textContainer.innerHTML = `<span style="color: red;">Error: ${errorMessage}</span>`;
                             }
                         }
                    }
                    updateLogError(logId, errorMessage);
                }
            } finally {
                state.streamController = null; // Clean up controller for the current stream
                // Remove loading animation (if it was there and not removed normally)
                if (aiMessageParts && aiMessageParts.contentContainer && aiMessageParts.contentContainer.classList.contains('loading')) {
                    aiMessageParts.contentContainer.classList.remove('loading');
                    // If aborted and no content, ensure typing dots are gone and show message
                    if (wasAborted && (!responseText || responseText.trim() === '')) {
                       if (aiMessageParts.textContainer) {
                           aiMessageParts.textContainer.innerHTML = `<span style="color: var(--text-secondary); font-style: italic;">AI 回复已由用户停止。</span>`;
                       }
                    } else if (errorOccurred && (!responseText || responseText.trim() === '')) {
                        // If other error and no content
                        const logEntry = state.logs.find(log => log.id === logId);
                        const errText = logEntry?.error || 'Loading failed';
                        if (aiMessageParts.textContainer) {
                            aiMessageParts.textContainer.innerHTML = `<span style="color: red;">${errText}</span>`;
                        }
                    }
                }
                // sendMessage's finally will handle pendingMessages and button state update
            }
        }


        // Send API request (non-streaming)
        async function sendRequest(requestBody) {
            const response = await fetch(elements.apiEndpoint.value, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${elements.apiKey.value}`
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                 // Even if response is not OK, if API returns error details, include them in the thrown error
                throw new Error(data.error?.message || `Request failed: ${response.status} ${response.statusText}`);
            }

            return data;
        }

        // Get message history
        function getMessageHistory() {
            const maxContext = parseInt(elements.maxContext.value) || 10;
            const history = [];

            // Filter out system messages and empty AI messages
            const relevantMessages = state.messages.filter(msg =>
                 msg.type !== 'system' && (msg.type === 'user' || (msg.type === 'ai' && msg.text.trim() !== ''))
            );


            // Only keep the most recent messages as context
            // Keep up to maxContext pairs (user+AI), so take the last 2 * maxContext relevant messages
            const recentMessages = relevantMessages.slice(-maxContext * 2);

            for (const msg of recentMessages) {

                // If it's an empty user message without images, skip it
                if (msg.type === 'user' && msg.text.trim() === '' && (!msg.images || msg.images.length === 0)) {
                    continue;
                }

                 // If it's an empty AI message, skip it (already handled by filter, but double check)
                 if (msg.type === 'ai' && msg.text.trim() === '') {
                     continue;
                 }


                const historyItem = {
                    role: msg.type === 'user' ? 'user' : 'assistant',
                    content: msg.text // Initial text content
                };

                // If it's a user message with images and vision is enabled, format content as an array
                if (msg.type === 'user' && msg.images && msg.images.length > 0 && elements.visionToggle.checked) {
                    let contentArray = [];
                     // Add text part if present
                    if (msg.text.trim()) {
                        contentArray.push({
                            type: 'text',
                            text: msg.text.trim()
                        });
                    }

                     // Add image parts
                    msg.images.forEach(image => {
                        contentArray.push({
                            type: 'image_url',
                            image_url: {
                                url: image.data // Base64 URL (now WebP)
                            }
                        });
                    });

                    // If contentArray is not empty, replace historyItem's content
                    if (contentArray.length > 0) {
                        historyItem.content = contentArray;
                    } else {
                        // This case should ideally not happen after the initial filter/check
                        // It means a user message had images but no text and vision is enabled.
                        // If it only had images, contentArray would have image objects.
                        // If it had text and images, contentArray would have both.
                        // The only way contentArray is empty here is if msg.text was empty and msg.images was empty (already filtered)
                        // or if msg.images was not an array or empty array (less likely based on handleImageUpload)
                         console.warn("User message had images but contentArray was empty:", msg);
                         continue; // Skip this message to avoid empty content
                    }
                }
                 // If it's a user message with text but no images, or vision disabled, historyItem.content remains msg.text


                history.push(historyItem);
            }

            return history;
        }

        // Add system message
        function addSystemMessage(text) {
            const messageObj = {
                type: 'system',
                text,
                time: new Date().toLocaleTimeString()
            };

            // System messages are generally not included in context, so don't push to state.messages
            // unless they represent state relevant to the conversation (like image uploads, though those are also cleared)
            // We will add a minimal messageObj to the element for easy lookup in updateUploadNotice
            const messageElement = document.createElement('div');
            messageElement.className = 'message system-message';
             // Link messageElement to messageObj for easy lookup (useful for updates like upload notice)
            messageElement.messageObj = messageObj;

            messageElement.innerHTML = `
                <div class="message-content">
                    ${text}
                    <div class="message-time">${messageObj.time}</div>
                </div>
            `;

            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

             return messageElement; // Return element for possible future updates (like upload notice)
        }

        // Add user message
        async function addUserMessage(text, images = []) { // Add async keyword
            const messageObj = {
                type: 'user',
                text,
                images: images ? [...images] : [], // Store a copy of images at the time of sending
                time: new Date().toLocaleTimeString()
            };

            state.messages.push(messageObj);

            const messageElement = document.createElement('div');
            messageElement.className = 'message user-message';

            let imageHtml = '';
            if (images && images.length > 0) {
                imageHtml = '<div class="image-attachments">';
                images.forEach(image => {
                    // Use original filename as alt text if available
                    imageHtml += `<img src="${image.data}" alt="${image.filename || 'User uploaded image'}" class="image-attachment">`;
                });
                imageHtml += '</div>';
            }

            // Modify HTML structure to create a dedicated container for Markdown-rendered text .message-text-area
            messageElement.innerHTML = `
                <div class="message-content">
                    <div class="message-text-area"></div> <!-- Markdown rendering area -->
                    ${imageHtml}
                    <div class="message-time">${messageObj.time}</div>
                </div>
                <div class="message-avatar">用</div>
            `;

            const messageTextContainer = messageElement.querySelector('.message-text-area');
            const messageContentContainer = messageElement.querySelector('.message-content');

            // Use the new render function to process text
            await renderMarkdownAndAttachCopyButtons(text, messageTextContainer, messageContentContainer); // Add await

            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

            // Return an object with element references for later use (if needed)
            return {
                element: messageElement,
                object: messageObj,
                textContainer: messageTextContainer,
                contentContainer: messageContentContainer
            };
        }

        // Add AI message
        function addAIMessage(text = '') { // text parameter is usually empty on initial call
            const messageObj = {
                type: 'ai',
                text: text, // Initial text, will be updated during streaming
                time: new Date().toLocaleTimeString()
            };

            state.messages.push(messageObj);

            const messageElement = document.createElement('div');
            messageElement.className = 'message ai-message';

            // Modify HTML structure to create a dedicated container for Markdown-rendered text .message-text-area
            // And prepare .message-text-area for the typing dots animation
            messageElement.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div class="message-text-area"></div> <!-- Markdown rendering/typing dots area -->
                    <div class="message-time">${messageObj.time}</div>
                </div>
            `;

            const messageTextContainer = messageElement.querySelector('.message-text-area');
            const messageContentContainer = messageElement.querySelector('.message-content');

            if (!text) { // If initial text is empty, show loading animation
                messageContentContainer.classList.add('loading');
                messageTextContainer.innerHTML = `
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                `;
            } else {
                // If there's initial text (e.g., system messages added with this function), render directly
                // Note: Directly setting innerHTML here might not include MathJax rendering. If needed, use updateAIMessage.
                messageTextContainer.innerHTML = text; // Simple text addition
            }


            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

            // Return an object with element references for updateAIMessage
            return {
                element: messageElement,
                object: messageObj,
                textContainer: messageTextContainer,
                contentContainer: messageContentContainer
            };
        }

        // Update AI message
        async function updateAIMessage(aiMessageParts, newText, renderMathNow = true) { // Add async and renderMathNow parameters
            if (!aiMessageParts || !aiMessageParts.object) {
                console.error("Invalid aiMessageParts object", aiMessageParts);
                return;
            }
            aiMessageParts.object.text = newText; // Update stored raw text

            // Remove loading state (if it was there)
            aiMessageParts.contentContainer.classList.remove('loading');

            // Markdown parsing and copy button logic
            let html = '';
            if (typeof marked === 'undefined') {
                html = (newText || '').replace(/\n/g, '<br>'); // Fallback to simple line breaks
            } else {
                // Parse Markdown
                html = marked.parse(newText || '');
            }

            // DOMPurify sanitize (highly recommended)
            if (typeof DOMPurify !== 'undefined') {
                const allowedTags = ['p', 'br', 'strong', 'em', 'del', 'a', 'ul', 'ol', 'li', 'blockquote', 'code', 'pre', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'];
                const allowedAttrs = ['href', 'title', 'alt', 'src', 'class']; // Include class for MathJax elements
                html = DOMPurify.sanitize(html, {
                    ALLOWED_TAGS: allowedTags,
                    ALLOWED_ATTR: allowedAttrs,
                    USE_PROFILES: { html: true }
                });
            } else {
                 console.warn('DOMPurify library not loaded. Output from marked.js will be used directly. Be aware of potential XSS risks.');
            }

            // Update DOM text content
            aiMessageParts.textContainer.innerHTML = html;

            // --- Add Copy Buttons ---
            // Remove old full message copy button (if it exists)
            const existingFullCopyBtn = aiMessageParts.contentContainer.querySelector(':scope > .copy-btn:not(pre .copy-btn)');
            if (existingFullCopyBtn) {
                 existingFullCopyBtn.remove();
            }
            // Add new full message copy button
             if (newText && newText.trim()) {
                 // Append to message-content, but not a child of pre
                 const fullCopyBtn = createCopyButton(newText, ''); // Full message copy button can be icon-only
                 aiMessageParts.contentContainer.appendChild(fullCopyBtn);
            }

            // Add copy buttons to code blocks
            const codeBlocks = aiMessageParts.textContainer.querySelectorAll('pre');
            codeBlocks.forEach(preElement => {
                const codeElement = preElement.querySelector('code');
                const codeText = codeElement ? (codeElement.textContent || '') : (preElement.textContent || '');

                if (codeText.trim()) {
                    // Remove potentially existing old code block copy button
                    const existingCodeCopyBtn = preElement.querySelector('.copy-btn');
                    if (existingCodeCopyBtn) {
                        existingCodeCopyBtn.remove();
                    }
                    preElement.appendChild(createCopyButton(codeText, '复制'));
                }
            });
            // --- End of Markdown and copy button logic ---


            // --- Render MathJax formulas ---
            if (renderMathNow && typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                try {
                     // Ensure MathJax only processes the container of the current message
                    await MathJax.typesetPromise([aiMessageParts.textContainer]);
                    // console.log('MathJax typesetting complete for updated AI message.');
                } catch (err) {
                    console.error('MathJax typesetting error in updateAIMessage:', err);
                }
            } else {
                 // console.warn('MathJax not available or typesetPromise not found, or rendering deferred.');
            }

            // Scroll to bottom
            scrollToBottom();
        }

        // Add thinking process
        function addThinkingProcess(aiMessageParts, thinkingText) {
            if (!thinkingText || !elements.thinkingToggle.checked || !aiMessageParts || !aiMessageParts.element) return;

            const messageContent = aiMessageParts.element.querySelector('.message-content');
             if (!messageContent) return;

            // Check if thinking process element already exists
            let thinkingElement = messageContent.querySelector('.thinking-process');

            if (!thinkingElement) {
                thinkingElement = document.createElement('div');
                thinkingElement.className = 'thinking-process';
                // The thinking process element should be added at the end of the message content (message-content), but before the timestamp
                const timeElement = messageContent.querySelector('.message-time');
                if (timeElement) {
                    messageContent.insertBefore(thinkingElement, timeElement);
                } else {
                    // If there's no timestamp (shouldn't happen), just append
                    messageContent.appendChild(thinkingElement);
                }
            }

            thinkingElement.textContent = thinkingText; // Thinking process is usually plain text
            scrollToBottom();
        }


        // Scroll to bottom
        function scrollToBottom() {
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        // Update send button state
        function updateSendButtonState() {
            const sendButton = elements.sendButton;
            const hasValidModel = elements.modelSelect.value !== '';
            const hasInput = elements.chatInput.value.trim() !== '';
            const hasImages = state.imageAttachments.length > 0;
            const visionEnabled = elements.visionToggle.checked;

            // Define SVG icon strings
            const sendSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
            const stopSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>`;

            if (state.streamController && state.pendingMessages > 0) { // Streaming in progress
                sendButton.innerHTML = `<span>停止</span>${stopSvg}`;
                sendButton.disabled = false; // "Stop" button should always be enabled
                sendButton.title = "停止AI回复";
            } else { // Not streaming, or no pending messages
                sendButton.innerHTML = `<span>发送</span>${sendSvg}`;
                // Enable send button only if there's a valid model AND either text input or images (with vision enabled)
                sendButton.disabled = !hasValidModel || (!hasInput && !(hasImages && visionEnabled));

                 if (!hasValidModel) {
                     sendButton.title = "请在设置中配置模型";
                 } else if (!hasInput && !(hasImages && visionEnabled)) {
                     sendButton.title = "请输入文本或上传图片";
                 } else {
                     sendButton.title = "发送消息";
                 }
            }
        }

        // Add log
        function addLog(title, requestData) {
            const timestamp = new Date();
            const logId = `log-${Date.now()}`;

            const logObj = {
                id: logId,
                title,
                timestamp,
                request: requestData,
                response: null,
                error: null
            };

            state.logs.unshift(logObj); // Add new log at the beginning

            // Create log element
            const logElement = document.createElement('div');
            logElement.className = 'log-item';
            logElement.id = logId;
            logElement.innerHTML = `
                <div class="log-header" onclick="window.toggleLogBody('${logId}')">
                    <div class="log-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        ${title}
                    </div>
                    <div class="log-timestamp">${timestamp.toLocaleTimeString()}</div>
                </div>
                <div class="log-body" id="${logId}-body">
                    <div class="log-section">
                        <div class="log-section-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 10 4 15 9 20"></polyline>
                                <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
                            </svg>
                            请求数据
                        </div>
                        <pre class="log-content">${JSON.stringify(requestData, null, 2)}</pre>
                    </div>
                    <div class="log-section" id="${logId}-response-section" style="display: none;">
                        <div class="log-section-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 10 20 15 15 20"></polyline>
                                <path d="M4 4v7a4 4 0 0 0 4 4h12"></path>
                            </svg>
                            响应数据
                        </div>
                        <pre class="log-content" id="${logId}-response"></pre>
                    </div>
                    <div class="log-section" id="${logId}-error-section" style="display: none;">
                        <div class="log-section-title" style="color: #e74c3c;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            错误信息
                        </div>
                        <pre class="log-content" id="${logId}-error" style="color: #e74c3c;"></pre>
                    </div>
                </div>
            `;

            elements.logsContainer.insertBefore(logElement, elements.logsContainer.firstChild);

            return logId;
        }

        // Update log response
        function updateLogResponse(logId, responseData) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                logObj.response = responseData;
            }

            const responseSection = document.getElementById(`${logId}-response-section`);
            const responseElement = document.getElementById(`${logId}-response`);

            if (responseSection && responseElement) {
                responseSection.style.display = 'block';
                responseElement.textContent = JSON.stringify(responseData, null, 2);
            }
        }

        // Update log stream end
        function updateLogStreamEnd(logId, streamData) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                // Save raw data or mark as stream complete
                logObj.response = streamData || "流式响应 (已完成)";
            }

            const responseSection = document.getElementById(`${logId}-response-section`);
            const responseElement = document.getElementById(`${logId}-response`);

            if (responseSection && responseElement) {
                responseSection.style.display = 'block';
                 // Display saved response data
                responseElement.textContent = typeof logObj.response === 'string' ? logObj.response : JSON.stringify(logObj.response, null, 2);
            }
        }

        // Update log error
        function updateLogError(logId, errorMessage) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                logObj.error = errorMessage;
            }

            const errorSection = document.getElementById(`${logId}-error-section`);
            const errorElement = document.getElementById(`${logId}-error`);

            if (errorSection && errorElement) {
                errorSection.style.display = 'block';
                errorElement.textContent = errorMessage;
                 // Update log title color
                 const logTitleElement = document.getElementById(logId)?.querySelector('.log-title');
                 if (logTitleElement) {
                     logTitleElement.style.color = '#e74c3c';
                 }
            }
        }

        // Toggle log body display/hide
        window.toggleLogBody = function(logId) {
            const logBody = document.getElementById(`${logId}-body`);
            if (logBody) {
                logBody.classList.toggle('open');
            }
        };

        // Image preview
        function showImagePreview(src) {
            elements.previewImage.src = src;
            elements.imagePreview.classList.add('active');
            elements.overlay.classList.add('active');
        }

        // Close image preview
        function closeImagePreview() {
            elements.imagePreview.classList.remove('active');
            elements.overlay.classList.remove('active');
        }


        // Initialize application
        document.addEventListener('DOMContentLoaded', init);

        // Listen for input box content and image attachment changes, update send button state
        elements.chatInput.addEventListener('input', updateSendButtonState);
        elements.imageInput.addEventListener('change', updateSendButtonState); // updateSendButtonState is called inside handleImageUpload now
    </script>
</body>
</html>
