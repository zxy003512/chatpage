<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI Markdown Chat Interface</title>
  <!-- 引入 highlight.js 样式 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
  <!-- 配置 MathJax（自动渲染数学公式） -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <!-- 引入 highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <!-- 引入 marked.js 用于 Markdown 渲染 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <!-- 引入 MathJax -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js" async></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f7f7f7;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    textarea, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      margin-right: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
    .log {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 20px;
    }
    .message {
      margin-bottom: 20px;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      background: #fefefe;
    }
    .message h3 {
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    pre code {
      background-color: #eee;
      padding: 10px;
      border-radius: 5px;
      display: block;
    }
    /* 按钮样式 */
    .copy-btn, .toggle-btn {
      margin-left: 10px;
      font-size: 12px;
      cursor: pointer;
      padding: 3px 6px;
    }
    .copy-code-btn {
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>AI Markdown Chat Interface</h1>
  <div class="form-group">
    <label for="taskInput">任务描述或问题：</label>
    <textarea id="taskInput" rows="4" placeholder="请输入任务描述或问题"></textarea>
  </div>
  <div class="form-group">
    <label for="apiUrl">API URL:</label>
    <input type="text" id="apiUrl" value="https://api.zetatechs.com/v1/chat/completions">
  </div>
  <div class="form-group">
    <label for="apiKey">API Key:</label>
    <input type="text" id="apiKey" value="sk-7c56ZaiPVJOLPzmAPr07e9DaVsHtyS769tg5yjOGE1aiNtSt">
  </div>
  <div class="form-group">
    <label for="model">模型:</label>
    <input type="text" id="model" value="gemini-2.0-flash-thinking-exp-01-21-free">
  </div>
  <div class="form-group">
    <label for="temperature">Temperature:</label>
    <input type="number" id="temperature" step="0.1" value="0.4">
  </div>
  <div class="form-group">
    <label for="maxTokens">Max Tokens:</label>
    <input type="number" id="maxTokens" value="60000">
  </div>
  <!-- 新增思考模式开关 -->
  <div class="form-group">
    <label for="thinkingMode">
      <input type="checkbox" id="thinkingMode">
      开启思考模式
    </label>
  </div>
  <button id="sendRequestBtn">发送请求</button>
  <button id="clearSessionBtn">清除会话</button>
  <button id="downloadLogBtn">下载日志</button>

  <div class="log" id="logContainer">
    <h2>会话日志</h2>
    <!-- 日志内容会追加在此 -->
  </div>
</div>

<script>
  // 配置 marked.js 使用 highlight.js 进行代码高亮
  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    }
  });

  // 全局变量，存储整个会话记录
  let conversationLog = {
    user_task: "",
    candidate_responses: [],
    final_best_answer: "",
    details: {}
  };

  // 辅助函数：为代码块添加复制按钮
  function addCopyButtonsToCodeBlocks(container) {
    container.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code');
      if (code) {
        const copyBtn = document.createElement('button');
        copyBtn.innerText = '复制代码';
        copyBtn.className = 'copy-code-btn';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(code.innerText).then(() => {
            copyBtn.innerText = '复制成功';
            setTimeout(() => { copyBtn.innerText = '复制代码'; }, 2000);
          }).catch(() => {
            copyBtn.innerText = '复制失败';
          });
        });
        pre.style.position = 'relative';
        copyBtn.style.position = 'absolute';
        copyBtn.style.top = '5px';
        copyBtn.style.right = '5px';
        pre.appendChild(copyBtn);
      }
    });
  }

  // 修改后的日志追加函数（不带折叠功能，用于用户任务、系统提示、用户消息、最终回答等）
  function appendLog(title, markdownContent) {
    const logContainer = document.getElementById('logContainer');
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message');

    const header = document.createElement('h3');
    header.textContent = title;
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '复制';
    copyBtn.classList.add('copy-btn');
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(markdownContent)
        .then(() => alert('文本已复制'))
        .catch(err => alert('复制失败: ' + err));
    });
    header.appendChild(copyBtn);
    messageDiv.appendChild(header);

    const contentDiv = document.createElement('div');
    contentDiv.innerHTML = marked.parse(markdownContent);
    messageDiv.appendChild(contentDiv);

    logContainer.appendChild(messageDiv);
    updateMathJax();
  }

  // 新的日志创建函数，增加一个 collapsible 参数（默认 false）
  function createLogEntry(title, initContent, collapsible = false) {
    const logContainer = document.getElementById('logContainer');
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message');

    const header = document.createElement('h3');

    if (collapsible) {
      const toggleBtn = document.createElement('button');
      toggleBtn.textContent = '展开';
      toggleBtn.classList.add('toggle-btn');
      const titleSpan = document.createElement('span');
      titleSpan.textContent = title;
      header.appendChild(toggleBtn);
      header.appendChild(titleSpan);
    
      const copyBtn = document.createElement('button');
      copyBtn.textContent = '复制';
      copyBtn.classList.add('copy-btn');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(initContent)
          .then(() => alert('文本已复制'))
          .catch(err => alert('复制失败: ' + err));
      });
      header.appendChild(copyBtn);
      messageDiv.appendChild(header);

      const contentDiv = document.createElement('div');
      contentDiv.innerHTML = marked.parse(initContent);
      messageDiv.appendChild(contentDiv);
      contentDiv.style.display = 'none';

      toggleBtn.addEventListener('click', () => {
        if (contentDiv.style.display === 'none') {
          contentDiv.style.display = '';
          toggleBtn.textContent = '折叠';
        } else {
          contentDiv.style.display = 'none';
          toggleBtn.textContent = '展开';
        }
      });

      logContainer.appendChild(messageDiv);
      updateMathJax();
      return {
        messageDiv: messageDiv,
        contentDiv: contentDiv,
        update: function(newContent) {
          contentDiv.innerHTML = marked.parse(newContent);
          addCopyButtonsToCodeBlocks(contentDiv);
          updateMathJax();
        }
      };
    } else {
      header.textContent = title;
      const copyBtn = document.createElement('button');
      copyBtn.textContent = '复制';
      copyBtn.classList.add('copy-btn');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(initContent)
          .then(() => alert('文本已复制'))
          .catch(err => alert('复制失败: ' + err));
      });
      header.appendChild(copyBtn);
      messageDiv.appendChild(header);

      const contentDiv = document.createElement('div');
      contentDiv.innerHTML = marked.parse(initContent);
      messageDiv.appendChild(contentDiv);
      logContainer.appendChild(messageDiv);
      updateMathJax();
      return {
        messageDiv: messageDiv,
        contentDiv: contentDiv,
        update: function(newContent) {
          contentDiv.innerHTML = marked.parse(newContent);
          addCopyButtonsToCodeBlocks(contentDiv);
          updateMathJax();
        }
      };
    }
  }

  // 调用 API 的函数（自动重试3次，超时30秒，非流式调用版）
  async function callApi(messages, settings) {
    const { apiUrl, apiKey, model, temperature, maxTokens } = settings;
    const headers = {
      "Authorization": "Bearer " + apiKey,
      "Content-Type": "application/json"
    };
    const payload = {
      model: model,
      messages: messages,
      temperature: parseFloat(temperature),
      max_tokens: parseInt(maxTokens)
    };
    const maxRetries = 3;
    const timeout = 30000; // 30秒超时
    for (let attempt = 1; attempt <= maxRetries; attempt++) {
      try {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(id);
        if (response.status === 200) {
          const resJson = await response.json();
          return resJson;
        } else {
          console.log(`尝试 ${attempt}: API 返回错误状态 ${response.status}`);
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
      } catch (error) {
        console.log(`尝试 ${attempt}: 请求异常: ${error}`);
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
    return null;
  }

  // 提取返回的回答内容（仅用于非流式返回）
  function extractContent(apiResponse) {
    try {
      return apiResponse.choices[0].message.content;
    } catch (error) {
      console.log("提取返回内容时出错:", error);
      return "";
    }
  }

  // 新增流式调用函数，用于思考模式下的候选/校验请求，支持流式解析并通过回调实时更新UI
  async function callApiStream(messages, settings, callbacks) {
    const { apiUrl, apiKey, model, temperature, maxTokens } = settings;
    const headers = {
      "Authorization": "Bearer " + apiKey,
      "Content-Type": "application/json"
    };
    const payload = {
      model: model,
      messages: messages,
      temperature: parseFloat(temperature),
      max_tokens: parseInt(maxTokens),
      stream: true
    };
    
    const response = await fetch(apiUrl, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(payload)
    });
    
    if (!response.ok) {
      throw new Error("API 返回错误状态 " + response.status);
    }
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let finalAnswer = "";
    let finalStarted = false;
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunkText = decoder.decode(value);
      // 按换行分割数据，每行前缀为 "data:"（类似 OpenAI 的流式返回）
      const lines = chunkText.split("\n").filter(line => line.trim() !== "");
      for (let line of lines) {
        if (line.startsWith("data:")) {
          let dataStr = line.slice(5).trim();
          if (dataStr === "[DONE]") break;
          try {
            const jsonObj = JSON.parse(dataStr);
            if (jsonObj.choices && jsonObj.choices[0] && jsonObj.choices[0].delta) {
              const delta = jsonObj.choices[0].delta;
              if (delta.reasoning_content && delta.reasoning_content !== "") {
                if (callbacks && callbacks.onReasoning) {
                  callbacks.onReasoning(delta.reasoning_content);
                }
              } else if (delta.content && delta.content !== "") {
                if (!finalStarted && callbacks && callbacks.onFinalStart) {
                  callbacks.onFinalStart();
                  finalStarted = true;
                }
                if (callbacks && callbacks.onFinal) {
                  callbacks.onFinal(delta.content);
                }
                finalAnswer += delta.content;
              }
            }
          } catch (e) {
            console.error("JSON 解析错误:", e);
          }
        }
      }
    }
    return finalAnswer;
  }

  // 对候选回答请求（5 个并发请求）：封装自动重试+手动重试逻辑
  async function requestCandidate(index, systemPrompt, userMessage, settings, thinkingModeEnabled) {
    const entry = createLogEntry(`请求 ${index+1}`, "正在发送请求...", true);
    async function attempt() {
      let candidateLog = "正在发送请求...";
      entry.update(candidateLog);
      if (thinkingModeEnabled) {
        try {
          const finalAnswer = await callApiStream([systemPrompt, userMessage], settings, {
            onReasoning: (chunk) => {
              candidateLog += chunk;
              entry.update(candidateLog);
            },
            onFinalStart: () => {
              candidateLog += "\n\n === Final Answer ===\n";
              entry.update(candidateLog);
            },
            onFinal: (chunk) => {
              candidateLog += chunk;
              entry.update(candidateLog);
            }
          });
          return finalAnswer;
        } catch(e) {
          return null;
        }
      } else {
        const responseJson = await callApi([systemPrompt, userMessage], settings);
        if (!responseJson) return null;
        return extractContent(responseJson);
      }
    }
    while (true) {
      const result = await attempt();
      if (result !== null) {
        entry.update(result);
        return result;
      } else {
        entry.update("[请求失败，未获得有效回复]");
        const retryButton = document.createElement("button");
        retryButton.textContent = "手动重试";
        entry.messageDiv.appendChild(retryButton);
        await new Promise(resolve => retryButton.addEventListener("click", resolve, { once: true }));
        retryButton.remove();
      }
    }
  }

  // 对校验请求（最佳答案）的调用：封装自动/手动重试逻辑，使用流式处理，
  // 此处已修改为在 UI 上实时展示流式回复的整个过程（包括思考片段）
  async function requestValidation(validatorMessages, settings) {
    const entry = createLogEntry("发送检验请求", "正在发送检验请求，请求 AI 根据 5 个回答选出最佳答案...", true);
    async function attempt() {
      // 强制使用流式回复，确保能看到中间流式数据
      if (settings.stream) {
        let finalLog = "正在发送检验请求，请求 AI 根据 5 个回答选出最佳答案...";
        entry.update(finalLog);
        await callApiStream(validatorMessages, settings, {
          onReasoning: (chunk) => {
            finalLog += chunk;
            entry.update(finalLog);
          },
          onFinalStart: () => {
            finalLog += "\n\n === Final Answer ===\n";
            entry.update(finalLog);
          },
          onFinal: (chunk) => {
            finalLog += chunk;
            entry.update(finalLog);
          }
        });
        return finalLog;
      } else {
        const responseJson = await callApi(validatorMessages, settings);
        if (!responseJson) return null;
        return extractContent(responseJson);
      }
    }
    while (true) {
      const result = await attempt();
      if (result !== null) {
        entry.update(result);
        return result;
      } else {
        entry.update("[检验请求失败，未获得有效回复]");
        const retryButton = document.createElement("button");
        retryButton.textContent = "手动重试";
        entry.messageDiv.appendChild(retryButton);
        await new Promise(resolve => retryButton.addEventListener("click", resolve, { once: true }));
        retryButton.remove();
      }
    }
  }

  // 调用 MathJax 重新渲染数学公式
  function updateMathJax() {
    if (window.MathJax) {
      MathJax.typesetPromise();
    }
  }

  // “发送请求”按钮事件处理
  document.getElementById('sendRequestBtn').addEventListener('click', async () => {
    // 获取用户输入和配置参数
    const userTask = document.getElementById('taskInput').value;
    const userApiUrl = document.getElementById('apiUrl').value;
    const userApiKey = document.getElementById('apiKey').value;
    const userModel = document.getElementById('model').value;
    const temperature = document.getElementById('temperature').value;
    const maxTokens = document.getElementById('maxTokens').value;
    const thinkingModeEnabled = document.getElementById('thinkingMode').checked;
    
    // 记录用户任务
    conversationLog.user_task = userTask;
    appendLog("用户任务", userTask);
    
    // 构造系统提示和用户消息
    const systemPrompt = {
      role: "system",
      content: `请仔细理解并严格按照以下任务描述进行回答：\n${userTask}`
    };
    const userMessage = {
      role: "user",
      content: "请基于以上任务描述直接给出你的回答。"
    };
    
    appendLog("系统提示", systemPrompt.content);
    appendLog("用户消息", userMessage.content);
    
    // 如果开启思考模式，则使用示例中的 API 地址、Key 及模型
    const settings = thinkingModeEnabled ? {
      apiUrl: "https://api-inference.modelscope.cn/v1/chat/completions",
      apiKey: "a121eb23-a813-48a3-8453-3dc11d0e1386",
      model: "Qwen/QwQ-32B",
      temperature: temperature,
      maxTokens: maxTokens,
      stream: true
    } : {
      apiUrl: userApiUrl,
      apiKey: userApiKey,
      model: userModel,
      temperature: temperature,
      maxTokens: maxTokens
    };
  
    appendLog("并发请求", "正在并发发送请求，5 次请求将同时发出...");
    const candidatePromises = [];
    for (let i = 0; i < 5; i++) {
      candidatePromises.push(requestCandidate(i, systemPrompt, userMessage, settings, thinkingModeEnabled));
    }
    const candidateResponses = await Promise.all(candidatePromises);
    conversationLog.candidate_responses = candidateResponses;
  
    // 构造检验请求（仅包含各候选回答最终答案，不包含详细思考过程）
    let validationPrompt = `任务描述：\n${userTask}\n\n` +
      "下面列出了基于任务描述产生的5个回答。根据任务描述，然后通过分析每一个回答，最后得出你的正确答案，不只是分析，是要你通过分析其他的回答然后去更精准的完成任务的。" +
      "\n";
    candidateResponses.forEach((candidate, idx) => {
      validationPrompt += `\n【回答 ${idx + 1}】:\n${candidate}\n`;
    });
  
    appendLog("检验请求", validationPrompt);
    const validatorMessages = [
      {
        role: "system",
        content: `你现在是一位推理专家，必须根据以下任务描述，然后通过分析每一个回答，最后得出你的正确答案，不只是分析，是要你通过分析其他的回答然后去更精准的完成任务的。任务描述如下：\n${userTask}`
      },
      {
        role: "user",
        content: validationPrompt
      }
    ];
  
    // 无论是否开启思考模式，此处均强制使用流式回复，确保展示流式回复过程
    const finalSettings = thinkingModeEnabled ? {
      apiUrl: "https://api-inference.modelscope.cn/v1/chat/completions",
      apiKey: "a121eb23-a813-48a3-8453-3dc11d0e1386",
      model: "Qwen/QwQ-32B",
      temperature: temperature,
      maxTokens: maxTokens,
      stream: true
    } : {
      apiUrl: userApiUrl,
      apiKey: userApiKey,
      model: userModel,
      temperature: temperature,
      maxTokens: maxTokens,
      stream: true
    };
  
    const finalAnswer = await requestValidation(validatorMessages, finalSettings);
    conversationLog.final_best_answer = finalAnswer;
    appendLog("最终最佳答案", finalAnswer);
  });
  
  // “清除会话”按钮事件处理
  document.getElementById('clearSessionBtn').addEventListener('click', () => {
    conversationLog = {
      user_task: "",
      candidate_responses: [],
      final_best_answer: "",
      details: {}
    };
    document.getElementById('logContainer').innerHTML = "<h2>会话日志</h2>";
  });
  
  // “下载日志”按钮事件处理
  document.getElementById('downloadLogBtn').addEventListener('click', () => {
    const timestamp = new Date().toISOString().replace(/[^\d]/g, "");
    const filename = `ai_result_${timestamp}.json`;
    const blob = new Blob([JSON.stringify(conversationLog, null, 4)], { type: "application/json;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  });
</script>
</body>
</html>
