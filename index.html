        // ===== JavaScript 新增函数 =====

        /**
         * 创建一个复制按钮元素
         * @param {string} textToCopy - 点击按钮时要复制的文本
         * @param {string} buttonText - 按钮上初始显示的文字 (图标后的文字)
         * @returns {HTMLButtonElement} - 创建好的按钮元素
         */
        function createCopyButton(textToCopy, buttonText = '复制') {
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            // 使用更简洁的SVG图标
            btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"></path></svg><span>${buttonText}</span>`;

            let originalButtonHTML = btn.innerHTML; // 保存原始按钮内容 (图标 + 文字)

            btn.onclick = (e) => {
                e.stopPropagation(); // 防止事件冒泡，特别是对于代码块
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalSpan = btn.querySelector('span');
                     if (originalSpan) originalSpan.textContent = '已复制!'; else btn.innerHTML = '已复制!';

                    setTimeout(() => {
                        btn.innerHTML = originalButtonHTML; // 恢复原始内容
                    }, 1500);
                }).catch(err => {
                    console.error('复制失败:', err);
                    const originalSpan = btn.querySelector('span');
                    if (originalSpan) originalSpan.textContent = '失败'; else btn.innerHTML = '失败';

                    setTimeout(() => {
                       btn.innerHTML = originalButtonHTML; // 恢复原始内容
                    }, 1500);
                });
            };
            return btn;
        }

        /**
         * 渲染Markdown文本并在消息和代码块上附加复制按钮
         * @param {string} rawText - 未经处理的原始文本 (包含Markdown)
         * @param {HTMLElement} textContainer - 用于显示渲染后HTML的容器 (例如 .message-text-area)
         * @param {HTMLElement} contentContainer - 整个消息内容的容器 (例如 .message-content)，用于附加全局复制按钮
         */
        function renderMarkdownAndAttachCopyButtons(rawText, textContainer, contentContainer) {
            if (typeof marked === 'undefined') {
                console.warn('marked.js 库未加载。Markdown 将作为纯文本显示。');
                textContainer.textContent = rawText; // Fallback: 显示为纯文本
                if (rawText && rawText.trim()) {
                    // 在纯文本消息上添加复制全文按钮
                    contentContainer.appendChild(createCopyButton(rawText, '复制全文'));
                }
                return;
            }

            // 确保 Marked 选项已设置 (在 init 中已经设置，这里可以省略或按需覆盖)
            // marked.setOptions({...});

            let html = marked.parse(rawText || ''); // 如果 rawText 是 null/undefined，则解析空字符串

            // 使用 DOMPurify 清理 HTML (强烈推荐)
            if (typeof DOMPurify !== 'undefined') {
                 // 允许 marked 生成的常见安全标签
                const allowedTags = ['p', 'br', 'strong', 'em', 'del', 'a', 'ul', 'ol', 'li', 'blockquote', 'code', 'pre', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'];
                // 允许 marked 生成的常见安全属性
                const allowedAttrs = ['href', 'title', 'alt', 'src', 'class']; // 允许 a, img, code 等标签的属性

                 html = DOMPurify.sanitize(html, {
                     ALLOWED_TAGS: allowedTags,
                     ALLOWED_ATTR: allowedAttrs,
                     USE_PROFILES: { html: true } // 额外启用一些通用的HTML配置文件
                 });
            } else {
                console.warn('DOMPurify 库未加载。来自 marked.js 的输出将直接使用，请注意潜在的XSS风险。');
            }

            textContainer.innerHTML = html;

            // --- 添加复制按钮 ---

            // 1. 为整个消息内容添加复制按钮 (复制的是原始Markdown文本)
            // 先移除可能已存在的旧的“复制全文”按钮，以防重复添加 (主要针对AI消息更新时)
            // 查找不在 <pre> 标签内部的复制按钮
            const existingFullCopyBtn = contentContainer.querySelector(':scope > .copy-btn');
            if (existingFullCopyBtn) {
                existingFullCopyBtn.remove();
            }
            if (rawText && rawText.trim()) {
                 // 附加到 message-content, 但不是 pre 的子级
                 const fullCopyBtn = createCopyButton(rawText, ''); // 全文复制按钮可以只有图标
                 contentContainer.appendChild(fullCopyBtn);
            }


            // 2. 为所有 <pre> (代码块) 元素添加复制按钮
            const codeBlocks = textContainer.querySelectorAll('pre');
            codeBlocks.forEach(preElement => {
                // preElement 内部通常是 <code> 标签
                const codeElement = preElement.querySelector('code');
                // 获取要复制的纯文本内容
                const codeText = codeElement ? (codeElement.textContent || '') : (preElement.textContent || '');

                if (codeText.trim()) {
                    // 移除可能已存在的旧的代码块复制按钮
                    const existingCodeCopyBtn = preElement.querySelector('.copy-btn');
                    if (existingCodeCopyBtn) {
                        existingCodeCopyBtn.remove();
                    }
                    preElement.appendChild(createCopyButton(codeText, '复制'));
                }
            });

            // 3. (可选) 为数学公式渲染 (如果使用了 KaTeX/MathJax)
            // if (typeof renderMathInElement !== 'undefined') {
            //     renderMathInElement(textContainer, {
            //         delimiters: [
            //             { left: '$$', right: '$$', display: true },
            //             { left: '$', right: '$', display: false },
            //         ],
            //         throwOnError: false
            //     });
            // }
        }

        // ===== JavaScript 新增函数结束 =====


        // 处理图片上传
        function handleImageUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            state.imageAttachments = []; // 清空之前的附件
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Data = e.target.result;
                    state.imageAttachments.push({
                        data: base64Data,
                        filename: file.name // 保存文件名
                    });

                    // 显示上传提示 (只显示总数)
                    const uploadCount = state.imageAttachments.length;
                     // 查找并更新现有的提示消息
                     let systemMessageElement = elements.chatMessages.querySelector('.message.system-message:last-child');
                     let isNewMessage = false;
                     // 判断最后一个系统消息是否是图片上传提示
                     if (!systemMessageElement || !systemMessageElement.messageObj || systemMessageElement.messageObj.type !== 'system' || !systemMessageElement.messageObj.text.includes('已上传') || !systemMessageElement.messageObj.text.includes('图片')) {
                         systemMessageElement = addSystemMessage(''); // 添加新的系统消息元素
                         isNewMessage = true;
                     }

                     const messageText = `已上传 ${uploadCount} 张图片，将随下一条消息一起发送。`;
                     const messageTime = new Date().toLocaleTimeString();

                     // 更新消息对象 (如果它是一个系统消息)
                     if (systemMessageElement.messageObj && systemMessageElement.messageObj.type === 'system') {
                         systemMessageElement.messageObj.text = messageText;
                         systemMessageElement.messageObj.time = messageTime;
                     } else {
                         // 如果是新创建的消息，或者找不到对应的 messageObj，创建一个新的 messageObj
                         const newMessageObj = {
                              type: 'system',
                              text: messageText,
                              time: messageTime
                         };
                         state.messages.push(newMessageObj); // 系统消息理论上不计入 context，但这里为了追踪状态可以先放着
                          // 关联 messageElement 和 messageObj (方便后续查找)
                          systemMessageElement.messageObj = newMessageObj;
                     }

                     // 更新DOM内容
                     // 移除旧内容和时间，重新生成
                     const messageContentDiv = systemMessageElement.querySelector('.message-content');
                     if(messageContentDiv) {
                        messageContentDiv.innerHTML = `
                            ${messageText}
                            <div class="message-time">${messageTime}</div>
                        `;
                     }


                    elements.visionToggle.checked = true; // 上传图片自动开启图像理解
                    saveSettings();

                    // 如果是新消息，滚动到底部
                    if (isNewMessage) {
                         scrollToBottom();
                    }
                };
                reader.readAsDataURL(file);
            });

            // 重置文件输入，以便可以选择相同的文件
            e.target.value = '';
        }

        // 发送消息
        async function sendMessage() {
            // 如果按钮当前是“停止”状态，则执行停止逻辑
            const sendButtonSpan = elements.sendButton.querySelector('span');
            if (sendButtonSpan && sendButtonSpan.textContent === '停止') {
                stopStreamingRequest();
                return;
            }

            const message = elements.chatInput.value.trim();
            const hasImages = state.imageAttachments.length > 0 && elements.visionToggle.checked;

            if (message === '' && !hasImages) return;

            // 检查设置
            if (!elements.apiEndpoint.value || !elements.apiKey.value) {
                addSystemMessage('请先在设置中配置 API 地址和 API Key');
                togglePanel(elements.settingsPanel);
                return;
            }

            // 获取选择的模型
            const selectedModelId = elements.modelSelect.value;
            if (!selectedModelId) {
                addSystemMessage('请至少添加一个模型配置并选择模型');
                togglePanel(elements.settingsPanel);
                return;
            }

            // 添加用户消息到聊天
            addUserMessage(message, state.imageAttachments);
            elements.chatInput.value = ''; // 清空输入框

            // 清除已上传图片的系统提示消息
            const uploadSystemMessages = elements.chatMessages.querySelectorAll('.system-message');
             uploadSystemMessages.forEach(msgElement => {
                 if (msgElement.messageObj && msgElement.messageObj.type === 'system' && msgElement.messageObj.text.includes('已上传') && msgElement.messageObj.text.includes('图片')) {
                     msgElement.remove(); // 移除提示消息元素
                     // 不需要从 state.messages 移除，因为这个类型的系统消息本来就不计入上下文
                 }
             });

             // 清空图片附件状态 (用户消息已包含，请求发送后清空)
            state.imageAttachments = [];

            state.pendingMessages++;
            updateSendButtonState();

            // 构建请求数据
            let content = [];

            // 添加文本内容
            if (message) {
                content.push({
                    type: "text",
                    text: message
                });
            }

            // 添加图像内容（如果开启图像理解能力）
            if (hasImages) {
                // 注意：state.imageAttachments 此时应该已经被清空，但 addUserMessage 中复制了一份
                // 这里应该从 addUserMessage 添加到 state.messages 的那个消息对象中获取图片
                 const userMessageObj = state.messages[state.messages.length - 1]; // 获取最后一条（刚刚添加的）用户消息
                 if (userMessageObj && userMessageObj.type === 'user' && userMessageObj.images && userMessageObj.images.length > 0) {
                     userMessageObj.images.forEach(image => {
                         content.push({
                             type: "image_url",
                             image_url: {
                                 url: image.data // Base64 URL
                             }
                         });
                     });
                 } else if (state.imageAttachments.length > 0) { // 备用：如果 somehow state.imageAttachments还没清空 (理论上不应该)
                      state.imageAttachments.forEach(image => {
                         content.push({
                             type: "image_url",
                             image_url: {
                                 url: image.data
                             }
                         });
                     });
                 }
            }


            // 构建消息历史
            const messageHistory = getMessageHistory();

            // 构建请求主体
            let requestBody = {
                model: selectedModelId,
                messages: messageHistory.concat([
                    {
                        role: "user",
                        content: content
                    }
                ]),
                temperature: parseFloat(elements.temperature.value),
                max_tokens: parseInt(elements.maxTokens.value),
                stream: elements.streamToggle.checked
            };

            // 添加自定义参数
            const customParams = document.querySelectorAll('.param-item');
            if (customParams.length > 0) {
                Array.from(customParams).forEach(param => {
                    const keyInput = param.querySelector('[data-type="param-key"]');
                    const valueInput = param.querySelector('[data-type="param-value"]');
                    const key = keyInput ? keyInput.value.trim() : '';
                    const valueString = valueInput ? valueInput.value.trim() : '';

                    if (key) {
                         let value;
                         try {
                             // 尝试将值解析为 JSON (例如布尔值, 数字, 对象, 数组)
                             value = JSON.parse(valueString);
                         } catch (e) {
                             // 如果解析失败，就作为原始字符串值
                             value = valueString;
                         }
                        requestBody[key] = value;
                    }
                });
            }

            // 日志记录请求
            const logId = addLog('发送请求', requestBody);

            try {
                // 发送请求
                 const aiMessageParts = addAIMessage(''); // 新的调用方式，获取包含各元素引用的对象

                if (elements.streamToggle.checked) {
                    streamResponse(requestBody, aiMessageParts, logId);
                } else {
                    const response = await sendRequest(requestBody);
                    updateLogResponse(logId, response);

                    if (response.error) {
                        throw new Error(response.error.message || '请求失败');
                    }

                    const aiResponseText = response.choices[0]?.message?.content || ''; // 安全访问内容
                    updateAIMessage(aiMessageParts, aiResponseText);

                    // 注意：addThinkingProcess 也需要 aiMessageParts.element 或其子元素
                    if (elements.thinkingToggle.checked && response.choices[0]?.thinking) {
                        addThinkingProcess(aiMessageParts, response.choices[0].thinking); // 调整 addThinkingProcess
                    }
                }
            } catch (error) {
                console.error('API 请求失败:', error);
                 const errorMessage = error.message || 'API 请求失败';
                addSystemMessage(`API 请求失败: ${errorMessage}`);
                updateLogError(logId, errorMessage);

                 // 如果是流式请求失败，需要移除加载动画并显示错误 (非流式错误也会走这里)
                 //aiMessageParts 对象包含了所有需要的元素引用
                 if (aiMessageParts && aiMessageParts.contentContainer) {
                     aiMessageParts.contentContainer.classList.remove('loading');
                     const textContainer = aiMessageParts.textContainer;
                     if (textContainer) {
                         // 如果已经有部分回复，在后面追加错误信息
                         if (aiMessageParts.object.text && aiMessageParts.object.text.trim() !== '') {
                            updateAIMessage(aiMessageParts, aiMessageParts.object.text + `\n\n*错误: ${errorMessage}*`);
                         } else {
                            // 如果没有收到任何回复，直接显示错误
                            textContainer.innerHTML = `<span style="color: red;">错误: ${errorMessage}</span>`;
                         }
                     }
                     scrollToBottom();
                 }

            } finally {
                // 清除图片附件（已在顶部清除）
                state.pendingMessages--;
                // state.streamController = null; // 此清理已移至 streamResponse 的 finally
                updateSendButtonState();
            }
        }

        // 流式响应处理
        async function streamResponse(requestBody, aiMessageParts, logId) { // 接收 aiMessageParts
            let responseText = '';
            let allChunks = '';
            let thinkingProcess = '';
            let errorOccurred = false; // 用于标记是否发生了非中止错误
            let wasAborted = false;    // 用于标记是否是用户中止


            try {
                // 创建控制器
                if (state.streamController) {
                    state.streamController.abort(); // 中止上一个未完成的流
                    // Note: This abort might trigger the catch block of a *previous* call to streamResponse
                    // We need to handle the state correctly across multiple calls/aborts
                }
                state.streamController = new AbortController();
                const signal = state.streamController.signal;

                // 创建请求
                const response = await fetch(elements.apiEndpoint.value, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${elements.apiKey.value}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: signal
                });

                if (!response.ok) {
                    errorOccurred = true;
                     const errorData = await response.json().catch(() => ({})); // 尝试解析JSON，失败也无妨
                    throw new Error(errorData.error?.message || `请求失败: ${response.status} ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // Check if the stream was aborted externally during the read operation
                    if (signal.aborted) {
                         wasAborted = true;
                         console.log('Stream aborted during read operation.');
                         reader.cancel('Stream aborted by user/system'); // Attempt to close the reader
                         break; // Exit the loop
                    }


                    const chunk = decoder.decode(value, { stream: true });
                    allChunks += chunk; // 收集所有原始块用于日志

                    // 处理SSE格式
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.substring(6);

                            // 检查是否结束信号
                            if (data === '[DONE]') continue;

                            try {
                                const json = JSON.parse(data);

                                // 提取思考过程（如果有）
                                if (elements.thinkingToggle.checked &&
                                    json.choices &&
                                    json.choices[0] &&
                                    json.choices[0].thinking) {
                                    thinkingProcess = json.choices[0].thinking;
                                     // 实时更新思考过程 (如果需要的话)
                                     addThinkingProcess(aiMessageParts, thinkingProcess);
                                }

                                // 提取内容
                                if (json.choices &&
                                    json.choices[0] &&
                                    json.choices[0].delta &&
                                    json.choices[0].delta.content) {
                                    const content = json.choices[0].delta.content;
                                    responseText += content;
                                    updateAIMessage(aiMessageParts, responseText); // 实时更新消息
                                }
                            } catch (e) {
                                console.error('解析流式数据失败:', e, '原始数据:', data);
                                // 可以在这里添加一个简单的错误提示到消息中，避免中断流
                                // updateAIMessage(aiMessageParts, responseText + `\n[解析数据失败: ${e.message}]`);
                            }
                        } else if (line.trim() !== '') {
                             // 处理非SSE格式的错误信息 (某些API可能返回非200状态码的JSON错误)
                             console.error('收到非SSE格式的行:', line);
                             if (line.includes('"error"')) { // 尝试解析潜在的错误JSON
                                 try {
                                      const errorJson = JSON.parse(line);
                                      if(errorJson.error?.message) {
                                          errorOccurred = true;
                                          // Store the error message, don't throw here to allow remaining stream data to be processed (if any)
                                          state.logs.find(log => log.id === logId).error = errorJson.error.message;
                                          console.error("Received error from API during stream:", errorJson.error.message);
                                          // Optionally update the message with error state indicator
                                          // updateAIMessage(aiMessageParts, responseText + `\n\n*API 错误: ${errorJson.error.message}*`);
                                      }
                                 } catch (e) {
                                     // ignore parse error, treat as plain text line or continue
                                 }
                             }
                             // 如果不是错误且不是SSE，可能只是空行或其他信息，可以忽略或记录
                        }
                    }
                }

                // 流接收完毕
                // 确保最后一个思考过程显示 (如果实时更新，这一步可能冗余，但保险)
                if (elements.thinkingToggle.checked && thinkingProcess) {
                     addThinkingProcess(aiMessageParts, thinkingProcess);
                }

                // 如果是正常完成且没有发生错误，才更新日志响应
                 if (!errorOccurred && !wasAborted) {
                    updateLogStreamEnd(logId, allChunks);
                 }


            } catch (error) {
                if (error.name === 'AbortError') {
                    wasAborted = true; // 标记为已中止
                    console.log('流式请求已中止');
                    const abortMessage = "AI 回复已由用户停止。";
                    // 更新AI消息框内容
                    if (responseText && responseText.trim() !== '') { // 如果已经输出了一部分内容
                        updateAIMessage(aiMessageParts, responseText + `\n\n*${abortMessage}*`);
                    } else { // 如果还没输出内容，或者内容为空
                        if (aiMessageParts && aiMessageParts.contentContainer) {
                            aiMessageParts.contentContainer.classList.remove('loading'); // 移除加载动画
                            if (aiMessageParts.textContainer) {
                                aiMessageParts.textContainer.innerHTML = `<span style="color: var(--text-secondary); font-style: italic;">${abortMessage}</span>`;
                            }
                        }
                    }
                    updateLogError(logId, '用户手动停止');
                } else {
                    errorOccurred = true; // 标记为其他错误
                    console.error('流式API请求失败:', error);
                    const errorMessage = error.message || '流式API请求失败';
                    if (responseText) {
                        updateAIMessage(aiMessageParts, responseText + `\n\n*错误: ${errorMessage}*`);
                    } else {
                        updateAIMessage(aiMessageParts, `错误: ${errorMessage}`);
                    }
                    updateLogError(logId, errorMessage);
                }
            } finally {
                state.streamController = null; // 清理当前流的控制器
                // 移除加载动画 (如果之前有且没有被正常移除)
                if (aiMessageParts && aiMessageParts.contentContainer && aiMessageParts.contentContainer.classList.contains('loading')) {
                    aiMessageParts.contentContainer.classList.remove('loading');
                    // 如果是因为中止且没有内容，确保打字点消失并显示提示
                    if (wasAborted && (!responseText || responseText.trim() === '')) {
                       if (aiMessageParts.textContainer) {
                           aiMessageParts.textContainer.innerHTML = `<span style="color: var(--text-secondary); font-style: italic;">AI 回复已由用户停止。</span>`;
                       }
                    } else if (errorOccurred && (!responseText || responseText.trim() === '')) {
                        // 如果是其他错误且没有内容
                        const logEntry = state.logs.find(log => log.id === logId);
                        const errText = logEntry?.error || '加载失败';
                        if (aiMessageParts.textContainer) {
                            aiMessageParts.textContainer.innerHTML = `<span style="color: red;">${errText}</span>`;
                        }
                    }
                }
                // sendMessage的finally会处理pendingMessages和按钮状态更新
            }
        }


        // 发送API请求 (非流式)
        async function sendRequest(requestBody) {
            const response = await fetch(elements.apiEndpoint.value, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${elements.apiKey.value}`
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                 // 即使响应不是OK,如果API返回了错误详情，也包含在抛出的错误中
                throw new Error(data.error?.message || `请求失败: ${response.status} ${response.statusText}`);
            }

            return data;
        }

        // 获取消息历史
        function getMessageHistory() {
            const maxContext = parseInt(elements.maxContext.value) || 10;
            const history = [];

            // 过滤掉系统消息和空的AI消息
            const relevantMessages = state.messages.filter(msg =>
                 msg.type !== 'system' && (msg.type === 'user' || msg.text.trim() !== '')
            );

            // 只保留最近的消息作为上下文
            // 保留 maxContext 对 (用户+AI) 消息，所以取最后 2 * maxContext 条相关消息
            const recentMessages = relevantMessages.slice(-maxContext * 2);

            for (const msg of recentMessages) {

                const historyItem = {
                    role: msg.type === 'user' ? 'user' : 'assistant',
                    content: msg.text // 初始使用文本内容
                };

                // 如果是用户消息且有图片，并且开启了视觉能力，将内容格式化为数组
                if (msg.type === 'user' && msg.images && msg.images.length > 0 && elements.visionToggle.checked) {
                    let contentArray = [];
                     // 添加文本部分
                    if (msg.text.trim()) { // 只有当有文本时才添加文本content
                        contentArray.push({
                            type: 'text',
                            text: msg.text.trim()
                        });
                    }

                     // 添加图片部分
                    msg.images.forEach(image => {
                        contentArray.push({
                            type: 'image_url',
                            image_url: {
                                url: image.data
                            }
                        });
                    });

                    // 如果只有图片没有文本，contentArray 将只有图片对象
                    // 如果有文本和图片，contentArray 将包含文本和图片对象
                    // 如果只有文本没有图片，contentArray 将只有文本对象 (通过上面的 if(msg.text.trim()) 逻辑处理)

                    // 如果 contentArray 非空，替换 historyItem 的 content
                    if (contentArray.length > 0) {
                        historyItem.content = contentArray;
                    } else if (msg.text.trim() === '') {
                         // 如果既没有文本也没有图片，这条用户消息应该被过滤掉 (相关消息过滤器已处理)
                         // 如果过滤失效，这里避免添加空content的用户消息
                         continue;
                    }
                    // 否则 (只有文本没有图片)，historyItem.content 仍然是 msg.text
                } else if (msg.type === 'user' && msg.text.trim() === '') {
                     // 只有图片没有文本的用户消息，但视觉能力未开启，也应该被过滤掉
                     continue;
                } else if (msg.type === 'ai' && msg.text.trim() === '') {
                     // 空的AI消息也应该被过滤掉 (相关消息过滤器已处理)
                     continue;
                }

                history.push(historyItem);
            }

            return history;
        }

        // 添加系统消息
        function addSystemMessage(text) {
            const messageObj = {
                type: 'system',
                text,
                time: new Date().toLocaleTimeString()
            };

            // 系统消息不计入上下文，所以不推入 state.messages (除非是图片上传提示，但也不影响上下文)

            const messageElement = document.createElement('div');
            messageElement.className = 'message system-message';
             // 关联 messageElement 和 messageObj (方便在 handleImageUpload 中查找和更新)
            messageElement.messageObj = messageObj;

            messageElement.innerHTML = `
                <div class="message-content">
                    ${text}
                    <div class="message-time">${messageObj.time}</div>
                </div>
            `;

            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

             return messageElement; // 返回元素以便后续更新 (如图片上传提示)
        }

        // 添加用户消息
        function addUserMessage(text, images = []) {
            const messageObj = {
                type: 'user',
                text,
                images: images ? [...images] : [], // 确保复制数组，而不是引用
                time: new Date().toLocaleTimeString()
            };

            state.messages.push(messageObj);

            const messageElement = document.createElement('div');
            messageElement.className = 'message user-message';

            let imageHtml = '';
            if (images && images.length > 0) {
                imageHtml = '<div class="image-attachments">';
                images.forEach(image => {
                    // 使用原始文件名作为 alt 文本，如果可用
                    imageHtml += `<img src="${image.data}" alt="${image.filename || '用户上传图片'}" class="image-attachment">`;
                });
                imageHtml += '</div>';
            }

            // 修改HTML结构，为Markdown渲染的文本创建一个专用容器 .message-text-area
            messageElement.innerHTML = `
                <div class="message-content">
                    <div class="message-text-area"></div> <!-- Markdown渲染区域 -->
                    ${imageHtml}
                    <div class="message-time">${messageObj.time}</div>
                </div>
                <div class="message-avatar">用</div>
            `;

            const messageTextContainer = messageElement.querySelector('.message-text-area');
            const messageContentContainer = messageElement.querySelector('.message-content');

            // 使用新的渲染函数处理文本
            renderMarkdownAndAttachCopyButtons(text, messageTextContainer, messageContentContainer);

            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

            // 返回包含元素引用的对象,方便后续操作（如果需要）
            return {
                element: messageElement,
                object: messageObj,
                textContainer: messageTextContainer,
                contentContainer: messageContentContainer
            };
        }

        // 添加AI消息
        function addAIMessage(text = '') { // text 参数通常在初始调用时为空
            const messageObj = {
                type: 'ai',
                text: text, // 初始文本，通常在流式传输时会更新
                time: new Date().toLocaleTimeString()
            };

            state.messages.push(messageObj);

            const messageElement = document.createElement('div');
            messageElement.className = 'message ai-message';

            // 修改HTML结构，为Markdown渲染的文本创建一个专用容器 .message-text-area
            // 并为打字点动画准备好 .message-text-area
            messageElement.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div class="message-text-area"></div> <!-- Markdown渲染/打字点区域 -->
                    <div class="message-time">${messageObj.time}</div>
                </div>
            `;

            const messageTextContainer = messageElement.querySelector('.message-text-area');
            const messageContentContainer = messageElement.querySelector('.message-content');

            if (!text) { // 如果初始文本为空，则显示加载动画
                messageContentContainer.classList.add('loading');
                messageTextContainer.innerHTML = `
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                `;
            } else {
                // 如果初始就有文本 (例如系统消息用此函数添加),则直接渲染
                renderMarkdownAndAttachCopyButtons(text, messageTextContainer, messageContentContainer);
            }

            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

            // 返回包含元素引用的对象，方便 updateAIMessage 更新
            return {
                element: messageElement,
                object: messageObj,
                textContainer: messageTextContainer,
                contentContainer: messageContentContainer
            };
        }

        // 更新AI消息
        function updateAIMessage(aiMessageParts, newText) {
             if (!aiMessageParts || !aiMessageParts.object) {
                 console.error("无效的 aiMessageParts 对象", aiMessageParts);
                 return;
             }
            aiMessageParts.object.text = newText; // 更新存储的原始文本

            // 移除加载状态 (如果之前有)
            aiMessageParts.contentContainer.classList.remove('loading');

            // 使用新的渲染函数处理更新的文本
            renderMarkdownAndAttachCopyButtons(newText, aiMessageParts.textContainer, aiMessageParts.contentContainer);

            // 实时滚动到底部可能导致用户无法阅读，可以考虑仅在用户接近底部时滚动
            // 但对于流式输出，通常期望自动滚动
            scrollToBottom();
        }

        // 添加思考过程
        function addThinkingProcess(aiMessageParts, thinkingText) {
            if (!thinkingText || !elements.thinkingToggle.checked || !aiMessageParts || !aiMessageParts.element) return;

            const messageContent = aiMessageParts.element.querySelector('.message-content');
             if (!messageContent) return;

            // 检查是否已存在思考过程元素
            let thinkingElement = messageContent.querySelector('.thinking-process');

            if (!thinkingElement) {
                thinkingElement = document.createElement('div');
                thinkingElement.className = 'thinking-process';
                // 思考过程元素应该添加到消息内容（message-content）的末尾，但在时间戳之前
                const timeElement = messageContent.querySelector('.message-time');
                if (timeElement) {
                    messageContent.insertBefore(thinkingElement, timeElement);
                } else {
                    // 如果没有时间戳（不应该发生），就直接append
                    messageContent.appendChild(thinkingElement);
                }
            }

            thinkingElement.textContent = thinkingText; // 思考过程通常是纯文本
            scrollToBottom();
        }


        // 滚动到底部
        function scrollToBottom() {
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        // 更新发送按钮状态
        function updateSendButtonState() {
            const sendButton = elements.sendButton;
            const hasValidModel = elements.modelSelect.value !== '';

            // 定义SVG图标字符串
            const sendSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
            const stopSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>`;

            if (state.streamController && state.pendingMessages > 0) { // 正在流式输出
                sendButton.innerHTML = `<span>停止</span>${stopSvg}`;
                sendButton.disabled = false; // "停止"按钮应该总是可用的
                sendButton.title = "停止AI回复";
            } else { // 非流式输出，或没有 pending message
                sendButton.innerHTML = `<span>发送</span>${sendSvg}`;
                sendButton.disabled = state.pendingMessages > 0 || !hasValidModel;
                sendButton.title = "发送消息";
            }
        }

        // 添加日志
        function addLog(title, requestData) {
            const timestamp = new Date();
            const logId = `log-${Date.now()}`;

            const logObj = {
                id: logId,
                title,
                timestamp,
                request: requestData,
                response: null,
                error: null
            };

            state.logs.unshift(logObj); // 新日志放在前面

            // 创建日志元素
            const logElement = document.createElement('div');
            logElement.className = 'log-item';
            logElement.id = logId;
            logElement.innerHTML = `
                <div class="log-header" onclick="window.toggleLogBody('${logId}')">
                    <div class="log-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        ${title}
                    </div>
                    <div class="log-timestamp">${timestamp.toLocaleTimeString()}</div>
                </div>
                <div class="log-body" id="${logId}-body">
                    <div class="log-section">
                        <div class="log-section-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 10 4 15 9 20"></polyline>
                                <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
                            </svg>
                            请求数据
                        </div>
                        <pre class="log-content">${JSON.stringify(requestData, null, 2)}</pre>
                    </div>
                    <div class="log-section" id="${logId}-response-section" style="display: none;">
                        <div class="log-section-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 10 20 15 15 20"></polyline>
                                <path d="M4 4v7a4 4 0 0 0 4 4h12"></path>
                            </svg>
                            响应数据
                        </div>
                        <pre class="log-content" id="${logId}-response"></pre>
                    </div>
                    <div class="log-section" id="${logId}-error-section" style="display: none;">
                        <div class="log-section-title" style="color: #e74c3c;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>

                        <pre class="log-content" id="${logId}-error" style="color: #e74c3c;"></pre>
                    </div>
                </div>
            `;

            elements.logsContainer.insertBefore(logElement, elements.logsContainer.firstChild);

            return logId;
        }

        // 更新日志响应
        function updateLogResponse(logId, responseData) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                logObj.response = responseData;
            }

            const responseSection = document.getElementById(`${logId}-response-section`);
            const responseElement = document.getElementById(`${logId}-response`);

            if (responseSection && responseElement) {
                responseSection.style.display = 'block';
                responseElement.textContent = JSON.stringify(responseData, null, 2);
            }
        }

        // 更新日志流式结束
        function updateLogStreamEnd(logId, streamData) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                logObj.response = "流式响应 (已完成)";
                if (streamData) {
                     try {
                         // 尝试解析完整的流数据作为 JSON (如果API最后提供了汇总)
                         // 或者简单地保存为字符串，更可靠
                         logObj.response = streamData; // 保存原始数据
                     } catch (e) {
                         // 如果解析失败，保存原始流数据
                         logObj.response = streamData;
                     }
                }
            }

            const responseSection = document.getElementById(`${logId}-response-section`);
            const responseElement = document.getElementById(`${logId}-response`);

            if (responseSection && responseElement) {
                responseSection.style.display = 'block';
                 // 显示保存的响应数据
                responseElement.textContent = typeof logObj.response === 'string' ? logObj.response : JSON.stringify(logObj.response, null, 2);
            }
        }

        // 更新日志错误
        function updateLogError(logId, errorMessage) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                logObj.error = errorMessage;
            }

            const errorSection = document.getElementById(`${logId}-error-section`);
            const errorElement = document.getElementById(`${logId}-error`);

            if (errorSection && errorElement) {
                errorSection.style.display = 'block';
                errorElement.textContent = errorMessage;
                 // 更新日志标题颜色
                 const logTitleElement = document.getElementById(logId)?.querySelector('.log-title');
                 if (logTitleElement) {
                     logTitleElement.style.color = '#e74c3c';
                 }
            }
        }

        // 切换日志主体显示/隐藏
        window.toggleLogBody = function(logId) {
            const logBody = document.getElementById(`${logId}-body`);
            if (logBody) {
                logBody.classList.toggle('open');
            }
        };

        // 图片预览
        function showImagePreview(src) {
            elements.previewImage.src = src;
            elements.imagePreview.classList.add('active');
            elements.overlay.classList.add('active');
        }

        // 关闭图片预览
        function closeImagePreview() {
            elements.imagePreview.classList.remove('active');
            elements.overlay.classList.remove('active');
        }


        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
