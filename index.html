<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* 基础样式 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #app {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            /* 避免滚动条影响布局 */
        }

        .container {
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            margin-bottom: 10px;
        }

        /* 消息框 */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            /* 消息从底部往上排列 */
        }

        .message {
            margin: 5px;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
            /* 强制换行 */
        }

        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            /* 用户消息靠右 */
            border-bottom-right-radius: 2px;
            /* 右下角变尖 */
        }

        .ai-message {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            /* AI消息靠左 */
            border-bottom-left-radius: 2px;
        }

        /* 输入区域 */
        #input-area {
            display: flex;
            align-items: center;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #input-area textarea {
            flex: 1;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid #ddd;
            resize: none;
            /* 禁止用户调整大小 */
            margin-right: 10px;
            font-size: 10px;
        }

        /* 按钮 */
        #input-area button,
        #settings-btn,
        #clear-context-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 10px;
        }

        #input-area button:hover,
        #settings-btn:hover,
        #clear-context-btn:hover {
            background-color: #0056b3;
        }

        /* 设置面板 */
        #settings-panel {
            display: none;
            /* 默认隐藏 */
            position: fixed;
            /* 固定位置 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* 居中 */
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            /* 高于其他元素 */
            width: 80%;
            max-width: 500px;
        }

        #settings-panel h2 {
            margin-top: 0;
            font-size: 12px;
        }

        #settings-panel label {
            display: block;
            margin-top: 10px;
            font-size: 10px;
        }

        #settings-panel input[type="text"],
        #settings-panel input[type="number"],
        #settings-panel select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            /* 避免padding影响宽度 */
            font-size: 10px;
        }

        #settings-panel button {
            margin-top: 15px;
            /* 与上方元素保持距离 */
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
            color: #999;
        }

        /* 遮罩层 */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* 请求日志 */
        #log-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            /* 默认高度 */
            background-color: #333;
            color: #fff;
            overflow-y: auto;
            /* 允许滚动 */
            display: none;
            /* 初始隐藏 */
            z-index: 1001;
            /* 高于设置面板 */
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        #log-panel pre {
            padding: 10px;
            font-size: 10px;
            white-space: pre-wrap;
            /* 保留换行和空格 */
        }

        #log-toggle-btn {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 1002;
            /* 高于日志面板 */
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 10px;
        }

        /* 响应式布局 - 小屏幕 */
        @media (max-width: 600px) {
            #settings-panel {
                width: 95%;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container" id="chat-box">
            <!-- 消息将在这里动态添加 -->
        </div>

        <div id="input-area">
            <textarea id="message-input" placeholder="输入消息..."></textarea>
            <button id="send-btn">发送</button>
        </div>

        <button id="settings-btn">设置</button>
        <button id="clear-context-btn">清除上下文</button>

        <!-- 设置面板 -->
        <div id="settings-panel">
            <button class="close-btn" onclick="toggleSettingsPanel()">&times;</button>
            <h2>设置</h2>
            <label for="model-select">选择模型:</label>
            <select id="model-select">
                <option value="o3-mini-high">o3-mini-high</option>
                <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                <option value="custom">自定义</option>
            </select>

            <div id="custom-model-input" style="display: none;">
                <label for="custom-model-name">模型名称:</label>
                <input type="text" id="custom-model-name">
            </div>

            <label for="api-key-input">API Key:</label>
            <input type="text" id="api-key-input">

            <label for="api-url-input">API 地址:</label>
            <input type="text" id="api-url-input">

            <label for="max-tokens-input">单次回复最大 Tokens:</label>
            <input type="number" id="max-tokens-input" value="100000">

            <label for="context-length-input">上下文记忆条数:</label>
            <input type="number" id="context-length-input" value="30">

            <label for="temperature-input">温度 (0-1):</label>
            <input type="number" id="temperature-input" step="0.1" value="0">

            <button id="save-settings-btn">保存设置</button>
        </div>

        <div id="overlay"></div>

        <!-- 请求日志面板 -->
        <div id="log-panel">
            <pre id="log-content"></pre>
        </div>
        <button id="log-toggle-btn">显示/隐藏日志</button>
    </div>

    <script>
        // 获取 DOM 元素
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-btn');
        const settingsButton = document.getElementById('settings-btn');
        const clearContextButton = document.getElementById('clear-context-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const overlay = document.getElementById('overlay');
        const modelSelect = document.getElementById('model-select');
        const customModelInput = document.getElementById('custom-model-input');
        const customModelNameInput = document.getElementById('custom-model-name');
        const apiKeyInput = document.getElementById('api-key-input');
        const apiUrlInput = document.getElementById('api-url-input');
        const maxTokensInput = document.getElementById('max-tokens-input');
        const contextLengthInput = document.getElementById('context-length-input');
        const temperatureInput = document.getElementById('temperature-input');
        const saveSettingsButton = document.getElementById('save-settings-btn');
        const logPanel = document.getElementById('log-panel');
        const logContent = document.getElementById('log-content');
        const logToggleButton = document.getElementById('log-toggle-btn');

        // 存储上下文消息
        let contextMessages = [];

        // 默认设置
        let settings = {
            model: 'o3-mini-high',
            apiKey: 'sk-FTtQGU2Fow30VrxWMtqMoIa9l3Q8KKaAolEvgOWQQaiaRzsD',
            apiUrl: 'https://api.zetatechs.com/v1',
            maxTokens: 100000,
            contextLength: 30,
            temperature: 0,
            customModelName: ''
        };

        // 加载保存的设置
        function loadSettings() {
            const savedSettings = localStorage.getItem('aiChatSettings');
            if (savedSettings) {
                settings = JSON.parse(savedSettings);
                // 更新 UI
                modelSelect.value = settings.model;
                apiKeyInput.value = settings.apiKey;
                apiUrlInput.value = settings.apiUrl;
                maxTokensInput.value = settings.maxTokens;
                contextLengthInput.value = settings.contextLength;
                temperatureInput.value = settings.temperature;
                customModelNameInput.value = settings.customModelName;

                if (settings.model === 'custom') {
                    customModelInput.style.display = 'block';
                }
            }
        }

        // 保存设置
        function saveSettings() {
            settings.model = modelSelect.value;
            settings.apiKey = apiKeyInput.value;
            settings.apiUrl = apiUrlInput.value;
            settings.maxTokens = parseInt(maxTokensInput.value, 10);
            settings.contextLength = parseInt(contextLengthInput.value, 10);
            settings.temperature = parseFloat(temperatureInput.value);
            settings.customModelName = customModelNameInput.value;

            localStorage.setItem('aiChatSettings', JSON.stringify(settings));
            alert('设置已保存！');
        }

        // 切换设置面板的显示/隐藏
        function toggleSettingsPanel() {
            settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        // 清除上下文
        function clearContext() {
            contextMessages = [];
            chatBox.innerHTML = ''; // 清空聊天框
            logMessage('上下文已清除', 'info');
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 添加用户消息到聊天框
            appendMessage(message, 'user');
            messageInput.value = ''; // 清空输入框

            // 将新消息添加到上下文
            contextMessages.push({ role: 'user', content: message });

            // 限制上下文长度
            if (contextMessages.length > settings.contextLength) {
                contextMessages.shift(); // 移除最早的消息
            }

            try {
                // 构建请求数据
                const requestData = {
                    model: settings.model === 'custom' ? settings.customModelName : settings.model,
                    messages: contextMessages,
                    max_tokens: settings.maxTokens,
                    temperature: settings.temperature,
                };

                logMessage("发送请求：" + JSON.stringify(requestData, null, 2));

                // 发送请求
                const response = await fetch(settings.apiUrl + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${settings.apiKey}`
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${errorData.error.message}`);
                }

                const responseData = await response.json();
                logMessage("收到响应" + JSON.stringify(responseData, null, 2))
                const aiReply = responseData.choices[0].message.content;


                // 将 AI 回复添加到上下文
                contextMessages.push({ role: 'assistant', content: aiReply });

                // 添加 AI 消息到聊天框
                appendMessage(aiReply, 'ai');


            } catch (error) {
                appendMessage(`Error: ${error.message}`, 'ai');
                logMessage(`Error: ${error.message}`, 'error');
            }
        }

        // 添加消息到聊天框
        // 添加消息到聊天框，并进行 Markdown 渲染
        function appendMessage(message, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', `${sender}-message`);

            // 使用 marked.js 将 Markdown 转换为 HTML
            const html = marked.parse(message);
            messageElement.innerHTML = html;

            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight; // 滚动到底部

            // 在渲染后，使用 highlight.js 高亮代码块
            hljs.highlightAll();
            // 使用 KaTeX 渲染数学公式
            renderMathInElement(messageElement, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false // 忽略渲染错误
            });
        }

        // 记录日志
        function logMessage(message, type = 'log') {
            const now = new Date();
            const time = now.toLocaleTimeString(); // 获取当前时间
            logContent.innerHTML += `<span style="${type === 'error' ? 'color: red;' : ''}">${time} - ${type}: ${message}</span><br>`;
            logPanel.scrollTop = logPanel.scrollHeight; // 滚动到底部
        }

        // 切换日志面板的显示/隐藏
        function toggleLogPanel() {
            logPanel.style.display = logPanel.style.display === 'block' ? 'none' : 'block';
        }

        // 事件监听器
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); // 阻止默认的换行行为
                sendMessage();
            }
        });

        settingsButton.addEventListener('click', toggleSettingsPanel);
        clearContextButton.addEventListener('click', clearContext);
        saveSettingsButton.addEventListener('click', saveSettings);
        logToggleButton.addEventListener('click', toggleLogPanel);

        modelSelect.addEventListener('change', () => {
            if (modelSelect.value === 'custom') {
                customModelInput.style.display = 'block';
            } else {
                customModelInput.style.display = 'none';
            }
        });

        // 初始化
        loadSettings();
    </script>
</body>

</html>
