        // Stream response handling
        async function streamResponse(requestBody, aiMessageParts, logId) { // Receive aiMessageParts
            let responseText = '';
            let allRawChunks = ''; // Collect all raw data chunks for logging
            let thinkingProcess = ''; // Accumulate thinking process chunks
            let errorOccurred = false; // Flag for non-abort errors
            let wasAborted = false;    // Flag for user abort


            try {
                // Create controller
                // Abort previous unfinished stream if it exists
                if (state.streamController) {
                    try {
                         state.streamController.abort('New request initiated');
                         // Wait a brief moment for the previous stream's catch/finally to potentially run
                         await new Promise(resolve => setTimeout(resolve, 50));
                    } catch (e) {
                        console.warn("Error aborting previous stream:", e);
                    }
                }
                state.streamController = new AbortController();
                const signal = state.streamController.signal;

                // Create request
                const response = await fetch(elements.apiEndpoint.value, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${elements.apiKey.value}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: signal
                });

                if (!response.ok) {
                    errorOccurred = true;
                     // Read the full response body to get error details
                    const errorBody = await response.text();
                    let errorData = {};
                    try {
                        errorData = JSON.parse(errorBody);
                    } catch (e) {
                        console.warn("Failed to parse error body as JSON:", e, "Body:", errorBody);
                    }

                    throw new Error(errorData.error?.message || errorData.message || `Request failed: ${response.status} ${response.statusText}` + (errorBody ? ` - ${errorBody.substring(0, 100)}...` : ''));
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // Check if the stream was aborted externally during the read operation
                    if (signal.aborted) {
                         wasAborted = true;
                         console.log('Stream aborted during read operation.');
                         // No need to call reader.cancel() as abort() handles it
                         break; // Exit the loop
                    }

                    const chunk = decoder.decode(value, { stream: true });
                    allRawChunks += chunk; // Collect all raw chunks for logging

                    // Process SSE format (data: ...)
                    // Split by potential newlines within the chunk
                    // Use a regex to handle various newline characters and potentially multiple data lines in one chunk
                    const lines = chunk.split(/[\r\n]+/);


                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith('data: ')) {
                            const data = trimmedLine.substring(6).trim(); // Trim data payload too

                            // Check for end signal (case-insensitive and flexible)
                            if (data.toUpperCase() === '[DONE]') continue;

                            try {
                                const json = JSON.parse(data);

                                // Handle OpenAI-style chunk structure
                                if (json.choices && json.choices[0]) {
                                     // Check for content delta
                                     if (json.choices[0].delta && json.choices[0].delta.content) {
                                         const content = json.choices[0].delta.content;
                                         responseText += content;
                                         // Update message in real-time. Do NOT render MathJax yet for performance during streaming.
                                         // MathJax rendering is costly and should only be done on the final content.
                                         // updateAIMessage will update the object.text and call renderMarkdownAndAttachCopyButtons
                                         // The render function will only do MathJax if renderMathNow is true.
                                         await updateAIMessage(aiMessageParts, responseText, false); // Add await, set renderMathNow to false
                                     }
                                     // Check for tool_calls delta (relevant if thinking is tied to tools)
                                     // Handling tool_calls delta for thinking process display might be complex
                                     // depending on the API's exact format. It might involve accumulating function calls.
                                     // A simpler approach if the API provides a dedicated 'thinking' field is below.
                                     // if (json.choices[0].delta && json.choices[0].delta.tool_calls) { ... }

                                }

                                // Extract thinking process (if available) from top-level or choices[0]
                                // This assumes thinking process comes in separate chunks or a specific field
                                if (elements.thinkingToggle.checked) {
                                     let currentThinkingChunk = null;
                                     if (json.thinking && typeof json.thinking === 'string') {
                                         currentThinkingChunk = json.thinking;
                                     } else if (json.choices && json.choices[0] && json.choices[0].thinking && typeof json.choices[0].thinking === 'string') {
                                         currentThinkingChunk = json.choices[0].thinking;
                                     }
                                     // If thinking is sent in chunks, append them
                                     if (currentThinkingChunk) {
                                         thinkingProcess += currentThinkingChunk;
                                         addThinkingProcess(aiMessageParts, thinkingProcess); // Update thinking display in real-time
                                     }
                                }


                            } catch (e) {
                                console.error('Failed to parse stream data:', e, 'Raw data:', data);
                                // Can add a simple error message to the message here, without interrupting the stream
                                // updateAIMessage(aiMessageParts, responseText + `\n[Failed to parse data: ${e.message}]`);
                            }
                        } else if (trimmedLine !== '') {
                             // Handle non-SSE format error messages or other non-data lines
                             console.log('Received non-SSE data line:', trimmedLine);
                             // You might inspect 'trimmedLine' for specific error patterns if your API sends them this way
                             // If it's a critical error sent without SSE format, the response.ok check above might catch it,
                             // or the final read() call might throw.
                        }
                    }
                }

                // Append any remaining raw chunk data (should be empty if stream was proper SSE ending with \n)
                if (allRawChunks.trim() !== '') {
                    console.warn("Remaining raw stream data after loop:", allRawChunks);
                    // Decide whether to append this as an error or warning message to the chat
                    // Example: append to responseText before final updateAIMessage
                    // responseText += `\n\n*[警告: 流末尾有未解析数据]*\n\`\`\`\n${allRawChunks.trim()}\n\`\`\``;
                }


                // After stream is complete, if successful and there was content, do final Markdown parsing, copy button handling, and MathJax rendering
                // This also handles the case where responseText is empty but thinkingProcess is not.
                if (!errorOccurred && !wasAborted) {
                    // Call updateAIMessage with the final accumulated text.
                    // This call will trigger final Markdown parsing, copy buttons, and MathJax rendering.
                    // If responseText is empty but thinkingProcess exists, updateAIMessage still needs to be called
                    // to ensure the loading state is removed and potential thinking process element is finalized.
                    await updateAIMessage(aiMessageParts, responseText, true); // Add await, set renderMathNow to true

                    // Ensure the last thinking process is displayed (might be redundant if updated real-time, but safer)
                    // This also re-adds it if the main text update caused it to be overwritten (which renderMarkdownAndAttachCopyButtons tries to avoid)
                    if (elements.thinkingToggle.checked && thinkingProcess) {
                         addThinkingProcess(aiMessageParts, thinkingProcess);
                    } else if (elements.thinkingToggle.checked && !thinkingProcess && aiMessageParts.element.querySelector('.thinking-process')) {
                        // If thinking toggle is ON but no thinking text was received in this stream,
                        // and a thinking element somehow exists, you might want to remove it or clear it.
                        // Or if the API sends thinking in a non-streaming part after stream ends, handle that here.
                        // For now, we assume thinking is streamed or in the initial non-streaming response.
                    }


                    // If completed normally and no error occurred, update the log response
                    updateLogStreamEnd(logId, allRawChunks); // Log the collected raw chunks


                } else if (wasAborted) {
                     // Log the raw chunks collected up to the point of abort
                     updateLogStreamEnd(logId, allRawChunks + '\n\n[Stream Aborted]');
                }


            } catch (error) {
                if (error.name === 'AbortError') {
                    wasAborted = true; // Mark as aborted
                    console.log('Streaming request aborted');
                    const abortMessage = "AI 回复已由用户停止。";
                    // Update AI message content
                    // Ensure loading state is removed regardless of content presence
                    if (aiMessageParts && aiMessageParts.contentContainer) {
                        aiMessageParts.contentContainer.classList.remove('loading');
                    }
                    // Use updateAIMessage to handle Markdown and potential formula rendering for the final state
                    // This correctly adds the abort message after any partial content
                     await updateAIMessage(aiMessageParts, responseText + `\n\n*${abortMessage}*`, true); // Add await

                    updateLogError(logId, '用户手动停止');
                } else {
                    errorOccurred = true; // Mark as other error
                    console.error('Streaming API request failed:', error);
                    const errorMessage = error.message || 'Streaming API request failed';
                    // Ensure loading state is removed
                    if (aiMessageParts && aiMessageParts.contentContainer) {
                        aiMessageParts.contentContainer.classList.remove('loading');
                    }
                    // Use updateAIMessage to handle Markdown and potential formula rendering for the final state
                    // This correctly adds the error message after any partial content
                    await updateAIMessage(aiMessageParts, responseText + `\n\n*Error: ${errorMessage}*`, true); // Add await

                    updateLogError(logId, errorMessage);
                }
            } finally {
                state.streamController = null; // Clean up controller for the current stream
                // The `finally` block in `sendMessage` will handle `pendingMessages` and button state.
                // We just need to ensure the loading indicator is gone here if it wasn't removed earlier.
                 if (aiMessageParts && aiMessageParts.contentContainer && aiMessageParts.contentContainer.classList.contains('loading')) {
                     aiMessageParts.contentContainer.classList.remove('loading');
                 }
            }
        }


        // Send API request (non-streaming)
        async function sendRequest(requestBody) {
            const response = await fetch(elements.apiEndpoint.value, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${elements.apiKey.value}`
                },
                body: JSON.stringify(requestBody)
            });

            // Read the full response body first
             const responseBody = await response.text();

            // Always attempt to parse JSON response, even on non-OK status
            let data = {};
            try {
                 data = JSON.parse(responseBody);
            } catch (e) {
                 // If JSON parsing fails, throw an error based on status and raw body
                 throw new Error(`Request failed: ${response.status} ${response.statusText || 'Unknown Error'}` + (responseBody ? ` - ${responseBody.substring(0, 100)}...` : ''));
            }


            if (!response.ok) {
                 // If response is not OK and we got JSON, use the API's error message if available
                throw new Error(data.error?.message || data.message || `Request failed: ${response.status} ${response.statusText}`);
            }

            return data;
        }

        // Get message history
        function getMessageHistory() {
            const maxContext = parseInt(elements.maxContext.value) || 10;
            const history = [];

            // Filter out system messages and empty AI messages
            const relevantMessages = state.messages.filter(msg =>
                 // Only include user and AI messages in history
                 msg.type === 'user' || (msg.type === 'ai' && msg.text && msg.text.trim() !== '')
            );

            // Only keep the most recent messages as context
            // Keep up to maxContext messages regardless of pair, depending on API context window size.
             const recentMessages = relevantMessages.slice(-maxContext);


            for (const msg of recentMessages) {
                 // Re-check filters just in case (should be redundant after Array.filter)
                 if (msg.type !== 'user' && msg.type !== 'ai') continue;
                 if (msg.type === 'ai' && (!msg.text || msg.text.trim() === '')) continue;
                 // Skip user messages that were text-only empty string before adding images (if any were added)
                 if (msg.type === 'user' && (!msg.text || msg.text.trim() === '') && (!msg.images || msg.images.length === 0)) continue;


                const historyItem = {
                    role: msg.type === 'user' ? 'user' : 'assistant',
                    // Content needs special handling for vision models
                    content: msg.text || '' // Default to string content (can be empty string)
                };

                // If it's a user message with images and vision is enabled, format content as an array
                if (msg.type === 'user' && msg.images && msg.images.length > 0 && elements.visionToggle.checked) {
                    let contentArray = [];
                     // Add text part if present and not just whitespace
                    if (msg.text && msg.text.trim()) {
                        contentArray.push({
                            type: 'text',
                            text: msg.text.trim()
                        });
                    }

                     // Add image parts
                    msg.images.forEach(image => {
                        contentArray.push({
                            type: 'image_url',
                            image_url: {
                                url: image.data // Base64 URL (now WebP or original)
                            }
                        });
                    });

                    // If contentArray has items, replace historyItem's content
                    if (contentArray.length > 0) {
                        historyItem.content = contentArray;
                    } else {
                        // This case should ideally not happen for messages that passed the initial filter
                        // It would mean a user message had images but no text, and vision was enabled,
                        // but the image processing failed or resulted in no valid image data.
                        console.warn("User message included in history had images and vision enabled, but produced no valid content parts:", msg);
                        // Decide how to handle this: send an empty array, or skip the message.
                        // Sending an empty array [] for content might be the safest approach based on API specs.
                         historyItem.content = []; // Send empty array if no text and no valid images were added to contentArray
                    }
                }
                 // If it's a user message with text but no images, or vision disabled, historyItem.content remains msg.text (string)
                 // If it's an AI message, historyItem.content is msg.text (string)


                history.push(historyItem);
            }

            return history;
        }


        // Add system message
        function addSystemMessage(text) {
            const messageObj = {
                type: 'system',
                text: text, // Store raw text
                time: new Date().toLocaleTimeString(),
                isUploadNotice: false, // Default
            };

            // System messages are generally not included in context, so don't push to state.messages
            // We will add a minimal messageObj to the element for easy lookup in updateUploadNotice
            const messageElement = document.createElement('div');
            messageElement.className = 'message system-message';
             // Link messageElement to messageObj for easy lookup (useful for updates like upload notice)
            messageElement.messageObj = messageObj;

            // System messages usually don't need markdown/MathJax, just sanitize for safety
             let sanitizedText = text;
             if (typeof DOMPurify !== 'undefined') {
                 sanitizedText = DOMPurify.sanitize(text);
             }
            messageElement.innerHTML = `
                <div class="message-content">
                    ${sanitizedText}
                    <div class="message-time">${messageObj.time}</div>
                </div>
            `;

            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

             return messageElement; // Return element for possible future updates (like upload notice)
        }

        // Add user message
        async function addUserMessage(text, images = []) { // Add async keyword
            const messageObj = {
                type: 'user',
                text, // Store raw text
                images: images ? [...images] : [], // Store a copy of images at the time of sending
                time: new Date().toLocaleTimeString()
            };

            state.messages.push(messageObj);
            saveChatHistory(); // 新增：保存聊天记录

            const messageElement = document.createElement('div');
            messageElement.className = 'message user-message';

            let imageHtml = '';
            if (images && images.length > 0) {
                imageHtml = '<div class="image-attachments">';
                images.forEach(image => {
                    // Use original filename as alt text if available
                    imageHtml += `<img src="${image.data}" alt="${image.filename || 'User uploaded image'}" class="image-attachment">`;
                });
                imageHtml += '</div>';
            }

            // Modify HTML structure to create a dedicated container for Markdown-rendered text .message-text-area
            messageElement.innerHTML = `
                <div class="message-content">
                    <div class="message-text-area"></div> <!-- Markdown rendering area -->
                    ${imageHtml}
                    <div class="message-time">${messageObj.time}</div>
                </div>
                <div class="message-avatar">用</div>
            `;

            const messageTextContainer = messageElement.querySelector('.message-text-area');
            const messageContentContainer = messageElement.querySelector('.message-content');

            // Use the new render function to process text
            await renderMarkdownAndAttachCopyButtons(text, messageTextContainer, messageContentContainer); // Add await

            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

            // Return an object with element references for later use (if needed by update functions)
            return {
                element: messageElement,
                object: messageObj,
                textContainer: messageTextContainer,
                contentContainer: messageContentContainer
            };
        }

        // Add AI message
        function addAIMessage(text = '') { // text parameter is usually empty on initial call
            const messageObj = {
                type: 'ai',
                text: text, // Initial text, will be updated during streaming
                time: new Date().toLocaleTimeString()
            };

            state.messages.push(messageObj);
            // saveChatHistory(); // AI message is saved when streaming is complete or non-streaming response is received

            const messageElement = document.createElement('div');
            messageElement.className = 'message ai-message';

            // Modify HTML structure to create a dedicated container for Markdown-rendered text .message-text-area
            // And prepare .message-text-area for the typing dots animation
            messageElement.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div class="message-text-area"></div> <!-- Markdown rendering/typing dots area -->
                    <div class="message-time">${messageObj.time}</div>
                </div>
            `;

            const messageTextContainer = messageElement.querySelector('.message-text-area');
            const messageContentContainer = messageElement.querySelector('.message-content');

            if (!text) { // If initial text is empty, show loading animation
                messageContentContainer.classList.add('loading');
                messageTextContainer.innerHTML = `
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                `;
            } else {
                // If there's initial text (e.g., system messages added with this function, though not the primary use)
                // Note: This path might not fully handle Markdown/MathJax. Prefer updateAIMessage for AI content.
                 // For AI messages, we should always use updateAIMessage to handle potential markdown/MathJax
                 // This initial text path is more for placeholder or specific non-markdown cases.
                 messageTextContainer.textContent = text; // Simple text content
            }


            elements.chatMessages.appendChild(messageElement);
            scrollToBottom();

            // Return an object with element references for updateAIMessage
            return {
                element: messageElement,
                object: messageObj,
                textContainer: messageTextContainer,
                contentContainer: messageContentContainer
            };
        }

        // Update AI message
        async function updateAIMessage(aiMessageParts, newText, renderMathNow = true) { // Add async and renderMathNow parameters
            if (!aiMessageParts || !aiMessageParts.object || !aiMessageParts.textContainer || !aiMessageParts.contentContainer) {
                console.error("Invalid aiMessageParts object passed to updateAIMessage", aiMessageParts);
                return;
            }
            aiMessageParts.object.text = newText; // Update stored raw text

            // Remove loading state (if it was there)
            aiMessageParts.contentContainer.classList.remove('loading');

            // Use the render function which handles Markdown, Copy Buttons, and MathJax conditionally
            await renderMarkdownAndAttachCopyButtons(newText, aiMessageParts.textContainer, aiMessageParts.contentContainer);

            if (renderMathNow) { // <--- When this is the final update (or initial load)
                saveChatHistory(); // <--- 新增：保存聊天记录
            }

            // Scroll to bottom (moved here to ensure it happens after rendering updates)
            scrollToBottom();
        }

        // Add thinking process
        function addThinkingProcess(aiMessageParts, thinkingText) {
            if (!thinkingText || !elements.thinkingToggle.checked || !aiMessageParts || !aiMessageParts.element) return;

            const messageContent = aiMessageParts.element.querySelector('.message-content');
             if (!messageContent) return;

            // Check if thinking process element already exists
            let thinkingElement = messageContent.querySelector('.thinking-process');

            if (!thinkingElement) {
                thinkingElement = document.createElement('div');
                thinkingElement.className = 'thinking-process';
                // The thinking process element should be added at the end of the message content (message-content), but before the timestamp
                const timeElement = messageContent.querySelector('.message-time');
                if (timeElement) {
                    messageContent.insertBefore(thinkingElement, timeElement);
                } else {
                    // If there's no timestamp (shouldn't happen), just append
                    messageContent.appendChild(thinkingElement);
                }
            }

             // Sanitize thinking text just in case
             let sanitizedThinking = thinkingText;
             if (typeof DOMPurify !== 'undefined') {
                 // Allow basic formatting within thinking process if needed, or keep it plain
                 // Note: Thinking process is usually plain text, so allowing markup might render it incorrectly.
                 // Using textContent might be safer. If markup is expected, adjust allowed tags.
                 sanitizedThinking = DOMPurify.sanitize(thinkingText, { ALLOWED_TAGS: ['br'] }); // Allow line breaks
             }

            thinkingElement.textContent = sanitizedThinking; // Thinking process is usually plain text, use textContent for safety/simplicity
            scrollToBottom();
        }


        // Scroll to bottom
        function scrollToBottom() {
             // Use a slight delay to allow DOM rendering/MathJax typesetting before scrolling
             // Check if the chat container is actually visible before trying to scroll
             if (elements.chatMessages.offsetParent !== null) { // offsetParent is null when display is none
                 setTimeout(() => {
                     elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
                 }, 50); // Adjust delay if needed
             }
        }

        // Update send button state
        function updateSendButtonState() {
            const sendButton = elements.sendButton;
            const hasValidModel = elements.modelSelect.value !== '';
            const hasInput = elements.chatInput.value.trim() !== '';
            const hasImages = state.imageAttachments.length > 0;
            const visionEnabled = elements.visionToggle.checked;

            // Define SVG icon strings
            const sendSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
            const stopSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>`;

            // Determine if a request is currently being sent (streaming or non-streaming)
            const isRequestPending = state.pendingMessages > 0;


            if (state.streamController && isRequestPending) { // Streaming in progress (and counter indicates pending)
                sendButton.innerHTML = `<span>停止</span>${stopSvg}`;
                sendButton.disabled = false; // "Stop" button should always be enabled
                sendButton.title = "停止AI回复";
                sendButton.style.backgroundColor = '#e74c3c'; // Optional: Red color for Stop button
                 sendButton.style.color = 'white'; // Ensure text is readable
            } else { // Not streaming, or no pending messages
                sendButton.innerHTML = `<span>发送</span>${sendSvg}`;
                // Enable send button only if there's a valid model AND (text input OR (images AND vision enabled))
                const canSend = hasValidModel && (hasInput || (hasImages && visionEnabled));
                // Also disable if a non-streaming request is pending (state.pendingMessages > 0 implies this if not streaming)
                 sendButton.disabled = !canSend || isRequestPending; // Check isRequestPending again for non-streaming case

                 // Restore default button style
                 sendButton.style.backgroundColor = ''; // Reset to CSS variable
                 sendButton.style.color = ''; // Reset to CSS variable

                 if (!hasValidModel) {
                     sendButton.title = "请在设置中配置模型";
                 } else if (!hasInput && !(hasImages && visionEnabled)) {
                     sendButton.title = "请输入文本或上传图片";
                 } else if (isRequestPending) {
                     sendButton.title = "等待当前回复完成...";
                 }
                 else {
                     sendButton.title = "发送消息";
                 }
            }
             // Ensure the upload button is disabled while a request is pending
             elements.uploadButton.disabled = isRequestPending;
             if (isRequestPending) {
                 elements.uploadButton.title = "等待当前回复完成，无法上传图片";
             } else {
                 elements.uploadButton.title = "上传图片";
             }
        }

        // Add log
        function addLog(title, requestData) {
            const timestamp = new Date();
            const logId = `log-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`; // Add random string for uniqueness

            const logObj = {
                id: logId,
                title,
                timestamp,
                request: requestData,
                response: null, // Will store final response data or stream raw data
                error: null
            };

            state.logs.unshift(logObj); // Add new log at the beginning

            // Keep log history limited (e.g., last 50 logs)
            const maxLogs = 50;
            if (state.logs.length > maxLogs) {
                 state.logs = state.logs.slice(0, maxLogs);
                 // Remove corresponding DOM elements that are now outside the limit
                 // Iterate from the end of the container and remove excess elements
                 while (elements.logsContainer.children.length > maxLogs) {
                     if(elements.logsContainer.lastChild) {
                          elements.logsContainer.removeChild(elements.logsContainer.lastChild);
                     } else {
                         break; // Should not happen if lengths mismatch
                     }
                 }
            }


            // Create log element
            const logElement = document.createElement('div');
            logElement.className = 'log-item';
            logElement.id = logId; // Set the unique ID on the DOM element

            let requestDataDisplay = 'Error serializing request data';
            try {
                 requestDataDisplay = JSON.stringify(requestData, null, 2);
            } catch (e) {
                 console.error("Failed to stringify request data for log:", e, requestData);
                 requestDataDisplay += `: ${e.message}`;
            }


            logElement.innerHTML = `
                <div class="log-header" onclick="window.toggleLogBody('${logId}')">
                    <div class="log-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        ${title}
                    </div>
                    <div class="log-timestamp">${timestamp.toLocaleTimeString()}</div>
                </div>
                <div class="log-body" id="${logId}-body">
                    <div class="log-section">
                        <div class="log-section-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 10 4 15 9 20"></polyline>
                                <path d="M20 4v7a4 0 0 1-4 4H4"></path>
                            </svg>
                            请求数据
                        </div>
                        <pre class="log-content">${requestDataDisplay}</pre>
                    </div>
                    <div class="log-section" id="${logId}-response-section" style="display: none;">
                        <div class="log-section-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 10 20 15 15 20"></polyline>
                                <path d="M4 4v7a4 0 0 0 4 4h12"></path>
                            </svg>
                            响应数据
                        </div>
                        <pre class="log-content" id="${logId}-response"></pre>
                    </div>
                    <div class="log-section" id="${logId}-error-section" style="display: none;">
                        <div class="log-section-title" style="color: #e74c3c;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            错误信息
                        </div>
                        <pre class="log-content" id="${logId}-error" style="color: #e74c3c;"></pre>
                    </div>
                </div>
            `;

            elements.logsContainer.insertBefore(logElement, elements.logsContainer.firstChild);

            return logId;
        }

        // Update log response (for non-streaming)
        function updateLogResponse(logId, responseData) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                logObj.response = responseData;
            }

            const responseSection = document.getElementById(`${logId}-response-section`);
            const responseElement = document.getElementById(`${logId}-response`);

            if (responseSection && responseElement) {
                responseSection.style.display = 'block';
                 let responseDataDisplay = 'Error serializing response data';
                 try {
                     responseDataDisplay = JSON.stringify(responseData, null, 2);
                 } catch (e) {
                     console.error("Failed to stringify response data for log:", e, responseData);
                     responseDataDisplay += `: ${e.message}`;
                 }
                responseElement.textContent = responseDataDisplay;
            }
        }

        // Update log stream end
        function updateLogStreamEnd(logId, streamData) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                // Save raw data or mark as stream complete
                // Trim streamData to avoid logging massive amounts of data if needed
                const maxStreamLogLength = 5000; // Example limit
                 logObj.response = (streamData && streamData.length > maxStreamLogLength) ? streamData.substring(0, maxStreamLogLength) + '...' : streamData;
                 logObj.response = logObj.response || "流式响应 (已完成)"; // Fallback
            }

            const responseSection = document.getElementById(`${logId}-response-section`);
            const responseElement = document.getElementById(`${logId}-response`);

            if (responseSection && responseElement) {
                responseSection.style.display = 'block';
                 // Display saved response data (it's the raw stream text or marked as complete)
                responseElement.textContent = typeof logObj.response === 'string' ? logObj.response : JSON.stringify(logObj.response, null, 2);
            }
        }

        // Update log error
        function updateLogError(logId, errorMessage) {
            const logObj = state.logs.find(log => log.id === logId);
            if (logObj) {
                logObj.error = errorMessage;
            }

            const errorSection = document.getElementById(`${logId}-error-section`);
            const errorElement = document.getElementById(`${logId}-error`);

            if (errorSection && errorElement) {
                errorSection.style.display = 'block';
                errorElement.textContent = errorMessage;
                 // Update log title color
                 const logTitleElement = document.getElementById(logId)?.querySelector('.log-title');
                 if (logTitleElement) {
                     logTitleElement.style.color = '#e74c3c';
                 }
            }
        }

        // Toggle log body display/hide
        window.toggleLogBody = function(logId) {
            const logBody = document.getElementById(`${logId}-body`);
            if (logBody) {
                logBody.classList.toggle('open');
                 // Scroll log panel to make the opened log visible if needed
                 if (logBody.classList.contains('open')) {
                    // Find the parent panel and scroll it
                    const panel = logBody.closest('.panel');
                    if (panel) {
                        // Calculate the position of the log item relative to the panel
                        const logItem = logBody.parentElement; // The .log-item div
                        const itemTopRelativeToPanel = logItem.offsetTop - panel.scrollTop;

                         // Only scroll if the item header is not fully visible
                         // Check if the header is above the panel's top edge or below the panel's bottom edge minus some padding
                         const logHeaderHeight = logItem.querySelector('.log-header')?.offsetHeight || 40; // Estimate header height
                         const panelVisibleHeight = panel.offsetHeight - panel.paddingTop - panel.paddingBottom; // Approximate
                         const isHeaderVisible = itemTopRelativeToPanel >= 0 && (itemTopRelativeToPanel + logHeaderHeight) <= panelVisibleHeight;


                         if (!isHeaderVisible) {
                             // Scroll the panel so the log item header is visible
                             panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); // Scroll the panel itself into view
                             // Or scroll the panel's internal scrollbar to bring the log item into view
                             // panel.scrollTop = logItem.offsetTop - 20; // Scroll to item top with padding
                         }
                    }
                 }
            }
        };

        // Image preview
        function showImagePreview(src) {
            elements.previewImage.src = src;
            elements.imagePreview.classList.add('active');
            elements.overlay.classList.add('active');
        }

        // Close image preview
        function closeImagePreview() {
            elements.imagePreview.classList.remove('active');
            elements.overlay.classList.remove('active');
        }


        // Initialize application
        document.addEventListener('DOMContentLoaded', init);

        // Listen for input box content and image attachment changes, update send button state
        elements.chatInput.addEventListener('input', updateSendButtonState);
        // elements.imageInput change listener is handled by handleImageUpload calling updateSendButtonState
    </script>
</body>
</html>
