    </div>

    <!-- External JS Libraries -->
    <!-- KaTeX -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Main Application JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const chatbox = document.getElementById('chatbox');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const settingsPanel = document.getElementById('settings-panel');
            const logsPanel = document.getElementById('log-panel');
            const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
            const closeSettingsBtn = document.getElementById('closeSettingsBtn');
            const toggleLogsBtn = document.getElementById('toggleLogsBtn');
            const closeLogsBtn = document.getElementById('closeLogsBtn');
            const saveSettingsBtn = document.getElementById('saveSettingsBtn');
            const logEntries = document.getElementById('log-entries');
            const clearLogsBtn = document.getElementById('clearLogsBtn');
            const toggleThemeBtn = document.getElementById('toggleThemeBtn');
            const clearChatBtn = document.getElementById('clearChatBtn'); // Clear Chat Button

            // Settings Elements
            const apiUrlInput = document.getElementById('apiUrl');
            const apiKeyInput = document.getElementById('apiKey');
            const modelListDiv = document.getElementById('modelList');
            const newModelInput = document.getElementById('newModelInput');
            const addModelBtn = document.getElementById('addModelBtn');
            const selectedModelSelect = document.getElementById('selectedModel');
            const streamResponseCheckbox = document.getElementById('streamResponse');
            const enableImageSupportCheckbox = document.getElementById('enableImageSupport');
            const enableReasoningCheckbox = document.getElementById('enableReasoning'); // 新增: 思考过程启用复选框

            // Temperature & Max Tokens Elements
            const enableTemperatureCheckbox = document.getElementById('enableTemperature');
            const temperatureContainer = document.getElementById('temperatureContainer');
            const temperatureSlider = document.getElementById('temperature');
            const temperatureValueSpan = document.getElementById('temperatureValue');
            const enableMaxTokensCheckbox = document.getElementById('enableMaxTokens');
            const maxTokensContainer = document.getElementById('maxTokensContainer');
            const maxTokensSlider = document.getElementById('maxTokens');
            const maxTokensValueSpan = document.getElementById('maxTokensValue');

            const historyLengthSlider = document.getElementById('historyLength');
            const historyLengthValueSpan = document.getElementById('historyLengthValue');
            const customParamsListDiv = document.getElementById('customParamsList');
            const newParamKeyInput = document.getElementById('newParamKey');
            const newParamValueInput = document.getElementById('newParamValue');
            const addParamBtn = document.getElementById('addParamBtn');
            const fontFamilySelect = document.getElementById('fontFamily');
            const fontSizeSlider = document.getElementById('fontSize');
            const fontSizeValueSpan = document.getElementById('fontSizeValue');

            // Image Upload Elements
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const imageInput = document.getElementById('imageInput');
            const imagePreviewArea = document.getElementById('image-preview-area');
            const imagePreviewList = document.getElementById('image-preview-list'); // Container for previews

            // --- State Variables ---
            let settings = {
                apiUrl: '',
                apiKey: '',
                models: [], // Array of model name strings
                selectedModel: '',
                stream: true, // Default stream to true
                enableImageSupport: false,
                enableReasoning: false, // 新增: 默认禁用思考过程显示
                enableTemperature: false, // Default disabled
                temperature: 1.0,
                enableMaxTokens: false, // Default disabled
                maxTokens: 4096, // Default value
                historyLength: 10,
                customParams: {}, // Key-value pairs
                fontFamily: "'Noto Sans SC', 'Microsoft YaHei', sans-serif",
                fontSize: 16,
                theme: 'light' // 'light' or 'dark'
            };
            let chatHistory = []; // Stores message objects { role: 'user'/'assistant', content: '...' or [{type: 'text', ...}, {type: 'image_url', ...}] }
            let currentAIMessageElement = null; // For streaming updates
            let currentAIContent = ''; // Accumulator for final content
            let currentReasoningContent = ''; // Accumulator for reasoning content (added for thinking models)
            let abortController = null; // To cancel fetch requests
            let uploadedImages = []; // Store uploaded image data as { name: string, base64: string }

            // --- Initialization ---
            loadSettings();
            applySettings(); // Apply loaded settings to UI (sliders, checkboxes etc.)
            updateModelsUI();
            updateCustomParamsUI();
            updateSelectedModelOptions(); // Populate dropdown initially
            renderInitialMessages(); // Render any initial messages if needed
            adjustTextareaHeight(); // Adjust textarea height initially

            // --- Event Listeners ---

            // Panel Toggles
            toggleSettingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
            closeSettingsBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));
            toggleLogsBtn.addEventListener('click', () => logsPanel.classList.add('open'));
            closeLogsBtn.addEventListener('click', () => logsPanel.classList.remove('open'));

            // Settings Interactions
            saveSettingsBtn.addEventListener('click', () => {
                saveSettings();
                applySettings(); // Apply immediately after saving
                settingsPanel.classList.remove('open');
                addLog('Info', 'Settings saved and applied.');
                alert('设置已保存！');
            });

            addModelBtn.addEventListener('click', addModel);
            modelListDiv.addEventListener('click', handleModelListActions); // Event delegation

            addParamBtn.addEventListener('click', addCustomParam);
            customParamsListDiv.addEventListener('click', handleCustomParamListActions); // Event delegation

            // Temperature & Max Tokens Enable/Disable Logic
            enableTemperatureCheckbox.addEventListener('change', toggleTemperatureControl);
            enableMaxTokensCheckbox.addEventListener('change', toggleMaxTokensControl);

            temperatureSlider.addEventListener('input', () => {
                temperatureValueSpan.textContent = parseFloat(temperatureSlider.value).toFixed(1);
                // No need to update settings.temperature here, saveSettings does it
            });
            maxTokensSlider.addEventListener('input', () => {
                maxTokensValueSpan.textContent = maxTokensSlider.value;
                // No need to update settings.maxTokens here, saveSettings does it
            });
            historyLengthSlider.addEventListener('input', () => {
                historyLengthValueSpan.textContent = historyLengthSlider.value;
                 // No need to update settings.historyLength here, saveSettings does it
             });
            streamResponseCheckbox.addEventListener('change', () => {
                 // Update immediately for responsiveness? Or just on save? Let's wait for save.
                 // settings.stream = streamResponseCheckbox.checked;
            });
             enableImageSupportCheckbox.addEventListener('change', () => {
                 // Update immediately for responsiveness? Or just on save? Let's wait for save.
                 // settings.enableImageSupport = enableImageSupportCheckbox.checked;
                 uploadImageBtn.style.display = enableImageSupportCheckbox.checked ? 'flex' : 'none';
                 if (!enableImageSupportCheckbox.checked) {
                    clearImagePreviews(); // Clear previews if disabled
                 }
            });
            enableReasoningCheckbox.addEventListener('change', () => {
                // No immediate action needed, saveSettings will handle it
            });
            selectedModelSelect.addEventListener('change', () => {
                 // settings.selectedModel = selectedModelSelect.value; // Wait for save
            });

            fontFamilySelect.addEventListener('input', () => {
                settings.fontFamily = fontFamilySelect.value; // Apply font immediately
                applyAppearanceSettings();
            });
            fontSizeSlider.addEventListener('input', () => {
                settings.fontSize = parseInt(fontSizeSlider.value, 10);
                fontSizeValueSpan.textContent = `${settings.fontSize}px`;
                applyAppearanceSettings(); // Apply font size immediately
            });

            // Chat Input & Sending
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); // Prevent newline
                    sendMessage();
                }
            });
             userInput.addEventListener('input', adjustTextareaHeight); // Auto-resize textarea

             // Image Upload (Multiple)
            uploadImageBtn.addEventListener('click', () => {
                if (settings.enableImageSupport) {
                    imageInput.click();
                } else {
                    alert('请先在设置中启用图片理解功能。');
                }
            });
            imageInput.addEventListener('change', handleImageUpload);
            // Remove button logic handled via event delegation on imagePreviewList

            // Log Panel
            clearLogsBtn.addEventListener('click', () => {
                logEntries.innerHTML = '';
                addLog('Info', 'Logs cleared.');
            });

            // Theme Toggle
            toggleThemeBtn.addEventListener('click', toggleTheme);

            // Clear Chat
            clearChatBtn.addEventListener('click', clearConversation);

            // Copy Button Event Delegation (for messages)
            chatbox.addEventListener('click', handleChatboxClick);

            // --- Core Functions ---

             function renderInitialMessages() {
                 // If chatHistory was loaded from somewhere (not implemented here)
                 // or for the initial welcome message
                 chatbox.innerHTML = ''; // Clear placeholder
                 if (chatHistory.length === 0) {
                     displayMessage("你好！请先在“设置”中配置您的 API 信息。如果需要发送图片，请确保模型支持 Vision 功能。", 'assistant');
                 } else {
                     // Render existing history (if loaded)
                     chatHistory.forEach(msg => {
                         // Need to handle potential complex content format if loaded
                         if (typeof msg.content === 'string') {
                             displayMessage(msg.content, msg.role);
                         } else if (Array.isArray(msg.content)) {
                             const textContent = msg.content.find(part => part.type === 'text')?.text || '';
                             const images = msg.content.filter(part => part.type === 'image_url').map(part => part.image_url.url);
                             displayMessage(textContent, msg.role, images); // Pass array of base64
                         }
                     });
                 }
                 hljs.highlightAll(); // Apply highlighting to initial messages if any
             }

            function adjustTextareaHeight() {
                userInput.style.height = 'auto'; // Reset height
                // Use scrollHeight, but add a small buffer or use max function to prevent slight cutoffs
                const newHeight = Math.max(userInput.scrollHeight, 40); // Ensure min height
                userInput.style.height = newHeight + 'px';
            }

            function handleImageUpload(event) {
                const files = event.target.files;
                if (!files || files.length === 0) {
                    return;
                }

                const imagePromises = [];
                const maxImages = 10; // Limit number of images user can upload at once

                for (let i = 0; i < Math.min(files.length, maxImages); i++) {
                    const file = files[i];
                    if (file.type.startsWith('image/')) {
                        imagePromises.push(
                            new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onloadend = () => {
                                    // Check size (optional, e.g., limit to 5MB)
                                    // if (reader.result.length > 5 * 1024 * 1024) {
                                    //    reject(`Image ${file.name} is too large.`);
                                    //    return;
                                    // }
                                    resolve({ name: file.name, base64: reader.result });
                                };
                                reader.onerror = (error) => reject(error);
                                reader.readAsDataURL(file);
                            })
                        );
                    }
                }

                 if (files.length > maxImages) {
                     alert(`最多只能同时上传 ${maxImages} 张图片。`);
                 }

                Promise.all(imagePromises)
                    .then(newImages => {
                        uploadedImages = uploadedImages.concat(newImages); // Add new images
                        renderImagePreviews();
                        // Clear file input value to allow re-uploading the same file(s)
                        imageInput.value = '';
                    })
                    .catch(error => {
                        console.error("Error reading images:", error);
                        alert(`读取图片时出错: ${error}`);
                        imageInput.value = ''; // Clear input even on error
                    });
            }

            function renderImagePreviews() {
                imagePreviewList.innerHTML = ''; // Clear existing previews
                if (uploadedImages.length > 0) {
                    uploadedImages.forEach((imgData, index) => {
                        const container = document.createElement('div');
                        container.className = 'preview-image-container';

                        const img = document.createElement('img');
                        img.src = imgData.base64;
                        img.alt = `Preview ${index + 1}`;
                        img.title = imgData.name; // Show filename on hover

                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'remove-preview-btn';
                        removeBtn.textContent = 'X';
                        removeBtn.title = '移除此图片';
                        removeBtn.dataset.index = index; // Store index to remove
                        removeBtn.onclick = (e) => {
                             const indexToRemove = parseInt(e.target.dataset.index, 10);
                             removePreviewImage(indexToRemove);
                        };

                        container.appendChild(img);
                        container.appendChild(removeBtn);
                        imagePreviewList.appendChild(container);
                    });
                    imagePreviewArea.style.display = 'block';
                } else {
                    imagePreviewArea.style.display = 'none';
                }
            }

            function removePreviewImage(index) {
                if (index >= 0 && index < uploadedImages.length) {
                    uploadedImages.splice(index, 1); // Remove image from array
                    renderImagePreviews(); // Re-render the preview list
                }
            }

            function clearImagePreviews() {
                 uploadedImages = [];
                 renderImagePreviews();
                 imageInput.value = ''; // Clear file input
            }

            function sendMessage() {
                const userText = userInput.value.trim();

                if (!userText && uploadedImages.length === 0) {
                    return; // Don't send empty messages
                }
                 if (uploadedImages.length > 0 && !settings.enableImageSupport) {
                     alert('图片已选择，但未在设置中启用图片理解。请启用或移除图片。');
                     return;
                 }
                 if (!settings.apiUrl || !settings.apiKey) {
                     alert('请先在设置中配置 API URL 和 API Key！');
                     return;
                 }
                 if (!settings.selectedModel) {
                     alert('请先在设置中添加并选择一个模型！');
                     return;
                 }

                // --- Prepare User Message Content (OpenAI Vision format) ---
                let userMessageContent = [];
                if (userText) {
                    userMessageContent.push({ type: "text", text: userText });
                }
                if (uploadedImages.length > 0 && settings.enableImageSupport) {
                     uploadedImages.forEach(imgData => {
                         userMessageContent.push({
                             type: "image_url",
                             image_url: {
                                 // Remove the "data:image/...;base64," prefix if API requires pure base64
                                 // url: imgData.base64.split(',')[1]
                                 // Keep Data URI for broader compatibility unless API specifies otherwise
                                 url: imgData.base64
                                 // OpenAI also supports 'detail': 'low'/'high'/'auto' (optional)
                                 // detail: 'auto'
                             }
                         });
                     });
                }

                // If only image(s) are sent, add placeholder text for display
                const displayUserText = userText || (uploadedImages.length > 0 ? `[用户发送了 ${uploadedImages.length} 张图片]` : "");
                const displayImages = uploadedImages.map(img => img.base64); // Get base64 for display

                displayMessage(displayUserText, 'user', displayImages); // Display user message with images
                chatHistory.push({ role: 'user', content: userMessageContent }); // Add structured content to history

                // Clear input and image previews
                userInput.value = '';
                adjustTextareaHeight();
                clearImagePreviews(); // Use the clearing function

                // Disable input while waiting
                sendBtn.disabled = true;
                userInput.disabled = true;
                uploadImageBtn.disabled = true;

                // Prepare API request body
                const requestBody = {
                    model: settings.selectedModel,
                    messages: getHistoryContext(),
                    stream: settings.stream,
                    // Add other custom parameters from settings
                     ...settings.customParams
                };

                 // Conditionally add temperature and max_tokens
                 if (settings.enableTemperature) {
                     requestBody.temperature = settings.temperature;
                 }
                 if (settings.enableMaxTokens) {
                     requestBody.max_tokens = settings.maxTokens;
                 }

                addLog('Request', requestBody);

                // Create a new AbortController for this request
                abortController = new AbortController();
                const signal = abortController.signal;

                // --- Make API Call ---
                fetch(settings.apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${settings.apiKey}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: signal // Pass the signal to fetch
                })
                .then(response => {
                    if (!response.ok) {
                        // Try to read error body for more details
                        return response.json().then(err => {
                            const errorMsg = err.error?.message || JSON.stringify(err);
                            addLog('Error Response Body', err); // Log the full error
                            throw new Error(`HTTP error! status: ${response.status}, message: ${errorMsg}`);
                        }).catch((parseError) => {
                             // If error body is not JSON or empty, or parsing failed
                             addLog('Error Response Status', { status: response.status, statusText: response.statusText });
                             throw new Error(`HTTP error! status: ${response.status} ${response.statusText}. Could not parse error body.`);
                        });
                    }

                    if (settings.stream && response.body) {
                        // Handle streaming response
                        handleStreamResponse(response.body);
                    } else {
                        // Handle non-streaming response
                        return response.json().then(data => {
                            addLog('Response (Full)', data);
                            // Handle potential variations in response structure
                            const message = data.choices && data.choices[0]?.message;
                            const aiContent = message?.content;

                            if (aiContent) {
                                displayMessage(aiContent, 'assistant');
                                chatHistory.push({ role: 'assistant', content: aiContent });
                            } else {
                                console.warn("No content found in non-streaming response:", data);
                                addLog('Warning', 'No content found in non-streaming response.');
                                // Display a generic message or nothing?
                                // displayMessage("[API returned empty response]", 'error');
                            }
                            resetUIAfterResponse();
                        });
                    }
                })
                .catch(error => {
                    if (error.name === 'AbortError') {
                        addLog('Info', 'API request cancelled by user.');
                        // Optionally display a message in chat?
                        // displayMessage('请求已取消。', 'error');
                    } else {
                         console.error('API Call Error:', error);
                         addLog('Error', { message: error.message, stack: error.stack });
                         // Display a user-friendly error in the chat
                         displayMessage(`抱歉，请求失败： ${error.message}`, 'error');
                    }
                    resetUIAfterResponse(); // Always re-enable UI on error/abort
                });
            }

            function handleStreamResponse(responseBody) {
                // Create placeholder message element for AI response
                currentAIMessageElement = createMessageElement('', 'assistant');
                chatbox.appendChild(currentAIMessageElement);
                scrollToBottom();
                currentAIContent = ''; // Reset content accumulator for final answer
                currentReasoningContent = ''; // Reset content accumulator for reasoning (added for thinking models)

                const reader = responseBody.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                function processStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            addLog('Response (Stream End)', { fullContent: currentAIContent, reasoningContent: currentReasoningContent });
                            finalizeStream();
                            return;
                        }

                        buffer += decoder.decode(value, { stream: true });
                        // Process Server-Sent Events (SSE) lines
                        let lines = buffer.split('\n');
                        // Keep the last potentially incomplete line in the buffer
                        buffer = lines.pop() || '';

                        lines.forEach(line => {
                            line = line.trim(); // Trim whitespace
                            if (line.startsWith('data: ')) {
                                const dataContent = line.substring(6).trim();
                                if (dataContent === '[DONE]') {
                                    // Stream finished signal from OpenAI
                                    // We rely on reader.read() done signal primarily
                                    return;
                                }
                                try {
                                    const chunk = JSON.parse(dataContent);
                                    // Look for content delta in various possible locations
                                    if (settings.enableReasoning) { // 修正: 仅在启用时处理 reasoning_content
                                        const reasoningDelta = chunk.choices && chunk.choices[0]?.delta?.reasoning_content;
                                        if (reasoningDelta !== undefined) {
                                            currentReasoningContent += reasoningDelta; // Accumulate reasoning content
                                        }
                                    }
                                    const contentDelta = chunk.choices && chunk.choices[0]?.delta?.content;
                                    if (contentDelta !== undefined) {
                                        currentAIContent += contentDelta; // Accumulate final content
                                    }

                                    // Update the UI with combined content
                                    let fullContent = "";
                                    if (settings.enableReasoning && currentReasoningContent) {
                                        fullContent += "**思考过程：**\n" + currentReasoningContent + "\n\n";
                                    }
                                    if (currentAIContent) {
                                        fullContent += "**最终回答：**\n" + currentAIContent;
                                    }
                                    updateAIMessageContent(fullContent);

                                } catch (e) {
                                    // Ignore empty data lines or lines that are not valid JSON
                                    if (dataContent && dataContent !== '{}') {
                                        console.warn('Failed to parse stream chunk:', dataContent, e);
                                        addLog('Warning', `Stream parse error: ${e.message} on data: ${dataContent}`);
                                    }
                                }
                            } else if (line) {
                                // Handle non-SSE lines if necessary (e.g., some APIs might send plain text chunks)
                                // console.log("Received non-SSE line:", line);
                            }
                        });
                         scrollToBottom(); // Scroll as content arrives
                        processStream(); // Continue reading
                    }).catch(error => {
                         if (error.name === 'AbortError') {
                            addLog('Info', 'Stream reading cancelled.');
                            // Message was already added, finalize might add partial content
                         } else {
                             console.error('Stream reading error:', error);
                             addLog('Error', `Stream read error: ${error.message}`);
                             displayMessage(`流式读取错误: ${error.message}`, 'error');
                         }
                        finalizeStream(); // Finalize even on error to save what we have
                    });
                }
                processStream();
            }

             function updateAIMessageContent(content) {
                 if (currentAIMessageElement) {
                     const contentDiv = currentAIMessageElement.querySelector('.message-content');
                     if (contentDiv) {
                         try {
                             // Use marked to parse Markdown, then set innerHTML
                             // Marked sanitizes by default, which is good.
                             contentDiv.innerHTML = marked.parse(content);
                             // Re-apply syntax highlighting and KaTeX rendering after update
                             renderRichContent(contentDiv);
                         } catch (e) {
                             console.error("Error updating AI message content:", e);
                             contentDiv.textContent = content; // Fallback to plain text
                         }
                     }
                 }
             }

            function finalizeStream() {
                let fullContentFinal = "";
                if (settings.enableReasoning && currentReasoningContent) { // 修正: 仅在启用时包含思考过程
                    fullContentFinal += "**思考过程：**\n" + currentReasoningContent + "\n\n";
                }
                if (currentAIContent) {
                    fullContentFinal += "**最终回答：**\n" + currentAIContent;
                }
                if (fullContentFinal) {
                     // Add the complete message to history with combined content
                     chatHistory.push({ role: 'assistant', content: fullContentFinal });
                }
                 // Ensure final rendering pass on the completed message
                 if (currentAIMessageElement) {
                      const contentDiv = currentAIMessageElement.querySelector('.message-content');
                      if (contentDiv) {
                          renderRichContent(contentDiv); // Final render pass
                          // Ensure the copy button gets the final content
                          const copyBtn = currentAIMessageElement.querySelector('.message-copy-button');
                          if (copyBtn) {
                             copyBtn.dataset.clipboardText = contentDiv.textContent; // Update text for copy
                          }
                      }
                 }
                currentAIMessageElement = null;
                currentAIContent = '';
                currentReasoningContent = ''; // Reset reasoning content accumulator
                resetUIAfterResponse();
                scrollToBottom();
                 // Clean up abort controller
                 abortController = null;
            }

            function resetUIAfterResponse() {
                sendBtn.disabled = false;
                userInput.disabled = false;
                // Re-enable upload button based on settings, not just unconditionally
                uploadImageBtn.disabled = !settings.enableImageSupport;
                uploadImageBtn.style.display = settings.enableImageSupport ? 'flex' : 'none';
                abortController = null; // Reset abort controller
            }

            function getHistoryContext() {
                 const history = chatHistory.slice(-settings.historyLength); // Get last N messages
                 // Map directly, format is already correct for text and vision messages
                 return history;
            }

             // Modified displayMessage to handle an array of images for user messages
             function displayMessage(text, role, imagesBase64 = []) {
                 const messageElement = createMessageElement(text, role, imagesBase64);
                 chatbox.appendChild(messageElement);
                 // Render content AFTER appending to DOM
                 renderRichContent(messageElement.querySelector('.message-content'));
                 scrollToBottom();
             }

             // Modified createMessageElement to handle an array of images
            function createMessageElement(text, role, imagesBase64 = []) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', `${role}-message`);
                 if (role === 'error') { // Add specific class for error styling if needed
                    messageDiv.classList.add('error-message'); // You might need CSS for .error-message
                    messageDiv.style.backgroundColor = 'var(--error-color)'; // Basic error styling
                    messageDiv.style.color = '#fff';
                 }

                const contentDiv = document.createElement('div');
                contentDiv.classList.add('message-content');

                // Add copy button for the entire message (user or AI)
                const copyButton = document.createElement('button');
                copyButton.className = 'message-copy-button';
                copyButton.innerHTML = '&#x1F4CB;'; // Clipboard icon
                copyButton.title = '复制消息文本';
                // Store text content directly for reliable copying
                copyButton.dataset.clipboardText = text || "";
                messageDiv.appendChild(copyButton);

                 try {
                     // Use Marked.js to parse Markdown content safely
                     contentDiv.innerHTML = marked.parse(text || ""); // Handle potential null/empty text
                 } catch (e) {
                     console.error("Marked parsing error:", e);
                     contentDiv.textContent = text || ""; // Fallback to plain text
                 }

                // Add images if provided (mainly for user messages)
                if (Array.isArray(imagesBase64) && imagesBase64.length > 0 && role === 'user') {
                    const grid = document.createElement('div');
                    grid.className = 'user-image-grid';
                    imagesBase64.forEach(base64 => {
                        const img = document.createElement('img');
                        img.src = base64;
                        img.alt = "用户上传的图片";
                        // Optional: Add click to enlarge functionality later
                        grid.appendChild(img);
                    });
                    contentDiv.appendChild(grid); // Append image grid after text content
                }

                const timestampDiv = document.createElement('div');
                timestampDiv.classList.add('message-timestamp');
                timestampDiv.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                messageDiv.appendChild(contentDiv);
                messageDiv.appendChild(timestampDiv);

                return messageDiv;
            }

             function renderRichContent(element) {
                 if (!element) return;

                 // --- Render LaTeX Math using KaTeX ---
                 // Replace block math first (e.g., $$...$$) - Marked might create divs/pre for this
                 // A more robust approach might involve custom Marked renderers
                 element.innerHTML = element.innerHTML.replace(/\$\$([\s\S]*?)\$\$/g, (match, capture) => {
                     try {
                         return katex.renderToString(capture.trim(), { throwOnError: false, displayMode: true });
                     } catch (e) {
                         console.error("KaTeX block rendering error:", e);
                         return `<span style="color:var(--error-color);">[Math Error: ${e.message}]</span>`;
                     }
                 });

                 // Replace inline math (e.g., $...$) AFTER block math
                 element.innerHTML = element.innerHTML.replace(/(?<!\$)\$([^$]+?)\$/g, (match, capture) => {
                     // Avoid matching escaped dollars or already processed math
                     if (capture.includes('$')) return match; // Basic check for nested/unmatched
                     try {
                         return katex.renderToString(capture.trim(), { throwOnError: false, displayMode: false });
                     } catch (e) {
                         console.error("KaTeX inline rendering error:", e);
                          return `<span style="color:var(--error-color); font-family: monospace;">[Math Error]</span>`;
                     }
                 });

                 // --- Apply Syntax Highlighting using highlight.js ---
                 element.querySelectorAll('pre code').forEach((block) => {
                     // Ensure parent <pre> is styled for positioning
                     const preElement = block.closest('pre');
                     if (preElement) {
                         preElement.style.position = 'relative'; // Needed for copy button

                         // Add code block copy button if not already present
                         if (!preElement.querySelector('.copy-code-button')) {
                             const copyCodeButton = document.createElement('button');
                             copyCodeButton.className = 'copy-code-button';
                             copyCodeButton.textContent = 'Copy';
                             copyCodeButton.title = '复制代码块';
                             copyCodeButton.dataset.clipboardText = block.textContent; // Store text
                             // Insert button inside the <pre> tag, but ideally before <code> for layout
                             preElement.insertBefore(copyCodeButton, block);
                         } else {
                             // Update text content for existing button if content changed
                             const copyCodeButton = preElement.querySelector('.copy-code-button');
                             copyCodeButton.dataset.clipboardText = block.textContent;
                         }
                     }

                      // Check if already highlighted to avoid re-processing
                     if (!block.classList.contains('hljs-highlighted')) {
                         try {
                             hljs.highlightElement(block);
                             block.classList.add('hljs-highlighted'); // Mark as highlighted
                         } catch (e) {
                             console.error("Highlight.js error:", e);
                             // Optionally add an error indicator to the block
                             block.textContent = `Highlighting Error: ${e.message}\n\n${block.textContent}`;
                         }
                     }
                 });
             }

            // Handle clicks within the chatbox for copy buttons
            function handleChatboxClick(event) {
                 const target = event.target;

                 // Handle General Message Copy Button
                 if (target.classList.contains('message-copy-button')) {
                     const textToCopy = target.dataset.clipboardText;
                     copyToClipboard(textToCopy, target);
                 }
                 // Handle Code Block Copy Button
                 else if (target.classList.contains('copy-code-button')) {
                      const textToCopy = target.dataset.clipboardText;
                      copyToClipboard(textToCopy, target);
                 }
             }

            // Helper function for clipboard copying and button feedback
            function copyToClipboard(text, buttonElement) {
                if (!text) return; // Nothing to copy

                navigator.clipboard.writeText(text)
                    .then(() => {
                        const originalText = buttonElement.classList.contains('copy-code-button') ? 'Copy' : '&#x1F4CB;';
                         buttonElement.innerHTML = '已复制!'; // Use text for icon button too
                         buttonElement.classList.add('copied');
                         buttonElement.disabled = true; // Briefly disable

                        setTimeout(() => {
                             buttonElement.innerHTML = originalText;
                             buttonElement.classList.remove('copied');
                             buttonElement.disabled = false;
                        }, 1500); // Revert after 1.5 seconds
                    })
                    .catch(err => {
                        console.error('Failed to copy text: ', err);
                        alert('复制失败: ' + err.message); // Notify user
                    });
            }

            function scrollToBottom() {
                 // Add a small delay to allow rendering engine to catch up, especially with images/rich content
                 setTimeout(() => {
                     chatbox.scrollTop = chatbox.scrollHeight;
                 }, 50);
            }

            function addLog(type, data) {
                const entry = document.createElement('details');
                entry.className = 'log-entry';
                 // Keep logs closed by default unless it's an error
                 if (type === 'Error' || type === 'Warning') {
                     entry.open = true;
                 }

                const summary = document.createElement('summary');
                 const titleSpan = document.createElement('span');
                 titleSpan.textContent = `${type} Log`;
                 if (type === 'Error') titleSpan.style.color = 'var(--error-color)';
                 if (type === 'Warning') titleSpan.style.color = '#ffc107';

                 const timeSpan = document.createElement('span');
                 timeSpan.className = 'log-timestamp';
                 timeSpan.textContent = new Date().toLocaleString();
                 summary.appendChild(titleSpan);
                 summary.appendChild(timeSpan);

                const content = document.createElement('div');
                content.className = 'log-content';
                try {
                     // Attempt to stringify, handle potential circular references safely
                     content.textContent = JSON.stringify(data, (key, value) => {
                         // Basic circular reference check (might not catch all cases)
                         // A more robust solution would involve tracking visited objects
                         if (typeof value === 'object' && value !== null) {
                            // Simple check, might be too aggressive
                            // if (seen.has(value)) { return '[Circular]'; }
                            // seen.add(value);
                         }
                         // Handle specific types if needed (e.g., Error object)
                         if (value instanceof Error) {
                             return { message: value.message, stack: value.stack, name: value.name };
                         }
                         return value;
                     }, 2); // Pretty print JSON
                } catch (e) {
                     // Fallback for non-JSON data or stringify errors
                     content.textContent = String(data);
                     console.warn("Could not stringify log data:", data, e);
                }

                entry.appendChild(summary);
                entry.appendChild(content);

                logEntries.prepend(entry); // Add newest logs to the top

                 // Limit number of log entries (e.g., keep last 100)
                 const maxLogs = 100;
                 while (logEntries.children.length > maxLogs) {
                     logEntries.removeChild(logEntries.lastChild);
                 }
            }

             // --- Clear Conversation ---
             function clearConversation() {
                 if (confirm('确定要清除当前会话的所有消息记录吗？此操作无法撤销。')) {
                     chatHistory = []; // Clear the history array
                     chatbox.innerHTML = ''; // Clear the chatbox UI
                     // Display the initial welcome message again
                     displayMessage("会话已清除。你好！", 'assistant');
                     addLog('Info', 'Chat conversation cleared by user.');
                 }
             }

            // --- Settings Management ---

            function loadSettings() {
                const savedSettings = localStorage.getItem('aiChatSettings_v2'); // Use a new key if format changed significantly
                if (savedSettings) {
                    try {
                         const parsedSettings = JSON.parse(savedSettings);
                         // Merge saved settings with defaults carefully, ensuring types
                         settings = {
                             ...settings, // Start with defaults
                             ...parsedSettings, // Override with saved values
                             // Ensure complex types are valid
                             models: Array.isArray(parsedSettings.models) ? parsedSettings.models : [],
                             customParams: (typeof parsedSettings.customParams === 'object' && parsedSettings.customParams !== null && !Array.isArray(parsedSettings.customParams)) ? parsedSettings.customParams : {},
                             // Ensure boolean flags are boolean
                             stream: typeof parsedSettings.stream === 'boolean' ? parsedSettings.stream : true,
                             enableImageSupport: typeof parsedSettings.enableImageSupport === 'boolean' ? parsedSettings.enableImageSupport : false,
                             enableReasoning: typeof parsedSettings.enableReasoning === 'boolean' ? parsedSettings.enableReasoning : false, // 新增: 处理 enableReasoning
                             enableTemperature: typeof parsedSettings.enableTemperature === 'boolean' ? parsedSettings.enableTemperature : false,
                             enableMaxTokens: typeof parsedSettings.enableMaxTokens === 'boolean' ? parsedSettings.enableMaxTokens : false,
                             // Ensure numbers are numbers
                             temperature: typeof parsedSettings.temperature === 'number' ? parsedSettings.temperature : 1.0,
                             maxTokens: typeof parsedSettings.maxTokens === 'number' ? parsedSettings.maxTokens : 4096,
                             historyLength: typeof parsedSettings.historyLength === 'number' ? parsedSettings.historyLength : 10,
                             fontSize: typeof parsedSettings.fontSize === 'number' ? parsedSettings.fontSize : 16,
                             theme: ['light', 'dark'].includes(parsedSettings.theme) ? parsedSettings.theme : 'light'
                         };

                    } catch (e) {
                        console.error("Failed to parse saved settings:", e);
                        addLog('Error', 'Failed to load settings from localStorage. Using defaults.');
                         // Optionally clear corrupted settings: localStorage.removeItem('aiChatSettings_v2');
                    }
                }
                 // Apply loaded/default settings to the UI elements
                 updateSettingsUI();
                 // Apply appearance right away
                 applyAppearanceSettings();
            }

             // Updates the settings UI elements based on the current 'settings' object
             function updateSettingsUI() {
                 apiUrlInput.value = settings.apiUrl || '';
                 apiKeyInput.value = settings.apiKey || '';
                 streamResponseCheckbox.checked = settings.stream;
                 enableImageSupportCheckbox.checked = settings.enableImageSupport;
                 enableReasoningCheckbox.checked = settings.enableReasoning || false; // 新增: 设置思考过程复选框
                 uploadImageBtn.style.display = settings.enableImageSupport ? 'flex' : 'none';

                 // Temperature
                 enableTemperatureCheckbox.checked = settings.enableTemperature;
                 temperatureSlider.value = settings.temperature;
                 temperatureValueSpan.textContent = parseFloat(settings.temperature).toFixed(1);
                 toggleTemperatureControl(); // Apply disabled state based on checkbox

                 // Max Tokens
                 enableMaxTokensCheckbox.checked = settings.enableMaxTokens;
                 maxTokensSlider.value = settings.maxTokens;
                 maxTokensValueSpan.textContent = settings.maxTokens;
                 toggleMaxTokensControl(); // Apply disabled state based on checkbox

                 historyLengthSlider.value = settings.historyLength;
                 historyLengthValueSpan.textContent = settings.historyLength;

                 fontFamilySelect.value = settings.fontFamily;
                 fontSizeSlider.value = settings.fontSize;
                 fontSizeValueSpan.textContent = `${settings.fontSize}px`;

                 // Theme (handled by applyAppearanceSettings)
                 document.body.setAttribute('data-theme', settings.theme);
                 toggleThemeBtn.textContent = settings.theme === 'dark' ? '☀️' : '🌙';

                 // Update models and custom params UI separately as they have dedicated functions
                 updateModelsUI();
                 updateCustomParamsUI();
                 updateSelectedModelOptions(); // Ensure dropdown reflects loaded settings
                 selectedModelSelect.value = settings.selectedModel || ''; // Set selected model
             }

            function saveSettings() {
                // Update settings object from UI just before saving
                settings.apiUrl = apiUrlInput.value.trim();
                settings.apiKey = apiKeyInput.value.trim();
                settings.stream = streamResponseCheckbox.checked;
                settings.enableImageSupport = enableImageSupportCheckbox.checked;
                settings.enableReasoning = enableReasoningCheckbox.checked; // 新增: 保存思考过程设置
                settings.enableTemperature = enableTemperatureCheckbox.checked;
                settings.temperature = parseFloat(temperatureSlider.value);
                settings.enableMaxTokens = enableMaxTokensCheckbox.checked;
                settings.maxTokens = parseInt(maxTokensSlider.value, 10);
                settings.historyLength = parseInt(historyLengthSlider.value, 10);
                settings.selectedModel = selectedModelSelect.value;
                settings.fontFamily = fontFamilySelect.value;
                settings.fontSize = parseInt(fontSizeSlider.value, 10);
                 settings.theme = document.body.getAttribute('data-theme'); // Save current theme

                // Models and Custom Params are managed directly in the settings object by their functions

                try {
                    localStorage.setItem('aiChatSettings_v2', JSON.stringify(settings));
                } catch (e) {
                     console.error("Failed to save settings:", e);
                     addLog('Error', 'Failed to save settings to localStorage. Storage might be full.');
                     alert('无法保存设置。本地存储可能已满。');
                }
            }

             // Applies settings that affect the UI immediately (theme, font, etc.)
             // Also called after loading settings.
             function applySettings() {
                 applyAppearanceSettings();
                 // Update button visibility based on image support setting
                 uploadImageBtn.style.display = settings.enableImageSupport ? 'flex' : 'none';
                 uploadImageBtn.disabled = !settings.enableImageSupport; // Also disable if not supported
                 // Apply disabled states for Temp/Tokens sliders
                 toggleTemperatureControl();
                 toggleMaxTokensControl();
                 // Other settings (API key, URL, model) are used directly when making requests
             }

            function applyAppearanceSettings() {
                 document.body.style.fontFamily = settings.fontFamily;
                 document.body.style.fontSize = `${settings.fontSize}px`;
                 // Apply theme
                 document.body.setAttribute('data-theme', settings.theme);
                 toggleThemeBtn.textContent = settings.theme === 'dark' ? '☀️' : '🌙';
            }

            // --- Temperature & Max Tokens Control ---
            function toggleTemperatureControl() {
                 const enabled = enableTemperatureCheckbox.checked;
                 temperatureContainer.classList.toggle('disabled', !enabled);
                 temperatureSlider.disabled = !enabled;
                 // Optional: Visually indicate default value when disabled
                 // temperatureValueSpan.textContent = enabled ? parseFloat(temperatureSlider.value).toFixed(1) : 'Default';
            }
             function toggleMaxTokensControl() {
                 const enabled = enableMaxTokensCheckbox.checked;
                 maxTokensContainer.classList.toggle('disabled', !enabled);
                 maxTokensSlider.disabled = !enabled;
                 // Optional: Visually indicate default value when disabled
                 // maxTokensValueSpan.textContent = enabled ? maxTokensSlider.value : 'Default';
             }

            // --- Model Management ---
            function addModel() {
                const modelName = newModelInput.value.trim();
                if (modelName && !settings.models.includes(modelName)) {
                    settings.models.push(modelName);
                    newModelInput.value = '';
                    updateModelsUI();
                    updateSelectedModelOptions();
                     // Auto-select if it's the first model added or if none selected
                     if (settings.models.length === 1 || !settings.selectedModel) {
                         selectedModelSelect.value = modelName;
                         settings.selectedModel = modelName; // Update state immediately for save
                     }
                } else if (!modelName) {
                     alert('请输入模型名称。');
                } else {
                    alert('该模型名称已存在。');
                }
            }

            function removeModel(modelName) {
                settings.models = settings.models.filter(m => m !== modelName);
                updateModelsUI();
                updateSelectedModelOptions();
                 // If the removed model was the selected one, update selection
                 if (settings.selectedModel === modelName) {
                     settings.selectedModel = settings.models.length > 0 ? settings.models[0] : '';
                     selectedModelSelect.value = settings.selectedModel; // Update dropdown UI
                 }
            }

            function updateModelsUI() {
                modelListDiv.innerHTML = ''; // Clear current list
                settings.models.forEach(model => {
                    const div = document.createElement('div');
                    div.className = 'model-entry';
                    // Use html encoding for display if model names could contain special chars
                    const escapedModel = model.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    div.innerHTML = `
                        <input type="text" value="${escapedModel}" readonly style="flex-grow: 1; background-color: var(--ai-msg-bg);">
                        <button class="remove-btn" data-model="${model}">移除</button> <!-- Use original name in data -->
                    `;
                    modelListDiv.appendChild(div);
                });
            }

            function updateSelectedModelOptions() {
                const currentSelectedInUI = selectedModelSelect.value; // Value currently shown in dropdown
                selectedModelSelect.innerHTML = ''; // Clear existing options

                if (settings.models.length === 0) {
                     selectedModelSelect.innerHTML = '<option value="">请先添加模型</option>';
                     selectedModelSelect.disabled = true;
                     settings.selectedModel = ''; // Clear setting state if no models
                } else {
                    settings.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        selectedModelSelect.appendChild(option);
                    });
                     selectedModelSelect.disabled = false;

                     // Determine the value to select in the dropdown
                     let valueToSelect = '';
                     if (settings.models.includes(settings.selectedModel)) {
                         valueToSelect = settings.selectedModel; // Prefer value from settings state
                     } else if (settings.models.includes(currentSelectedInUI)) {
                          valueToSelect = currentSelectedInUI; // Fallback to current UI value if still valid
                     } else {
                         valueToSelect = settings.models[0]; // Default to first model if others invalid
                     }

                     selectedModelSelect.value = valueToSelect;
                     // Ensure settings.selectedModel is synchronised with the final dropdown value
                     // This is important if saveSettings() hasn't run yet
                     // settings.selectedModel = valueToSelect; // Let saveSettings handle final state update
                }
            }

             function handleModelListActions(event) {
                 if (event.target.classList.contains('remove-btn')) {
                     const modelToRemove = event.target.dataset.model;
                     if (modelToRemove) {
                         removeModel(modelToRemove);
                     }
                 }
             }

            // --- Custom Parameter Management ---
            function addCustomParam() {
                const key = newParamKeyInput.value.trim();
                const valueStr = newParamValueInput.value.trim();
                if (!key) {
                     alert('请输入参数 Key。');
                     return;
                 }
                 if (settings.customParams.hasOwnProperty(key)) {
                     if (!confirm(`参数 Key "${key}" 已存在。要覆盖它的值吗？`)) {
                        return;
                     }
                 }

                let value;
                try {
                     // Attempt to parse value as JSON (allows numbers, booleans, strings with quotes, arrays, objects)
                     value = JSON.parse(valueStr);
                } catch (e) {
                     alert('参数 Value 格式无效。请输入有效的 JSON 值（例如 "字符串", 123, true, false, null, ["a", 1], {"b": 2}）。无引号的字符串无效。');
                     return; // Exit if value is not valid JSON
                }

                 settings.customParams[key] = value;
                 newParamKeyInput.value = '';
                 newParamValueInput.value = '';
                 updateCustomParamsUI();
            }

            function removeCustomParam(key) {
                delete settings.customParams[key];
                updateCustomParamsUI();
            }

            function updateCustomParamsUI() {
                customParamsListDiv.innerHTML = '';
                for (const key in settings.customParams) {
                     if (settings.customParams.hasOwnProperty(key)) {
                         const div = document.createElement('div');
                         div.className = 'param-entry';
                         const escapedKey = key.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                         let valueDisplay = '';
                         try {
                            valueDisplay = JSON.stringify(settings.customParams[key]);
                         } catch {
                            valueDisplay = '[无法显示的值]'; // Should not happen with JSON validation
                         }
                         // Escape value for display in input attribute
                         const escapedValue = valueDisplay.replace(/'/g, "&#39;").replace(/"/g, "&quot;");

                         div.innerHTML = `
                             <input type="text" value="${escapedKey}" readonly title="${escapedKey}" style="flex: 1; background-color: var(--ai-msg-bg);">
                             <input type="text" value='${escapedValue}' readonly title='${escapedValue}' style="flex: 2; background-color: var(--ai-msg-bg);">
                             <button class="remove-btn" data-paramkey="${key}">移除</button>
                         `;
                         customParamsListDiv.appendChild(div);
                     }
                }
            }

             function handleCustomParamListActions(event) {
                 if (event.target.classList.contains('remove-btn')) {
                     const keyToRemove = event.target.dataset.paramkey;
                     if (keyToRemove) {
                         removeCustomParam(keyToRemove);
                     }
                 }
             }

             // --- Theme Toggling ---
            function toggleTheme() {
                const currentTheme = document.body.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                settings.theme = newTheme; // Update settings state
                applyAppearanceSettings(); // Apply the new theme immediately
                // Let user save explicitly via Save Settings button
            }

        }); // End DOMContentLoaded
    </script>

</body>
