<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赵倖億的AI聊天 Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .chat-container {
            max-width: 800px;
            margin: 50px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .chat-header {
            background: #4a90e2;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 1.5em;
        }
        .chat-messages {
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            background: #f9f9f9;
        }
        .chat-messages .message {
            margin-bottom: 15px;
        }
        .chat-messages .user {
            text-align: right;
        }
        .chat-messages .user .text {
            display: inline-block;
            background: #4a90e2;
            color: #fff;
            padding: 10px 15px;
            border-radius: 15px;
        }
        .chat-messages .bot .text {
            display: inline-block;
            background: #e2e2e2;
            color: #333;
            padding: 10px 15px;
            border-radius: 15px;
        }
        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
        }
        .chat-input textarea {
            flex: 1;
            padding: 10px;
            border: none;
            resize: none;
            font-size: 1em;
        }
        .chat-input button {
            background: #4a90e2;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
        }
        .chat-input button:hover {
            background: #357ab8;
        }
        .error-log {
            margin: 20px auto;
            max-width: 800px;
            background: #ffe6e6;
            color: #d9534f;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">赵倖億的AI聊天</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
            <textarea id="user-input" rows="2" placeholder="Type your message..."></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <div class="error-log" id="error-log" style="display: none;"></div>

    <script>
        const API_URL = "https://www.gptapi.us/v1/chat/completions";
        const API_KEY = "sk-Se2ngHV6MdeLoy1L0cEe8dC0884b4789B327A0C8B87bA403";
        const MAX_TOKENS = 8000;
        const TEMPERATURE = 0.6;

        const chatMessages = document.getElementById("chat-messages");
        const errorLog = document.getElementById("error-log");

        function appendMessage(text, sender) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender);
            const textDiv = document.createElement("div");
            textDiv.classList.add("text");
            textDiv.textContent = text;
            messageDiv.appendChild(textDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function logError(error) {
            const now = new Date();
            errorLog.style.display = "block";
            errorLog.textContent = `[${now.toLocaleString()}] Error: ${error}`;
        }

        async function sendMessage() {
            const userInput = document.getElementById("user-input");
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, "user");
            userInput.value = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-2024-11-20",
                        messages: [{ role: "user", content: message }],
                        max_tokens: MAX_TOKENS,
                        temperature: TEMPERATURE
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                const tokenUsage = data.usage.total_tokens;

                appendMessage(reply, "bot");
                console.log(`Token usage: ${tokenUsage}`);
            } catch (error) {
                logError(error.message);
            }
        }
    </script>
</body>
</html>
